      ctx.strokeStyle = C.magenta; ctx.lineWidth = 1; ctx.beginPath();
      for (let x = 0; x < w - 16; x++) {
        const yy = h - 16 + Math.sin(x * 0.3 + t * 4) * Math.abs(Math.sin(x * 0.05)) * 8;
        x ? ctx.lineTo(8 + x, yy) : ctx.moveTo(8, yy);
      }
      ctx.stroke();
      // playhead
      const px = 8 + ((t * .3) % 1) * (w - 16);
      ctx.strokeStyle = C.cyan; ctx.beginPath(); ctx.moveTo(px, fy); ctx.lineTo(px, h - 4); ctx.stroke();
    },

    kvm(ctx, w, h, t) {
      ctx.fillStyle = "#070c14"; ctx.fillRect(0, 0, w, h);
      // faux remote desktop
      for (let i = 0; i < 5; i++) { ctx.fillStyle = "rgba(120,160,200,.06)"; ctx.fillRect(8, 16 + i * 9, (w - 16) * (0.4 + (i % 3) * .2), 4); }
      // crosshair cursor
      const cx = w / 2 + Math.sin(t * 1.3) * (w / 3), cy = h / 2 + Math.cos(t * 0.9) * (h / 4);
      ctx.strokeStyle = C.cyan; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 7); ctx.stroke();
      ctx.fillStyle = "rgba(4,8,13,.7)"; ctx.fillRect(0, 0, w, 12);
      txt(ctx, "⌁ KVM BRIDGE · PiKVM-01", 6, 9, C.cyan, "7px 'Cascadia Code',monospace");
    },
  };

  function drawPhone(ctx, w, h, t, m, isError) {
    ctx.fillStyle = "#06090f"; ctx.fillRect(0, 0, w, h);
    const pw = Math.min(58, h * 0.62), ph = h - 8, px = (w - pw) / 2, py = 4;
    rr(ctx, px, py, pw, ph, 8); ctx.fillStyle = "#0b1220"; ctx.fill();
    ctx.strokeStyle = isError ? "rgba(255,65,95,.5)" : "rgba(120,160,200,.25)"; ctx.stroke();
    // notch
    rr(ctx, px + pw / 2 - 7, py + 2, 14, 3, 2); ctx.fillStyle = "#04070d"; ctx.fill();
    // page
    const ix = px + 3, iw = pw - 6, iy = py + 7;
    ctx.fillStyle = "#0a0f1a"; ctx.fillRect(ix, iy, iw, ph - 12);
    ctx.fillStyle = C.orange; ctx.fillRect(ix + 3, iy + 3, iw - 6, 6); // hero
    txt(ctx, "Checkout", ix + 5, iy + 8, "#2a1600", "5px 'Cascadia Code',monospace");
    ctx.fillStyle = "#0e1626"; ctx.fillRect(ix + 3, iy + 12, iw - 6, 9);
    ctx.fillStyle = "#0e1626"; ctx.fillRect(ix + 3, iy + 23, iw - 6, 9);
    // sticky nav (bottom)
    const navY = iy + ph - 12 - 12;
    ctx.fillStyle = "#111a29"; ctx.fillRect(ix, navY, iw, 12);
    for (let i = 0; i < 3; i++) { ctx.fillStyle = C.dim; ctx.beginPath(); ctx.arc(ix + 8 + i * (iw / 3), navY + 6, 2, 0, 7); ctx.fill(); }
    // pay button
    const btnY = isError ? navY - 4 : navY - 15;
    rr(ctx, ix + 4, btnY, iw - 8, 11, 3); ctx.fillStyle = "#635bff"; ctx.fill();
    txt(ctx, "PAY $500", (ix + iw / 2), btnY + 7.5, "#eae9ff", "5px 'Cascadia Code',monospace", "center");
    if (isError) {
      const blink = Math.floor(t * 3) % 2;
      if (blink) {
        ctx.strokeStyle = C.danger; ctx.lineWidth = 1.4;
        rr(ctx, ix + 2, btnY - 2, iw - 4, 17, 3); ctx.stroke();
      }
      txt(ctx, "◹ overlap @390px", w / 2, h - 2, C.danger, "6px 'Cascadia Code',monospace", "center");
    } else {
      txt(ctx, "390 × 844 · ADB", w / 2, h - 2, C.dim, "6px 'Cascadia Code',monospace", "center");
    }
  }

  /* ---------- code / terminal content ---------- */
  const K = "#ff7ab2", S = "#7ee787", V = "#9ecbff", F = "#d2a8ff", N = "#79c0ff", P = "#8b98a8", O = "#ffa657";
  const CODE_LINES = [
    { indent: 0, toks: [{ s: "export ", c: K }, { s: "function ", c: K }, { s: "QuoteWizard", c: F }, { s: "() {", c: P }] },
    { indent: 1, toks: [{ s: "const ", c: K }, { s: "[step, setStep] ", c: V }, { s: "= ", c: P }, { s: "useState", c: F }, { s: "(0)", c: N }] },
    { indent: 1, toks: [{ s: "const ", c: K }, { s: "price ", c: V }, { s: "= ", c: P }, { s: "estimate", c: F }, { s: "(roof)", c: V }] },
    { indent: 1, toks: [{ s: "return ", c: K }, { s: "(", c: P }] },
    { indent: 2, toks: [{ s: "<Card ", c: O }, { s: "glow", c: V }, { s: ">", c: O }] },
    { indent: 3, toks: [{ s: "<Stepper ", c: O }, { s: "value", c: V }, { s: "={step} />", c: P }] },
    { indent: 3, toks: [{ s: "<Quote ", c: O }, { s: "total", c: V }, { s: "={price} />", c: P }] },
    { indent: 3, toks: [{ s: "<PayButton ", c: O }, { s: "amount", c: V }, { s: "={deposit} />", c: P }] },
    { indent: 2, toks: [{ s: "</Card>", c: O }] },
    { indent: 1, toks: [{ s: ")", c: P }] },
    { indent: 0, toks: [{ s: "}", c: P }] },
    { indent: 0, toks: [{ s: "// safe-area inset applied ✓", c: S }] },
  ];
  const TERM_LINES = [
    { s: "$ vercel --prod", c: C.ice },
    { s: "▲ Vercel CLI 33.0", c: C.dim },
    { s: "  Building southshore-roofing", c: C.dim },
    { s: "  ✓ Compiled in 41s", c: C.ok },
    { s: "  ○ Collecting page data", c: C.dim },
    { s: "  ✓ 12 routes generated", c: C.ok },
    { s: "  λ /api/webhook  edge", c: C.cyan },
    { s: "  Uploading [====>   ]", c: C.warn },
    { s: "  ✓ Deployment ready", c: C.ok },
    { s: "  https://…vercel.app", c: C.blue },
  ];

  /* ============================================================
     SYSTEM MAP — radial node graph with data pulses
     ============================================================ */
  function drawMap(ctx, w, h, t) {
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.36;
    const machines = G.state.machines;
    const n = machines.length;
    // rotating faint rings
    ctx.strokeStyle = "rgba(53,242,230,.06)";
    for (let r = 0; r < 3; r++) { ctx.beginPath(); ctx.arc(cx, cy, R * (0.5 + r * 0.28), 0, 7); ctx.stroke(); }

    const nodes = machines.map((m, i) => {
      const a = (i / n) * Math.PI * 2 - Math.PI / 2 + t * 0.06;
      return { m, x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R };
    });

    // links
    nodes.forEach((nd) => {
      const busy = nd.m.status === "busy";
      const off = nd.m.status === "offline";
      ctx.strokeStyle = off ? "rgba(120,60,70,.15)" : busy ? "rgba(53,242,230,.5)" : "rgba(120,160,200,.12)";
      ctx.lineWidth = busy ? 1.4 : 0.8;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(nd.x, nd.y); ctx.stroke();
      if (busy) {
        const k = (t * 0.6) % 1;
        const px = G.lerp(cx, nd.x, k), py = G.lerp(cy, nd.y, k);
        ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.arc(px, py, 2, 0, 7); ctx.fill();
        const k2 = (t * 0.6 + 0.5) % 1;
        ctx.fillStyle = C.ice; ctx.beginPath(); ctx.arc(G.lerp(cx, nd.x, k2), G.lerp(cy, nd.y, k2), 1.4, 0, 7); ctx.fill();
      }
    });

    // machine nodes
    nodes.forEach((nd) => {
      const busy = nd.m.status === "busy", off = nd.m.status === "offline", alert = nd.m.alert;
      const col = off ? C.danger : alert ? C.danger : busy ? C.cyan : C.dim;
      ctx.fillStyle = "#081019"; ctx.beginPath(); ctx.arc(nd.x, nd.y, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = busy || alert ? 1.6 : 1; ctx.stroke();
      if (busy || alert) { ctx.globalAlpha = 0.3 + 0.3 * Math.sin(t * 4); ctx.beginPath(); ctx.arc(nd.x, nd.y, 11, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
      txt(ctx, nd.m.name.replace(/ /g, ""), nd.x, nd.y + 18, off ? C.danger : busy ? C.ice : C.dim, "6px 'Cascadia Code',monospace", "center");
    });

    // core
    const pulse = 1 + Math.sin(t * 2) * 0.06;
    const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22 * pulse);
    grad.addColorStop(0, "rgba(53,242,230,.9)"); grad.addColorStop(.4, "rgba(53,242,230,.25)"); grad.addColorStop(1, "rgba(53,242,230,0)");
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, 22 * pulse, 0, 7); ctx.fill();
    ctx.fillStyle = "#04141a"; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 7); ctx.fill();
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.4; ctx.stroke();
    // spinning ticks
    for (let i = 0; i < 8; i++) {
      const a = t * 0.8 + (i / 8) * Math.PI * 2;
      ctx.strokeStyle = "rgba(125,255,245,.5)"; ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14); ctx.lineTo(cx + Math.cos(a) * 17, cy + Math.sin(a) * 17); ctx.stroke();
    }
    txt(ctx, "GHOST", cx, cy + 2.5, "#eafffd", "6px 'Cascadia Code',monospace", "center");
  }

  /* ============================================================
     SPARKLINE (metrics / replay)
     ============================================================ */
  function drawSpark(ctx, w, h, t) {
    ctx.clearRect(0, 0, w, h);
    const s = G.state.metrics.series;
    if (!s.length) { txt(ctx, "awaiting telemetry…", w / 2, h / 2, C.dim, "8px 'Cascadia Code',monospace", "center"); return; }
    const max = Math.max.apply(null, s) * 1.15 || 1;
    // area
    ctx.beginPath(); ctx.moveTo(0, h);
    s.forEach((v, i) => { const x = (i / (s.length - 1 || 1)) * w, y = h - (v / max) * (h - 4) - 2; i ? ctx.lineTo(x, y) : ctx.lineTo(x, y); });
    ctx.lineTo(w, h); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "rgba(53,242,230,.35)"); g.addColorStop(1, "rgba(53,242,230,0)");
    ctx.fillStyle = g; ctx.fill();
    // line
    ctx.beginPath();
    s.forEach((v, i) => { const x = (i / (s.length - 1 || 1)) * w, y = h - (v / max) * (h - 4) - 2; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.4; ctx.stroke();
    // head dot
    const lx = w, ly = h - (s[s.length - 1] / max) * (h - 4) - 2;
    ctx.fillStyle = C.ice; ctx.beginPath(); ctx.arc(lx - 1, ly, 2, 0, 7); ctx.fill();
  }

  /* ---------- anomaly mini-shot ---------- */
  function drawAnomalyShot(cv, anomaly) {
    const s = size(cv); if (!s) return;
    const { ctx, w, h } = s;
    drawPhone(ctx, w, h, performance.now() / 1000, null, true);
  }

  /* ============================================================
     MASTER LOOP + registration
     ============================================================ */
  function attachTile(cv, machineId) { painters.push({ cv, kind: "tile", machineId }); }
  function attachMap(cv) { painters.push({ cv, kind: "map" }); }
  function attachSpark(cv) { painters.push({ cv, kind: "spark" }); }
  function attachAnomaly(cv) { painters.push({ cv, kind: "anom" }); }

  function starfield() {
    const cv = document.getElementById("starfield");
    if (!cv) return;
    const stars = [];
    function seed() {
      stars.length = 0;
      const n = Math.min(160, Math.floor((window.innerWidth * window.innerHeight) / 12000));
      for (let i = 0; i < n; i++) stars.push({ x: Math.random(), y: Math.random(), z: Math.random(), s: Math.random() * 1.4 + 0.2 });
    }
    seed(); window.addEventListener("resize", seed);
    painters.push({ cv, kind: "stars", stars });
  }

  function renderPass(t) {
    for (let pi = painters.length - 1; pi >= 0; pi--) {
      const p = painters[pi];
      if (p.kind === "anom" && !p.cv.isConnected) { painters.splice(pi, 1); continue; }
      const s = size(p.cv); if (!s) continue;
      const { ctx, w, h } = s;
      if (p.kind === "anom") { drawPhone(ctx, w, h, t, null, true); continue; }
      if (p.kind === "stars") {
        ctx.clearRect(0, 0, w, h);
        for (const st of p.stars) {
          const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * (0.5 + st.z) + st.x * 10));
          ctx.fillStyle = `rgba(${st.z > .7 ? "125,255,245" : "150,200,230"},${tw * (0.15 + st.z * 0.5)})`;
          const x = (st.x * w + (t * (4 + st.z * 10)) % w) % w;
          ctx.fillRect(x, st.y * h, st.s, st.s);
        }
      } else if (p.kind === "map") {
        drawMap(ctx, w, h, t);
      } else if (p.kind === "spark") {
        drawSpark(ctx, w, h, t);
      } else if (p.kind === "tile") {
        const m = G.engine.machineById(p.machineId);
        const scene = m ? (m.status === "offline" ? "idle" : m.scene) : "idle";
        (scenes[scene] || scenes.idle)(ctx, w, h, t, m);
        if (m && m.status === "offline") {
          ctx.fillStyle = "rgba(3,6,11,.72)"; ctx.fillRect(0, 0, w, h);
          txt(ctx, "⏻ OFFLINE", w / 2, h / 2, C.danger, "9px 'Cascadia Code',monospace", "center");
        }
      }
    }
  }
  let raf;
  function frame() { renderPass(performance.now() / 1000); raf = requestAnimationFrame(frame); }
  function startLoop() { if (!raf) frame(); }

  G.viz = { attachTile, attachMap, attachSpark, attachAnomaly, starfield, startLoop, renderPass, drawAnomalyShot };
})();

</script>
<script>
/* ============================================================
   GHOST // ui.js — DOM panels + wiring to the engine bus
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;
  const { h, $, clear, mount, DATA } = G;
  const refs = {};

  /* ============================================================
     BOOT SEQUENCE
     ============================================================ */
  function boot(done) {
    const el = $("#boot");
    const bar = h("i");
    const log = h("div", { class: "boot-log" });
    el.appendChild(h("div", { class: "boot-core" }, [
      h("div", { class: "boot-logo" }, [
        h("div", null, h("span", { class: "g" }, "GHOST")),
        h("div", { class: "tag" }, "Autonomous Command Center · Fable 5 core"),
      ]),
      log,
      h("div", { class: "boot-bar" }, bar),
    ]));

    const seq = [
      ["Initializing GHOST kernel", "ok"],
      ["Mounting Fable 5 vision + reasoning core", "hi"],
      ["Linking 8 machines · 2 desktops · VPS · phone · CRM", "ok"],
      ["Bridging PiKVM-01 · Pi cluster · Vault NAS", "ok"],
      ["Waking agents: ORCHESTRATOR · RECON · FORGE · KEEP", "hi"],
      ["Arming ARGUS visual-verification pipeline", "ok"],
      ["WARDEN security sentinel online — no threats", "ok"],
      ["Calibrating cameras · smart plugs · foot pedals", "ok"],
      ["All systems nominal. Standing by for mission.", "hi"],
    ];
    let i = 0;
    const iv = setInterval(() => {
      if (i < seq.length) {
        const [s, c] = seq[i];
        log.appendChild(h("div", { class: c }, "▸ " + s));
        while (log.childNodes.length > 8) log.removeChild(log.firstChild);
        bar.style.width = ((i + 1) / seq.length * 100) + "%";
        i++;
      } else {
        clearInterval(iv);
        setTimeout(() => { el.classList.add("done"); setTimeout(() => { el.remove(); done(); }, 700); }, 500);
      }
    }, 340);
  }

  /* ============================================================
     TOP BAR
     ============================================================ */
  function buildTopbar() {
    const el = $("#topbar");
    refs.cost = h("div", { class: "val" }, "$0.00");
    refs.costBar = h("i");
    refs.tok = h("div", { class: "val" }, "0");
    refs.tokBar = h("i");
    refs.rate = h("div", { class: "val amber" }, "0/s");
    refs.mode = h("span", { class: "v" }, "BUILD");
    refs.missionTitle = h("span", { class: "v", style: { maxWidth: "220px", overflow: "hidden", textOverflow: "ellipsis", display: "inline-block", whiteSpace: "nowrap", verticalAlign: "bottom" } }, "—");
    refs.threat = h("div", { class: "threat" }, [h("span", { class: "dot ok" }), h("span", null, "THREAT · NOMINAL")]);
    refs.clock = h("span", { class: "v" }, "00:00:00");

    const kill = h("button", { class: "killswitch", onclick: onKill, title: "Halt all agents & power down fleet" }, [
      h("span", { class: "glyph" }), h("span", null, "Emergency Stop"),
    ]);

    mount(el, [
      h("div", { class: "brand" }, [
        h("div", { class: "mark" }, "👻"),
        h("div", null, [h("div", { class: "word" }, "GHOST"), h("div", { class: "sub" }, "COMMAND CENTER")]),
      ]),
      h("div", { class: "sep" }),
      h("div", { class: "midcol", style: { display: "flex", flexDirection: "column", gap: "2px" } }, [
        h("div", { class: "sysline" }, [h("span", { class: "k up" }, "Mode"), refs.mode]),
        h("div", { class: "sysline", style: { minWidth: "0" } }, [h("span", { class: "k up" }, "Mission"), refs.missionTitle]),
      ]),
      h("div", { class: "meters" }, [
        meter("Cost", refs.cost, refs.costBar),
        meter("Tokens", refs.tok, refs.tokBar),
        h("div", { class: "meter" }, [
          h("div", { class: "lbl up" }, [h("span", null, "Throughput"), h("span", { class: "clockk" })]),
          refs.rate,
        ]),
      ]),
      h("div", { class: "sep" }),
      h("div", { style: { display: "flex", flexDirection: "column", gap: "2px", alignItems: "flex-end" } }, [
        h("div", { class: "sysline" }, [h("span", { class: "k up" }, "Uptime"), refs.clock]),
        refs.threat,
      ]),
      kill,
    ]);
  }
  function meter(label, valEl, barEl) {
    return h("div", { class: "meter" }, [
      h("div", { class: "lbl up" }, [h("span", null, label), h("span", null, "")]),
      valEl,
      h("div", { class: "bar" }, barEl),
    ]);
  }

  /* ============================================================
     MODE RAIL
     ============================================================ */
  function buildRail() {
    const el = $("#moderail");
    refs.modeBtns = {};
    const modeEls = DATA.modes.map((m) => {
      const b = h("button", { class: "mode" + (m.id === G.state.mode ? " active" : ""), title: m.blurb, onclick: () => G.engine.setMode(m.id) }, [
        h("span", { class: "ic" }, m.ic), h("span", { class: "nm" }, m.name),
      ]);
      refs.modeBtns[m.id] = b;
      return b;
    });
    refs.statAgents = h("div", { class: "n" }, "1");
    refs.statMachines = h("div", { class: "n" }, "8");
    refs.statAnom = h("div", { class: "n" }, "0");
    mount(el, [
      h("div", { class: "logo-lab" }, "GHOST · OS"),
      ...modeEls,
      h("button", { class: "rail-btn", title: "3D Home Lab", onclick: openHomelab }, "🧊"),
      h("div", { class: "rail-stats" }, [
        railStat(refs.statAgents, "Agents"),
        railStat(refs.statMachines, "Online"),
        railStat(refs.statAnom, "Caught"),
      ]),
    ]);
  }
  function railStat(nEl, label) { return h("div", { class: "rail-stat" }, [nEl, h("div", { class: "l" }, label)]); }

  /* ============================================================
     MACHINE GRID
     ============================================================ */
  function buildGrid() {
    const el = $("#machinegrid");
    const body = h("div", { class: "mg-body" });
    refs.tiles = {};
    DATA.machines.forEach((m) => {
      const cv = h("canvas");
      const dot = h("span", { class: "dot idle" });
      const st = h("span", { class: "st dim" }, "ONLINE");
      const task = h("div", { class: "tile-task" }, [h("span", { class: "who" }, ""), h("span", { class: "tt" }, "Standby")]);
      const prog = h("i");
      const rec = h("div", { class: "rec", style: { display: "none" } }, [h("i"), "REC"]);
      const tile = h("div", { class: "tile", data: { id: m.id }, onclick: () => selectTile(m.id) }, [
        h("div", { class: "tile-h" }, [dot, h("span", { class: "nm" }, m.name), h("span", { class: "kind" }, m.kind), st]),
        h("div", { class: "tile-screen" }, [cv, h("div", { class: "scrim" }), rec, h("div", { class: "res" }, m.res)]),
        h("div", { class: "tile-f" }, [task, h("div", { class: "tile-prog" }, prog)]),
      ]);
      refs.tiles[m.id] = { tile, dot, st, task, prog, rec, cv };
      body.appendChild(tile);
      G.viz.attachTile(cv, m.id);
    });
    mount(el, [
      panelH("Fleet · Live Screens", h("span", { class: "tick" }, "8 NODES")),
      body,
    ]);
    updateAllMachines();
  }
  function selectTile(id) {
    Object.values(refs.tiles).forEach((t) => t.tile.classList.remove("sel"));
    refs.tiles[id].tile.classList.add("sel");
    const m = G.engine.machineById(id);
    toast("ok", "🖥️", `${m.name} — ${m.kind} · ${m.res}${m.task ? " · " + m.task : ""}`);
  }
  function updateMachine(m) {
    const r = refs.tiles[m.id]; if (!r) return;
    const cls = m.status === "offline" ? "danger" : m.status === "busy" ? "busy" : m.id === "SEC" ? "ok" : "idle";
    r.dot.className = "dot " + cls;
    r.st.textContent = m.status.toUpperCase();
    r.st.className = "st " + (m.status === "busy" ? "hot" : m.status === "offline" ? "" : "dim");
    r.st.style.color = m.status === "offline" ? "var(--danger)" : "";
    r.task.querySelector(".who").textContent = m.agent ? DATA.agents[m.agent].name : "";
    r.task.querySelector(".tt").textContent = m.task || (m.status === "busy" ? "Working…" : "Standby");
    r.prog.style.width = (m.prog * 100) + "%";
    r.prog.className = m.alert ? "warn" : "";
    r.rec.style.display = m.status === "busy" ? "flex" : "none";
    r.tile.classList.toggle("alert", !!m.alert);
  }
  function updateAllMachines() { G.state.machines.forEach(updateMachine); }

  /* ============================================================
     TIMELINE
     ============================================================ */
  function buildTimeline() {
    refs.tlBody = h("div", { class: "tl-body" });
    mount($("#timeline"), [panelH("Mission Timeline", h("span", { class: "tick clockk-tl" }, "")), refs.tlBody]);
    renderTimeline();
  }
  function renderTimeline() {
    const body = refs.tlBody; clear(body);
    const mission = G.state.mission; if (!mission) return;
    mission.steps.forEach((step, i) => {
      const status = G.state.timeline[i] ? G.state.timeline[i].status : "pending";
      body.appendChild(h("div", { class: "tl-step " + status }, [
        h("div", { class: "rail" }, [
          h("div", { class: "node" }, status === "done" ? "✓" : status === "active" ? "▸" : (i + 1)),
          h("div", { class: "line" }),
        ]),
        h("div", { class: "txt" }, [
          h("div", { class: "t" }, step.title),
          h("div", { class: "m" }, step.detail),
        ]),
      ]));
    });
    // autoscroll to active
    const active = body.querySelector(".tl-step.active");
    if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  /* ============================================================
     SYSTEM MAP
     ============================================================ */
  function buildMap() {
    const cv = h("canvas");
    mount($("#systemmap"), [
      panelH("Global System Map", h("span", { class: "tick" }, "RADIAL")),
      h("div", { class: "sm-canvas-wrap" }, cv),
      h("div", { class: "sm-legend" }, [
        legend("var(--cyan)", "Active"), legend("var(--idle)", "Idle"),
        legend("var(--danger)", "Alert / Offline"),
      ]),
    ]);
    G.viz.attachMap(cv);
  }
  function legend(c, t) { return h("span", null, [h("span", { class: "dot", style: { background: c, boxShadow: "0 0 6px " + c } }), t]); }

  /* ============================================================
     AGENT FEED
     ============================================================ */
  function buildFeed() {
    refs.feedBody = h("div", { class: "af-body" });
    mount($("#agentfeed"), [panelH("Agent Comms", h("span", { class: "led" })), refs.feedBody]);
  }
  function addMessage(msg) {
    const a = msg.agent;
    const el = h("div", { class: "msg " + (msg.kind === "system" ? "system" : msg.kind === "alert" ? "alert" : "") }, [
      h("div", { class: "av", style: { background: a.color, boxShadow: "0 0 10px " + a.color + "66" } }, a.av),
      h("div", { class: "body" }, [
        h("div", { class: "meta" }, [
          h("span", { class: "name", style: { color: a.color } }, a.name),
          h("span", { class: "role" }, a.role || ""),
          h("span", { class: "time" }, G.clock(msg.time)),
        ]),
        h("div", { class: "text", html: msg.text }),
      ]),
    ]);
    refs.feedBody.appendChild(el);
    while (refs.feedBody.childNodes.length > 60) refs.feedBody.removeChild(refs.feedBody.firstChild);
    refs.feedBody.scrollTop = refs.feedBody.scrollHeight;
  }

  /* ============================================================
     ANOMALY PANEL
     ============================================================ */
  function buildAnomaly() {
    const el = $("#anomaly");
    refs.anBody = h("div", { class: "an-body" });
    mount(el, [panelH("Visual Anomaly Detected", h("span", { class: "led" })), refs.anBody]);
  }
  function showAnomaly(an) {
    const el = $("#anomaly");
    if (!an) { el.classList.remove("show"); return; }
    el.classList.add("show");
    const cv = h("canvas");
    clear(refs.anBody);
    refs.anBody.appendChild(h("div", { class: "an-title" }, "◹ " + an.title));
    refs.anBody.appendChild(row("Machine", DATA.machines.find((m) => m.id === an.machine).name));
    refs.anBody.appendChild(row("Viewport", an.viewport));
    refs.anBody.appendChild(row("Severity", an.severity));
    refs.anBody.appendChild(row("Elements", an.selector));
    refs.anBody.appendChild(h("div", { class: "an-shot" }, cv));
    refs.anBody.appendChild(h("div", { class: "an-action" }, [
      h("span", { class: "arrow" }, "↺"), h("span", null, an.action),
    ]));
    G.viz.attachAnomaly(cv);
  }
  function row(k, v) { return h("div", { class: "an-row" }, [h("span", { class: "k" }, k), h("span", { class: "v" }, v)]); }

  /* ============================================================
     CONTROLS
     ============================================================ */
  function buildControls() {
    refs.btnApprove = cbtn("approve", "✓", "Approve", () => G.engine.approveGate());
    refs.btnPause = cbtn("pause", "⏸", "Pause", () => G.engine.pause());
    refs.btnRedirect = cbtn("redirect", "↳", "Redirect", onRedirect);
    refs.btnTerminate = cbtn("terminate", "⏹", "Terminate", () => G.engine.terminate());
    refs.gateNote = h("div", { style: { padding: "0 10px 4px", fontSize: "10px", color: "var(--text-faint)", minHeight: "13px" } }, "");
    mount($("#controls"), [
      panelH("Mission Controls"),
      refs.gateNote,
      h("div", { class: "ctrl-grid" }, [refs.btnApprove, refs.btnPause, refs.btnRedirect, refs.btnTerminate]),
    ]);
    refreshControls();
  }
  function cbtn(cls, ic, label, onclick) {
    return h("button", { class: "cbtn " + cls, onclick }, [h("span", { class: "ic" }, ic), h("span", null, label)]);
  }
  function refreshControls() {
    const s = G.state;
    refs.btnApprove.disabled = !s.awaitingGate;
    refs.btnApprove.classList.toggle("pending", s.awaitingGate);
    refs.btnPause.querySelector("span:last-child").textContent = s.paused ? "Resume" : "Pause";
    refs.btnPause.disabled = !s.running && !s.awaitingGate;
    refs.btnTerminate.disabled = !s.running && !s.awaitingGate;
    refs.gateNote.textContent = s.gate ? "⏸ " + s.gate.text : (s.complete ? "✓ Mission complete." : s.paused ? "Paused." : "");
    refs.gateNote.style.color = s.gate ? "var(--warn)" : s.complete ? "var(--ok)" : "var(--text-faint)";
  }
  function onRedirect() {
    refs.cmdInput.focus();
    refs.cmdInput.placeholder = "Type a redirect for GHOST, then Enter…";
    refs.cmdInput.dataset.mode = "redirect";
    toast("ok", "↳", "Redirect mode — type an instruction in the command bar.");
  }

  /* ============================================================
     DECK — command bar + replay scrubber
     ============================================================ */
  function buildDeck() {
    // command bar
    refs.cmdInput = h("input", { class: "cmd-input", placeholder: "Give GHOST a mission…  e.g. “Launch a website & sales system for a roofing company”", onkeydown: onCmdKey });
    refs.voiceBtn = h("button", { class: "cmd-voice", onclick: onVoice }, [h("span", null, "🎙️"), h("span", null, "VOICE")]);
    const chips = h("div", { class: "cmd-suggest" }, [
      chip("🛠️ Roofing build mission", () => launchFromPrompt(DATA.missions.build.prompt, "build")),
      chip("🏢 Run RSG operations", () => G.engine.setMode("company")),
      chip("🔬 Research mission", () => G.engine.setMode("research")),
      chip("🚨 Trigger War Room", () => G.engine.setMode("warroom")),
      chip("🎙️ OneHand demo", () => G.engine.setMode("onehand")),
    ]);
    const cmd = h("div", { class: "panel cmdbar" }, [
      panelH("Command Input"),
      h("div", { class: "cmd-input-row" }, [
        h("span", { class: "cmd-prompt" }, "❯"),
        refs.cmdInput,
        h("button", { class: "cmd-go", onclick: () => submitCmd() }, [h("span", null, "DEPLOY"), h("span", null, "▸")]),
        refs.voiceBtn,
      ]),
      chips,
    ]);

    // replay
    const spark = h("canvas");
    refs.scrubFill = h("i");
    refs.scrubKnob = h("b");
    refs.scrubTime = h("div", { class: "tc" }, "00:00 / 00:00");
    refs.playBtn = h("button", { class: "pb", onclick: () => G.engine.pause() }, "⏸");
    refs.replayTag = h("span", { class: "tag" }, "REC ●");
    const track = h("div", { class: "track", onclick: () => { } }, [refs.scrubFill, refs.scrubKnob]);
    const replay = h("div", { class: "panel replay" }, [
      h("div", { class: "replay-h" }, [h("span", null, "◉ Mission Replay & Telemetry"), refs.replayTag]),
      h("div", { class: "spark" }, spark),
      h("div", { class: "scrub" }, [refs.playBtn, track, refs.scrubTime]),
    ]);
    G.viz.attachSpark(spark);

    mount($("#deck"), [cmd, replay]);
  }
  function chip(label, onclick) { return h("button", { class: "chip", onclick }, label); }
  function onCmdKey(e) { if (e.key === "Enter") submitCmd(); }
  function submitCmd() {
    const v = refs.cmdInput.value.trim();
    if (!v) return;
    if (refs.cmdInput.dataset.mode === "redirect") {
      G.engine.redirect(v);
      refs.cmdInput.value = ""; refs.cmdInput.dataset.mode = "";
      refs.cmdInput.placeholder = "Give GHOST a mission…";
      return;
    }
    const mode = classify(v);
    refs.cmdInput.value = "";
    launchFromPrompt(v, mode);
  }
  function classify(v) {
    const s = v.toLowerCase();
    if (/incident|down|failing|500|outage|broken|war ?room/.test(s)) return "warroom";
    if (/research|investigate|compare|report|study/.test(s)) return "research";
    if (/lead|proposal|client|crm|monthly|ops|operation|company/.test(s)) return "company";
    if (/voice|onehand|hands|accessib/.test(s)) return "onehand";
    return "build";
  }

  /* ============================================================
     LAUNCHER OVERLAY
     ============================================================ */
  function launchFromPrompt(prompt, mode) {
    const mission = DATA.missions[mode] || DATA.missions.build;
    const el = $("#launcher");
    el.hidden = false;
    const plan = h("div", { class: "launch-plan" });
    mission.steps.forEach((s, i) => plan.appendChild(h("div", { class: "pl", style: { animationDelay: (i * 60) + "ms" } }, [
      h("span", { class: "i" }, i + 1), h("span", null, s.title),
    ])));
    mount(el, h("div", { class: "sheet" }, [
      h("div", { class: "sheet-h" }, [h("h3", null, "Mission Briefing"), h("button", { class: "x", onclick: () => (el.hidden = true) }, "✕")]),
      h("div", { class: "launcher-body" }, [
        h("div", { class: "launch-title" }, DATA.modes.find((m) => m.id === mode).name + " Mode"),
        h("div", { class: "launch-mission" }, [
          h("div", { class: "faint up", style: { fontSize: "9px", marginBottom: "6px" } }, "Directive"),
          h("div", { class: "q" }, "“" + prompt + "”"),
        ]),
        h("div", { class: "faint up", style: { fontSize: "9px", margin: "16px 0 4px" } }, "GHOST plan · " + mission.steps.length + " phases"),
        plan,
        h("div", { class: "launch-actions" }, [
          h("button", { class: "launch-go", onclick: () => { el.hidden = true; G.engine.setMode(mode); } }, "▸ DEPLOY MISSION"),
          h("button", { class: "launch-cancel", onclick: () => (el.hidden = true) }, "Cancel"),
        ]),
      ]),
    ]));
  }

  /* ============================================================
     HOME LAB 3D
     ============================================================ */
  function openHomelab() {
    const el = $("#homelab");
    el.hidden = false;
    const scene = h("div", { class: "lab-scene" });
    scene.appendChild(h("div", { class: "lab-floor" }));
    const n = DATA.labDevices.length, R = 210;
    DATA.labDevices.forEach((d, i) => {
      const a = (i / n) * Math.PI * 2;
      const x = Math.cos(a) * R, z = Math.sin(a) * R;
      const node = h("div", { class: "lab-node", style: { transform: `translate(-50%,-50%) translate3d(${x}px, ${(i % 2 ? -1 : 1) * 22}px, ${z}px) rotateY(${-a}rad)` } }, [
        h("div", { class: "n" }, [h("span", { class: "dot ok" }), d.name]),
        h("div", { class: "ico" }, d.ico),
        h("div", { class: "k" }, d.kind),
      ]);
      scene.appendChild(node);
    });
    mount(el, h("div", { class: "sheet", style: { width: "min(880px,92vw)" } }, [
      h("div", { class: "sheet-h" }, [h("h3", null, "🧊 Home Lab · Physical Fleet"), h("button", { class: "x", onclick: () => (el.hidden = true) }, "✕")]),
      h("div", { class: "sheet-body" }, [
        h("div", { class: "lab-stage" }, scene),
        h("div", { class: "lab-cap" }, "Live 3D map of connected hardware. GHOST can power-cycle any node via smart plugs, take over a frozen machine through PiKVM-01, and migrate a running mission to another workstation — resuming from the last checkpoint."),
      ]),
    ]));
  }

  /* ============================================================
     EMERGENCY + TOASTS
     ============================================================ */
  function onKill() {
    if (G.state.locked) { G.engine.restore(); document.body.classList.remove("lockdown"); return; }
    G.engine.emergencyStop();
    document.body.classList.add("lockdown");
    toast("danger", "⛔", "EMERGENCY STOP engaged. All agents halted, fleet powered down.", 0, [
      { label: "RESTORE FLEET", onclick: (tEl) => { G.engine.restore(); document.body.classList.remove("lockdown"); tEl.remove(); } },
    ]);
  }
  function toast(kind, ic, text, ttl, actions) {
    const stack = $("#toast");
    const el = h("div", { class: "toast " + (kind || "") }, [
      h("span", { class: "ic" }, ic || "•"),
      h("div", null, [
        h("div", null, text),
        actions ? h("div", { style: { marginTop: "7px", display: "flex", gap: "6px" } },
          actions.map((a) => h("button", { class: "chip", style: { borderColor: "var(--danger)", color: "var(--danger-bright)" }, onclick: () => a.onclick(el) }, a.label))) : null,
      ]),
    ]);
    stack.appendChild(el);
    if (ttl !== 0) setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, ttl || 4200);
  }

  /* ============================================================
     SMALL HELPERS + WIRING
     ============================================================ */
  function panelH(title, right) {
    return h("div", { class: "panel-h" }, [h("span", { class: "led" }), h("span", null, title), right || null]);
  }

  function onVoice() {
    if (refs.voiceBtn.classList.contains("live")) return;
    refs.voiceBtn.classList.add("live");
    toast("ok", "🎙️", "Listening… (voice input simulated for this demo)");
    setTimeout(() => {
      addMessageRaw("You", "“GHOST — wake the lab, pull last night's leads, put the roofing quote on the big screen.”");
      setTimeout(() => { refs.voiceBtn.classList.remove("live"); G.engine.setMode("onehand"); }, 900);
    }, 1600);
  }
  function addMessageRaw(name, text) {
    addMessage({ agent: { name, role: "Operator", color: "#eafffd", av: "◈" }, text, kind: "msg", time: new Date() });
  }

  function updateMeters(m) {
    refs.cost.textContent = G.money(m.cost);
    refs.tok.textContent = G.compact(m.tokens);
    refs.rate.textContent = G.compact(m.rate) + "/s";
    refs.costBar.style.width = Math.min(100, m.cost / 6 * 100) + "%";
    refs.tokBar.style.width = Math.min(100, m.tokens / 480000 * 100) + "%";
    refs.tokBar.className = "amber";
  }
  function updateTick(s) {
    const up = Math.floor((Date.now() - s.uptimeStart) / 1000);
    refs.clock.textContent = G.dur(up).length > 5 ? G.dur(up) : "00:" + G.dur(up);
    refs.clock.textContent = new Date(up * 1000).toISOString().substr(11, 8);
    refs.statAgents.textContent = s.stats.agentsActive;
    refs.statMachines.textContent = s.stats.machinesOnline;
    refs.statAnom.textContent = s.stats.anomaliesCaught;
    // scrubber
    const frac = s.totalDur ? G.clampv(s.simTime / s.totalDur, 0, 1) : 0;
    refs.scrubFill.style.width = (frac * 100) + "%";
    refs.scrubKnob.style.left = (frac * 100) + "%";
    refs.scrubTime.textContent = G.dur(s.simTime) + " / " + G.dur(s.totalDur);
    refs.playBtn.textContent = s.paused || !s.running ? "▶" : "⏸";
    refs.replayTag.textContent = s.complete ? "◉ SAVED" : s.running && !s.paused ? "REC ●" : "❚❚ PAUSED";
  }
  function updateThreat(level) {
    const map = { nominal: ["ok", "THREAT · NOMINAL", ""], elevated: ["warn", "THREAT · ELEVATED", "warn"], lockdown: ["danger", "⛔ LOCKDOWN", "danger"] };
    const [dot, label, cls] = map[level] || map.nominal;
    refs.threat.className = "threat " + cls;
    refs.threat.innerHTML = "";
    G.append(refs.threat, [h("span", { class: "dot " + dot }), h("span", null, label)]);
  }
  function updateModeUI(mode) {
    Object.entries(refs.modeBtns).forEach(([id, b]) => b.classList.toggle("active", id === mode));
    refs.mode.textContent = mode.toUpperCase();
  }

  function wire() {
    G.bus.on("feed", addMessage);
    G.bus.on("machine", updateMachine);
    G.bus.on("machine:all", updateAllMachines);
    G.bus.on("metrics", updateMeters);
    G.bus.on("tick", updateTick);
    G.bus.on("step", renderTimeline);
    G.bus.on("mission:start", (mission) => { refs.missionTitle.textContent = mission.title; refs.missionTitle.title = mission.title; renderTimeline(); refreshControls(); updateThreat(G.state.threat); });
    G.bus.on("mission:end", () => { renderTimeline(); refreshControls(); });
    G.bus.on("gate", () => refreshControls());
    G.bus.on("control", () => refreshControls());
    G.bus.on("anomaly", showAnomaly);
    G.bus.on("mode", updateModeUI);
    G.bus.on("emergency", () => { updateThreat("lockdown"); refreshControls(); });
    G.bus.on("restore", () => { updateThreat("nominal"); refreshControls(); });
    G.bus.on("toast", (t) => toast(t.kind, t.ic, t.text));
  }

  G.ui = { boot, buildAll: function () { buildTopbar(); buildRail(); buildGrid(); buildTimeline(); buildMap(); buildFeed(); buildAnomaly(); buildControls(); buildDeck(); wire(); }, toast, emergency: onKill };
})();

</script>
<script>
/* ============================================================
   GHOST // shell.js — app bar, view router, and the real views:
   World Model · Command pipeline · Devices · Approvals · Audit
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;
  const { h, $, clear, mount } = G;
  const S = G.store, W = G.world, P = G.planner, O = G.orch;

  const NS = "http://www.w3.org/2000/svg";
  function s(tag, attrs, kids) {
    const el = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) { if (k === "on") continue; if (k.startsWith("on") && typeof attrs[k] === "function") el.addEventListener(k.slice(2), attrs[k]); else el.setAttribute(k, attrs[k]); }
    (Array.isArray(kids) ? kids : kids != null ? [kids] : []).forEach((c) => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  }

  const VIEWS = [
    { id: "ops", ic: "📡", label: "Live Ops" },
    { id: "command", ic: "❯", label: "Command" },
    { id: "world", ic: "🗺️", label: "World Model" },
    { id: "devices", ic: "🖥️", label: "Devices" },
    { id: "approvals", ic: "✓", label: "Approvals" },
    { id: "audit", ic: "🧾", label: "Audit" },
  ];
  let activeView = "ops";
  let currentPlan = null;
  let selectedEntity = null;
  const refs = {};

  /* ============================================================ APP BAR */
  function buildAppbar() {
    refs.tabs = {};
    const tabs = h("div", { class: "vtabs" }, VIEWS.map((v) => {
      const badge = v.id === "approvals" ? h("span", { class: "badge", style: { display: "none" } }, "0") : null;
      const el = h("button", { class: "vtab" + (v.id === activeView ? " active" : ""), onclick: () => nav(v.id) }, [
        h("span", { class: "ic" }, v.ic), h("span", { class: "lbl" }, v.label), badge,
      ]);
      refs.tabs[v.id] = el; if (badge) refs.apprBadge = badge;
      return el;
    }));

    refs.gcmd = h("input", { placeholder: "Tell GHOST what needs to happen…", onkeydown: (e) => { if (e.key === "Enter") submitCommand(); } });
    refs.ohToggle = h("button", { class: "oh-toggle", onclick: toggleOnehand }, [h("span", null, "✋"), h("span", null, "OneHand")]);

    mount($("#appbar"), [
      h("div", { class: "brand2" }, [
        h("div", { class: "mk" }, "👻"),
        h("div", null, [h("div", { class: "wm" }, "GHOST"), h("div", { class: "full" }, "Hardware Orchestration & Systems Terminal")]),
      ]),
      tabs,
      h("div", { class: "gcmd" }, [h("span", { class: "pr" }, "❯"), refs.gcmd, h("button", { class: "go", onclick: submitCommand }, "PLAN")]),
      h("div", { class: "appbar-right" }, [
        refs.ohToggle,
        h("button", { class: "kill2", title: "Halt all agents & power down fleet", onclick: () => G.ui.emergency() }, [h("span", { class: "g" }), h("span", null, "STOP")]),
      ]),
    ]);
  }

  function submitCommand() {
    const v = refs.gcmd.value.trim(); if (!v) return;
    currentPlan = P.plan(v);
    refs.gcmd.value = "";
    renderPlan(currentPlan);
    renderRun();
    nav("command");
    G.bus.emit("toast", { kind: "ok", ic: "❯", text: `Plan drafted — ${currentPlan.steps.length} steps, max impact L${currentPlan.maxImpact}.` });
  }

  function toggleOnehand() {
    if (G.onehand.isActive()) G.onehand.deactivate();
    else G.onehand.activate(G.onehand.defaultProfile());
  }

  /* ============================================================ ROUTER */
  function nav(view) {
    activeView = view;
    VIEWS.forEach((v) => { const el = $("#view-" + v.id); if (el) el.hidden = v.id !== view; });
    Object.entries(refs.tabs).forEach(([id, el]) => el.classList.toggle("active", id === view));
    S.setting("activeView", view);
    if (view === "world") renderWorld();
    if (view === "devices") renderDevices();
    if (view === "approvals") renderApprovals();
    if (view === "audit") renderAudit();
    if (view === "command") renderRun();
  }

  /* ============================================================ COMMAND VIEW */
  function buildCommandView() {
    refs.planBody = h("div", { class: "card-b" });
    refs.planActions = h("div", { class: "plan-actions" });
    refs.runCard = h("div", { class: "run-card" });
    const demos = h("div", { style: { display: "flex", gap: "6px", flexWrap: "wrap" } }, [
      demoChip("Investigate why the site is slow"),
      demoChip("Deploy the roofing site to production"),
      demoChip("Move qualified leads and follow up on missed calls"),
      demoChip("Start my dev workspace across both computers, one-handed"),
      demoChip("Build a workflow: when a lead misses a call, text them and notify the crew"),
      demoChip("Check last night's backups"),
    ]);
    mount($("#view-command"), h("div", { class: "view-inner" }, [
      h("div", { class: "view-head" }, [h("h2", null, "Command"), h("span", { class: "sub" }, "Every directive becomes a visible plan → approval → execution → verification."), h("span", { class: "spacer" }), demos]),
      h("div", { class: "cmd-grid" }, [
        h("div", { class: "plan-card" }, [h("div", { class: "card-h" }, "Execution Plan"), refs.planBody, refs.planActions]),
        refs.runCard,
      ]),
    ]));
    renderPlan(null); renderRun();
  }
  function demoChip(text) { return h("button", { class: "k-chip", onclick: () => { currentPlan = P.plan(text); renderPlan(currentPlan); renderRun(); nav("command"); } }, text); }

  function impactChip(lvl) {
    const m = P.IMPACT[lvl];
    return h("span", { class: "impact-chip", style: { background: "color-mix(in srgb," + m.color + " 18%, transparent)", color: m.color, border: "1px solid " + m.color } }, "L" + lvl + " " + m.name);
  }

  function renderPlan(plan) {
    clear(refs.planBody); clear(refs.planActions);
    if (!plan) { refs.planBody.appendChild(h("div", { class: "ent-empty" }, "Type a directive above (or pick a demo) to generate a plan.")); return; }
    refs.planBody.appendChild(h("div", { class: "plan-goal" }, plan.goal));
    refs.planBody.appendChild(h("div", { class: "plan-meta" }, [
      h("span", { class: "k-chip mode" }, plan.mode.toUpperCase()),
      h("span", { class: "k-chip" }, "max impact L" + plan.maxImpact),
      plan.approvalRequired ? h("span", { class: "k-chip warn" }, "approval required") : h("span", { class: "k-chip" }, "no approval"),
      plan.irreversibleCount ? h("span", { class: "k-chip warn" }, plan.irreversibleCount + " irreversible") : null,
      h("span", { class: "k-chip" }, "~" + plan.resource.estSeconds + "s · " + G.compact(plan.resource.estTokens) + " tok · " + G.money(plan.resource.estCost)),
    ]));
    if (plan.systems.length) refs.planBody.appendChild(h("div", null, [h("div", { class: "block-t" }, "Systems involved"),
      h("div", { class: "sys-chips" }, plan.systems.map((id) => h("span", { class: "k-chip" }, (W.entity(id) ? (W.entity(id).ico || "") + " " + W.entity(id).name : id))))]));
    if (plan.risks.length) refs.planBody.appendChild(h("div", null, [h("div", { class: "block-t" }, "Risks"),
      h("div", { class: "risk-list" }, plan.risks.map((r) => h("div", { class: "risk" }, [h("span", null, "⚠"), h("span", null, r)])))]));
    refs.planBody.appendChild(h("div", null, [h("div", { class: "block-t" }, "Plan · " + plan.steps.length + " steps"),
      h("div", { class: "plan-steps" }, plan.steps.map((st) => h("div", { class: "pstep" }, [
        impactChip(st.impact), h("span", null, st.title), h("span", { class: "agent", title: "verified against real state" }, (G.DATA.agents[st.agent] ? G.DATA.agents[st.agent].name : st.agent))])))]));
    refs.planBody.appendChild(h("div", { style: { fontSize: "10px", color: "var(--text-faint)" } }, "✓ " + plan.verificationSummary));

    const executing = plan.status === "executing" || plan.status === "completed";
    refs.planActions.appendChild(h("button", { class: "btn primary", disabled: plan.maxImpact >= 4 || executing, onclick: () => { O.start(plan); nav("command"); } }, executing ? "Executing…" : "▸ Execute Plan"));
    refs.planActions.appendChild(h("button", { class: "btn ghost", onclick: () => { currentPlan = null; renderPlan(null); } }, "Discard"));
  }

  function renderRun() {
    const card = refs.runCard; if (!card) return; clear(card);
    card.appendChild(h("div", { class: "card-h" }, [h("span", null, "Agent Orchestration"), h("span", { style: { marginLeft: "auto", fontSize: "9px", color: "var(--text-faint)" } }, "bounded agents · independent verification")]));
    const run = O.current || latestRun();
    if (!run) { card.appendChild(h("div", { class: "run-empty" }, "No active run.\nGenerate a plan and press Execute to coordinate agents.")); return; }
    const tasks = run.taskIds.map((id) => S.get("tasks", id)).filter(Boolean);
    const done = tasks.filter((t) => ["completed", "completed_warn", "rolled_back"].includes(t.status)).length;

    card.appendChild(h("div", { class: "run-status-strip" }, [
      statStrip("Status", run.status.replace(/_/g, " ")),
      statStrip("Tasks", done + "/" + tasks.length),
      statStrip("Verified", String(run.metrics.verifications)),
      statStrip("Approvals", String(run.metrics.approvals)),
      run.status === "completed" || run.status === "completed_warn"
        ? h("button", { class: "btn ghost", style: { marginLeft: "auto", padding: "5px 10px", fontSize: "9px" }, onclick: () => O.rollback(run.id) }, "↺ Rollback")
        : (O.current ? h("button", { class: "btn danger", style: { marginLeft: "auto", padding: "5px 10px", fontSize: "9px" }, onclick: () => O.cancel() }, "Cancel") : null),
    ]));

    const pending = S.query("approvals", (a) => a.runId === run.id && a.status === "pending")[0];
    if (pending) card.appendChild(h("div", { style: { margin: "10px 14px" } }, [
      h("div", { class: "approval-banner" }, "⏸ " + pending.prompt),
      h("div", { class: "appr-actions", style: { marginTop: "8px" } }, [
        h("button", { class: "btn approve", onclick: () => O.approve(pending.id) }, "✓ Approve"),
        h("button", { class: "btn reject", onclick: () => O.reject(pending.id) }, "✕ Reject"),
      ]),
    ]));

    const dag = h("div", { class: "dag" });
    tasks.forEach((t, i) => {
      const vr = t.verificationId ? S.get("verifications", t.verificationId) : null;
      const knob = ["completed", "completed_warn"].includes(t.status) ? "✓" : t.status === "failed" ? "✕" : t.status === "awaiting_approval" ? "⏸" : ["running", "verifying"].includes(t.status) ? "●" : (i + 1);
      dag.appendChild(h("div", { class: "task " + t.status }, [
        h("div", { class: "spine" }, [h("div", { class: "knob" }, String(knob)), h("div", { class: "conn" })]),
        h("div", { class: "body" }, [
          h("div", { class: "title" }, [h("span", null, t.title), statusPill(t.status)]),
          h("div", { class: "detail" }, t.detail),
          h("div", { class: "agent-tool" }, (G.DATA.agents[t.agent] ? G.DATA.agents[t.agent].name : t.agent) + " · " + t.tool + " · impact L" + t.impact + (t.reversible ? " · reversible" : " · irreversible")),
          vr ? h("div", { class: "verify " + (vr.passed ? (t.status === "completed_warn" ? "warn" : "pass") : "fail") }, [
            h("span", null, vr.passed ? "✓" : "✕"),
            h("div", null, [h("span", null, (vr.passed ? "Verified" : "Verification failed") + " — " + vr.evidence), h("div", { class: "m" }, "method: " + vr.method)]),
          ]) : (t.status === "verifying" ? h("div", { class: "verify" }, "⟳ verifying against real state…") : null),
        ]),
      ]));
    });
    card.appendChild(dag);
  }
  function statStrip(k, v) { return h("div", { class: "s" }, [h("span", null, k), h("b", null, v)]); }
  function statusPill(st) {
    const map = { completed: ["var(--ok)", "done"], completed_warn: ["var(--warn)", "warn"], running: ["var(--cyan)", "running"], verifying: ["var(--cyan)", "verifying"], awaiting_approval: ["var(--warn)", "needs approval"], failed: ["var(--danger)", "failed"], blocked: ["var(--idle)", "blocked"], pending: ["var(--idle)", "queued"], rolled_back: ["var(--idle)", "rolled back"], cancelled: ["var(--idle)", "cancelled"] };
    const [c, l] = map[st] || ["var(--idle)", st];
    return h("span", { class: "st-pill", style: { background: "color-mix(in srgb," + c + " 16%, transparent)", color: c } }, l);
  }
  function latestRun() { const r = S.all("runs"); return r.sort((a, b) => b.startedAt - a.startedAt)[0]; }

  /* ============================================================ WORLD VIEW */
  const CAT_COL = { user: 0, environment: 0, device: 1, camera: 1, repo: 2, integration: 2, credential: 2, deployment: 3, service: 3, database: 3, client: 4, workflow: 4, lead: 4, incident: 4, message: 4 };
  const NODE_W = 130, NODE_H = 34, COL_X = 210, V_GAP = 46;
  let nodePos = {};

  function buildWorldView() {
    refs.worldAnswer = h("div", { class: "world-answer" });
    refs.worldQ = h("input", { placeholder: "Ask the graph…  e.g. “what breaks if the database goes offline?”  ·  “what has access to production?”", onkeydown: (e) => { if (e.key === "Enter") runWorldQuery(); } });
    refs.graphHolder = h("div", { class: "graph-holder" }, [h("div", { class: "gq-hint" }, "click any node to trace dependencies & blast radius")]);
    refs.entDetail = h("div", { class: "ent-detail" });
    mount($("#view-world"), h("div", { class: "view-inner" }, [
      h("div", { class: "view-head" }, [h("h2", null, "World Model"), h("span", { class: "sub" }, W.entities().length + " entities · " + W.edges().length + " relationships (stored & queryable)")]),
      h("div", { class: "world-grid" }, [
        h("div", { class: "world-main" }, [
          h("div", { class: "world-q" }, [refs.worldQ, h("button", { class: "go", onclick: runWorldQuery }, "ASK")]),
          refs.worldAnswer,
          refs.graphHolder,
        ]),
        refs.entDetail,
      ]),
    ]));
    renderEntDetail(null);
  }

  function renderWorld() { drawGraph(); if (selectedEntity) selectEntity(selectedEntity, true); }

  function drawGraph(highlight) {
    const ents = W.entities().filter((e) => CAT_COL[e.type] != null);
    const cols = {};
    ents.forEach((e) => { const c = CAT_COL[e.type]; (cols[c] = cols[c] || []).push(e); });
    const maxCount = Math.max(...Object.values(cols).map((a) => a.length), 1);
    const H = maxCount * V_GAP + 30, Wd = 5 * COL_X + 30;
    nodePos = {};
    Object.keys(cols).forEach((c) => {
      const list = cols[c]; const startY = (H - list.length * V_GAP) / 2 + 10;
      list.forEach((e, i) => { nodePos[e.id] = { x: (+c) * COL_X + 20, y: startY + i * V_GAP, w: NODE_W, h: NODE_H }; });
    });

    const svg = s("svg", { viewBox: `0 0 ${Wd} ${H}`, preserveAspectRatio: "xMidYMid meet" });
    // edges first
    const eg = s("g");
    W.edges().forEach((e) => {
      const a = nodePos[e.from], b = nodePos[e.to]; if (!a || !b) return;
      const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
      const mx = (x1 + x2) / 2;
      let cls = "gedge"; if (W.ACCESS_RELS.includes(e.rel)) cls += " access";
      if (highlight) { if (highlight.blast && highlight.blast.has(e.from) && highlight.blast.has(e.to)) cls += " hi-blast"; else if (highlight.dep && highlight.dep.has(e.from) && highlight.dep.has(e.to)) cls += " hi-dep"; }
      eg.appendChild(s("path", { class: cls, d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}` }));
    });
    svg.appendChild(eg);
    // nodes
    ents.forEach((e) => {
      const p = nodePos[e.id];
      let cls = "gnode";
      if (highlight) { if (e.id === highlight.sel) cls += " sel"; else if (highlight.blast && highlight.blast.has(e.id)) cls += " blast"; else if (highlight.dep && highlight.dep.has(e.id)) cls += " dep"; else if (highlight.dim) cls += " dim"; }
      const st = e.status === "offline" ? "danger" : e.status === "degraded" ? "warn" : (e.connected === false) ? "idle" : "ok";
      const g = s("g", { class: cls, transform: `translate(${p.x},${p.y})`, onclick: () => selectEntity(e.id) });
      g.appendChild(s("rect", { width: p.w, height: p.h, rx: 6 }));
      g.appendChild(s("circle", { class: "gdot " + st, cx: 10, cy: p.h / 2, r: 3 }));
      g.appendChild(s("text", { class: "nm", x: 18, y: 15 }, trunc((e.ico ? e.ico + " " : "") + e.name, 18)));
      g.appendChild(s("text", { class: "ty", x: 18, y: 26 }, e.type));
      svg.appendChild(g);
    });
    clear(refs.graphHolder);
    refs.graphHolder.appendChild(svg);
    refs.graphHolder.appendChild(h("div", { class: "gq-hint" }, "click any node to trace dependencies & blast radius"));
  }
  function trunc(s2, n) { return s2.length > n ? s2.slice(0, n - 1) + "…" : s2; }

  function selectEntity(id, keep) {
    selectedEntity = id;
    const blast = new Set(W.blastRadius(id)); const dep = new Set(W.dependencies(id));
    drawGraph({ sel: id, blast, dep, dim: true });
    renderEntDetail(id, blast, dep);
  }

  function renderEntDetail(id, blast, dep) {
    const el = refs.entDetail; clear(el);
    if (!id) { el.appendChild(h("div", { class: "ent-empty" }, "Select a system to inspect its relationships, dependencies, and blast radius.")); return; }
    const e = W.entity(id); if (!e) return;
    blast = blast || new Set(W.blastRadius(id)); dep = dep || new Set(W.dependencies(id));
    const access = W.accessTo(id);
    el.appendChild(h("div", { class: "eh" }, [h("div", { class: "nm" }, (e.ico || "") + " " + e.name), h("div", { class: "ty" }, e.type)]));
    const b = h("div", { class: "eb" });
    // fields
    const fields = ["status", "os", "url", "provider", "connection", "tier", "stage", "score", "role"].filter((f) => e[f] != null);
    if (fields.length) b.appendChild(h("div", { class: "ent-block" }, [h("div", { class: "t" }, "Properties"),
      ...fields.map((f) => h("div", { class: "row" }, [h("span", null, f), h("span", { style: { color: "var(--text)" } }, String(e[f]))]))]));
    // blast radius
    b.appendChild(h("div", { class: "ent-block" }, [h("div", { class: "t" }, "Blast radius — breaks if offline"),
      h("div", { style: { display: "flex", alignItems: "baseline", gap: "8px" } }, [h("span", { class: "blast-big" }, String(blast.size)), h("span", { style: { fontSize: "10px", color: "var(--text-faint)" } }, "dependent system(s)")]),
      ...[...blast].map((x) => h("div", { class: "ent-rel" }, [h("span", { class: "r" }, "↑"), h("span", null, W.label(x))]))]));
    // dependencies
    if (dep.size) b.appendChild(h("div", { class: "ent-block" }, [h("div", { class: "t" }, "Depends on"),
      ...[...dep].map((x) => h("div", { class: "ent-rel" }, [h("span", { class: "r" }, "↓"), h("span", null, W.label(x))]))]));
    // access
    if (access.length) b.appendChild(h("div", { class: "ent-block" }, [h("div", { class: "t" }, "Access / authorization"),
      ...access.map((x) => h("div", { class: "ent-rel" }, [h("span", { class: "r" }, "🔑"), h("span", null, W.label(x))]))]));
    el.appendChild(b);
  }

  function runWorldQuery() {
    const q = refs.worldQ.value.trim(); if (!q) return;
    const res = W.nlQuery(q);
    refs.worldAnswer.classList.add("show");
    clear(refs.worldAnswer);
    refs.worldAnswer.appendChild(h("div", null, [h("b", null, res.summary)]));
    if (res.list && res.list.length) refs.worldAnswer.appendChild(h("div", { style: { marginTop: "4px", fontSize: "11px" } }, res.list.slice(0, 12).join("  ·  ")));
    if (res.target) { selectEntity(res.target); }
    else if (res.nodes && res.nodes.length) { const set = new Set(res.nodes); selectedEntity = null; drawGraph({ blast: set, dim: true }); }
  }

  /* ============================================================ DEVICES VIEW */
  function buildDevicesView() {
    refs.devBody = h("div", { class: "dev-table" });
    mount($("#view-devices"), h("div", { class: "view-inner" }, [
      h("div", { class: "view-head" }, [h("h2", null, "Device Registry"), h("span", { class: "sub" }, "Every action labels its real control method — API, SSH, RDP, KVM, or vision.")]),
      refs.devBody,
    ]));
  }
  function renderDevices() {
    const devs = W.entities().filter((e) => e.type === "device" || e.type === "camera");
    const tbl = h("table", { class: "dt" }, [
      h("thead", null, h("tr", null, ["Device", "OS / Type", "Control Method", "Capabilities", "Status", "Reachable", ""].map((th) => h("th", null, th)))),
      h("tbody", null, devs.map((d) => h("tr", null, [
        h("td", null, h("div", { class: "name" }, [h("span", null, d.ico || "🖥️"), h("span", null, d.name)])),
        h("td", null, d.os || d.type),
        h("td", null, h("span", { class: "method-badge" }, d.connection || "—")),
        h("td", null, (d.capabilities || []).map((c) => h("span", { class: "cap" }, c))),
        h("td", null, h("span", { class: "name" }, [h("span", { class: "dot " + (d.status === "offline" ? "danger" : "ok") }), d.status || "online"])),
        h("td", null, d.reachable ? "yes" : "no"),
        h("td", null, h("div", { class: "act" }, [
          h("button", { onclick: () => deviceAction(d, "wake") }, "Wake"),
          h("button", { onclick: () => deviceAction(d, "probe") }, "Probe"),
        ])),
      ]))),
    ]);
    clear(refs.devBody); refs.devBody.appendChild(tbl);
  }
  function deviceAction(d, kind) {
    if (kind === "wake") {
      S.patch("entities", d.id, { status: "online", reachable: true });
      S.audit({ type: "device.wake", actor: "INFRA", summary: `Woke ${d.name} via ${d.connection} (reversible).` });
      G.bus.emit("toast", { kind: "ok", ic: "⏻", text: `${d.name} online.` });
    } else {
      S.audit({ type: "device.probe", actor: "VISION", summary: `Probed ${d.name} — ${d.reachable ? "reachable" : "unreachable"} via ${d.connection}.` });
      G.bus.emit("toast", { kind: "ok", ic: "📡", text: `${d.name} — ${d.reachable ? "reachable" : "unreachable"} (${d.connection}).` });
    }
    renderDevices();
  }

  /* ============================================================ APPROVALS VIEW */
  function buildApprovalsView() {
    refs.apprBody = h("div", { class: "appr-list" });
    mount($("#view-approvals"), h("div", { class: "view-inner" }, [
      h("div", { class: "view-head" }, [h("h2", null, "Approvals"), h("span", { class: "sub" }, "High-impact and irreversible actions hold here until you decide.")]),
      refs.apprBody,
    ]));
  }
  function renderApprovals() {
    const pend = S.query("approvals", (a) => a.status === "pending").sort((a, b) => b.ts - a.ts);
    const resolved = S.query("approvals", (a) => a.status !== "pending").sort((a, b) => (b.resolvedAt || 0) - (a.resolvedAt || 0)).slice(0, 8);
    clear(refs.apprBody);
    if (!pend.length && !resolved.length) { refs.apprBody.appendChild(h("div", { class: "appr-empty" }, "No approvals requested. High-impact steps will appear here.")); }
    pend.forEach((a) => refs.apprBody.appendChild(h("div", { class: "appr-card" }, [
      h("div", { class: "ah" }, [impactChip(a.impact), h("span", { class: "t" }, a.title), h("span", { style: { marginLeft: "auto", fontSize: "9px", color: "var(--text-faint)" } }, a.reversible ? "reversible" : "IRREVERSIBLE")]),
      h("div", { class: "prompt" }, a.detail),
      h("div", { class: "appr-actions" }, [
        h("button", { class: "btn approve", onclick: () => O.approve(a.id) }, "✓ Approve"),
        h("button", { class: "btn reject", onclick: () => O.reject(a.id) }, "✕ Reject"),
      ]),
    ])));
    resolved.forEach((a) => refs.apprBody.appendChild(h("div", { class: "appr-card resolved" }, [
      h("div", { class: "ah" }, [impactChip(a.impact), h("span", { class: "t" }, a.title), h("span", { style: { marginLeft: "auto", fontSize: "10px", color: a.status === "approved" ? "var(--ok)" : "var(--danger-bright)" } }, a.status.toUpperCase())]),
    ])));
    updateApprBadge();
  }
  function updateApprBadge() {
    const n = S.query("approvals", (a) => a.status === "pending").length;
    if (refs.apprBadge) { refs.apprBadge.textContent = n; refs.apprBadge.style.display = n ? "grid" : "none"; }
  }

  /* ============================================================ AUDIT VIEW */
  function buildAuditView() {
    refs.auditBody = h("div", { class: "audit-list" });
    mount($("#view-audit"), h("div", { class: "view-inner" }, [
      h("div", { class: "view-head" }, [h("h2", null, "Audit & Verification"), h("span", { class: "sub" }, "Append-only. Every plan, approval, action, and verification is recorded.")]),
      refs.auditBody,
    ]));
  }
  const AT_CLASS = (t) => t.startsWith("plan") ? "at-plan" : t.startsWith("run") ? "at-run" : t.startsWith("approval") ? "at-approval" : t === "verify.failed" ? "at-verifyfail" : t.startsWith("verify") ? "at-verify" : "at-sys";
  function auditRow(rec) {
    return h("div", { class: "audit-row" }, [
      h("span", { class: "ts" }, G.clock(new Date(rec.ts))),
      h("span", { class: "atype " + AT_CLASS(rec.type) }, rec.type.replace(/\./g, " ")),
      h("span", { class: "actor" }, rec.actor || "system"),
      h("span", { class: "sum" }, rec.summary || ""),
    ]);
  }
  function renderAudit() { clear(refs.auditBody); S.auditLog().slice(0, 200).forEach((r) => refs.auditBody.appendChild(auditRow(r))); }

  /* ============================================================ WIRING */
  function wire() {
    G.bus.on("run:start", () => { if (activeView === "command") renderRun(); });
    G.bus.on("task:update", () => { if (activeView === "command") renderRun(); });
    G.bus.on("run:end", () => { if (activeView === "command") renderRun(); if (currentPlan) renderPlan(currentPlan); });
    G.bus.on("approval", () => { updateApprBadge(); if (activeView === "command") renderRun(); if (activeView === "approvals") renderApprovals(); });
    G.bus.on("approval:resolved", () => { updateApprBadge(); if (activeView === "command") renderRun(); if (activeView === "approvals") renderApprovals(); });
    G.bus.on("audit", (rec) => { if (activeView === "audit" && refs.auditBody) refs.auditBody.insertBefore(auditRow(rec), refs.auditBody.firstChild); });
    G.bus.on("store:change", (c) => { if (activeView === "devices" && c.coll === "entities") renderDevices(); });
    G.bus.on("onehand", (o) => { refs.ohToggle.classList.toggle("on", !!o.active); });
    G.bus.on("oh:action", (a) => {
      if (a.type === "nav") nav(a.view);
      else if (a.type === "focus-command") { refs.gcmd.focus(); }
      else if (a.type === "command") { currentPlan = P.plan(a.text); renderPlan(currentPlan); renderRun(); nav("command"); }
      else if (a.type === "emergency") G.ui.emergency();
      else if (a.type === "voice") { refs.gcmd.focus(); G.bus.emit("toast", { kind: "ok", ic: "🎙️", text: "Listening… (voice input simulated)" }); }
    });
  }

  function build() {
    buildAppbar();
    buildCommandView();
    buildWorldView();
    buildDevicesView();
    buildApprovalsView();
    buildAuditView();
    wire();
    updateApprBadge();
  }

  G.shell = { build, nav };
})();

</script>
<script>
/* ============================================================
   GHOST // app.js — bootstrap + router glue
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;

  function init() {
    // ambient visuals run immediately (during boot)
    G.viz.starfield();
    G.viz.startLoop();

    G.ui.boot(function () {
      // 1) seed the persistent world model (first run only)
      G.world.seed();

      // 2) reveal the app frame
      document.getElementById("app").hidden = false;

      // 3) build the Live-Ops command center + the operational views
      G.ui.buildAll();
      G.shell.build();

      // 4) start the live-ops simulation loop + flagship mission
      G.engine.run();
      setTimeout(function () { G.engine.start("build"); }, 500);

      // 5) restore prior view + OneHand state
      const view = G.store.setting("activeView") || "ops";
      G.shell.nav(view);
      const oh = G.store.setting("onehand");
      if (oh) G.onehand.activate(oh);
    });

    // keyboard: Esc closes overlays; Ctrl+K focuses the global command bar
    document.addEventListener("keydown", function (e) {
      const tag = (e.target.tagName || "").toLowerCase();
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); G.bus.emit("oh:action", { type: "focus-command" }); return; }
      if (tag === "input" || tag === "textarea") return;
      if (e.key === "Escape") { ["homelab", "launcher"].forEach((id) => { const el = document.getElementById(id); if (el) el.hidden = true; }); }
      if (e.code === "Space") { e.preventDefault(); G.engine.pause(); }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
