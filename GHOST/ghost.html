<script>
/* ============================================================
   GHOST // orchestrator.js — plan → task DAG → execute + verify
   - runs safe tasks, pauses at approval gates
   - applies REAL effects to the world model (with rollback data)
   - a task is only "completed" once verification re-reads state
   - every transition is audited
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;
  const S = G.store, W = G.world;

  const STATUS = ["pending", "awaiting_approval", "running", "verifying", "completed", "completed_warn", "failed", "blocked", "rolled_back", "cancelled"];
  let current = null;
  let driver = null;

  function agentName(id) { return (G.DATA.agents[id] && G.DATA.agents[id].name) || id; }

  /* ---------- effects (REAL world-model mutations) ---------- */
  function applyEffect(eff) {
    if (!eff || eff.op === "noop") return { ok: true, note: "no state change", before: null };
    switch (eff.op) {
      case "wake": {
        const before = eff.ids.map((id) => { const e = W.entity(id); return { id, status: e ? e.status : null, reachable: e ? e.reachable : null }; });
        eff.ids.forEach((id) => S.patch("entities", id, { status: "online", reachable: true }));
        return { ok: true, note: `${eff.ids.length} device(s) powered on`, before };
      }
      case "setField": {
        const e = W.entity(eff.id); const before = { id: eff.id, field: eff.field, prev: e ? e[eff.field] : null };
        S.patch("entities", eff.id, { [eff.field]: eff.to });
        return { ok: true, note: `${W.label(eff.id)}.${eff.field} = ${eff.to}`, before };
      }
      case "moveLeads": {
        const leads = W.entities("lead").filter((l) => l.stage === eff.from && (l.score || 0) >= (eff.minScore || 0));
        const before = leads.map((l) => ({ id: l.id, stage: eff.from }));
        leads.forEach((l) => S.patch("entities", l.id, { stage: eff.to }));
        return { ok: true, note: `${leads.length} lead(s) → ${eff.to}`, before, moved: leads.length };
      }
      case "createIncident": {
        const inc = S.put("entities", { id: G.id(), type: "incident", name: `Incident · ${W.label(eff.target)}`, status: "open", target: eff.target, ico: "🚨", opened: Date.now() });
        return { ok: true, note: `incident ${inc.id} opened`, before: { createdId: inc.id }, createdId: inc.id };
      }
      case "sendMessage": {
        // EXTERNAL side effect. GHOST prepares, but does not transmit on the
        // operator's behalf unless a connected + authorized channel exists.
        const twilioOff = W.entity("int.twilio") && !W.entity("int.twilio").connected && eff.channel === "sms";
        const rec = S.put("entities", { id: G.id(), type: "message", name: `Outreach draft (${eff.channel})`, status: twilioOff ? "blocked" : "prepared", ico: "✉️" });
        return { ok: true, warn: true, note: twilioOff ? "channel not connected — prepared, not sent" : "message prepared — external send requires connected+authorized channel", before: { createdId: rec.id } };
      }
      case "activateOnehand": {
        const before = { prev: S.setting("onehand") };
        const profile = G.onehand ? G.onehand.defaultProfile() : { hand: "right" };
        if (G.onehand) G.onehand.activate(profile);
        return { ok: true, note: "OneHand profile applied", before };
      }
      default: return { ok: true, note: "", before: null };
    }
  }

  function undoEffect(eff, before) {
    if (!eff || !before) return;
    if (eff.op === "wake") before.forEach((b) => S.patch("entities", b.id, { status: b.status, reachable: b.reachable }));
    else if (eff.op === "setField") S.patch("entities", before.id, { [before.field]: before.prev });
    else if (eff.op === "moveLeads") before.forEach((b) => S.patch("entities", b.id, { stage: b.stage }));
    else if (eff.op === "createIncident" && before.createdId) S.remove("entities", before.createdId);
    else if (eff.op === "sendMessage" && before.createdId) S.remove("entities", before.createdId);
    else if (eff.op === "activateOnehand") { if (G.onehand) G.onehand.deactivate(); S.setting("onehand", before.prev); }
  }

  /* ---------- verification (re-read real state) ---------- */
  function verifyTask(task, effResult) {
    const eff = task.effect || {};
    const v = task.verify || { method: "observe" };
    if (v.method === "observe" && eff.op === "noop") return { passed: true, method: "observation", evidence: "Read-only step — output inspected." };
    switch (eff.op) {
      case "wake": {
        const ok = eff.ids.every((id) => (W.entity(id) || {}).status === "online");
        return { passed: ok, method: "device state probe", evidence: eff.ids.map((id) => `${W.label(id)}=${(W.entity(id) || {}).status}`).join(", ") };
      }
      case "setField": {
        const e = W.entity(eff.id); const ok = e && String(e[eff.field]) === String(eff.to);
        return { passed: ok, method: "entity field assertion", evidence: `${W.label(eff.id)}.${eff.field} == ${e ? e[eff.field] : "∅"}` };
      }
      case "moveLeads": {
        const n = W.entities("lead").filter((l) => l.stage === eff.to).length;
        return { passed: (effResult.moved || 0) >= 0, method: "CRM query", evidence: `${n} lead(s) now in stage “${eff.to}”` };
      }
      case "createIncident": {
        const ok = !!W.entity(effResult.createdId);
        return { passed: ok, method: "record existence check", evidence: ok ? `incident ${effResult.createdId} present` : "not found" };
      }
      case "activateOnehand": {
        const ok = !!S.setting("onehand");
        return { passed: ok, method: "settings assertion", evidence: ok ? "OneHand profile active" : "inactive" };
      }
      case "sendMessage":
        return { passed: true, warn: true, method: "artifact check", evidence: effResult.note };
      default:
        return { passed: true, method: "observation", evidence: "step output inspected" };
    }
  }

  /* ---------- run lifecycle ---------- */
  function start(plan) {
    stop();
    const run = S.put("runs", {
      id: G.id(), planId: plan.id, command: plan.command, goal: plan.goal, mode: plan.mode,
      status: "running", startedAt: Date.now(), systems: plan.systems,
      taskIds: [], metrics: { tokens: 0, tools: 0, verifications: 0, approvals: 0 },
    });
    const tasks = plan.steps.map((st) => S.put("tasks", {
      id: G.id(), runId: run.id, stepId: st.id, title: st.title, detail: st.detail,
      agent: st.agent, tool: st.tool, impact: st.impact, reversible: st.reversible,
      effect: st.effect, verify: st.verify, deps: (st.deps || []).map((d) => d), holds: !!st.holds,
      status: "pending",
    }));
    // remap step-id deps → task ids
    const byStep = {}; plan.steps.forEach((st, i) => (byStep[st.id] = tasks[i].id));
    tasks.forEach((tk, i) => (tk.deps = (plan.steps[i].deps || []).map((d) => byStep[d]).filter(Boolean)));
    run.taskIds = tasks.map((t) => t.id);
    S.patch("plans", plan.id, { status: "executing", runId: run.id });
    current = run;
    S.audit({ type: "run.started", actor: "orchestrator", run: run.id, summary: `Executing plan: ${plan.goal}` });
    G.bus.emit("run:start", { run, tasks, plan });
    tick();
    driver = setInterval(tick, 850);
    return run;
  }

  function runTasks() { return current ? current.taskIds.map((id) => S.get("tasks", id)) : []; }

  function tick() {
    if (!current) return stop();
    const tasks = runTasks();
    const done = (t) => ["completed", "completed_warn", "rolled_back"].includes(t.status);
    const dead = (t) => ["failed", "blocked", "cancelled"].includes(t.status);

    if (tasks.some((t) => t.status === "awaiting_approval")) return; // gated — wait for human

    const next = tasks.find((t) => t.status === "pending" && (t.deps || []).every((d) => { const dt = S.get("tasks", d); return dt && done(dt); }));
    if (!next) {
      if (tasks.every(done)) return finish("completed");
      if (tasks.some(dead)) return finish("failed");
      return; // waiting on deps of gated/failed branch
    }

    // approval gate
    if (next.impact >= 3 || next.holds) {
      setTask(next, "awaiting_approval");
      const ap = S.put("approvals", {
        id: G.id(), runId: current.id, taskId: next.id, title: next.title, detail: next.detail,
        impact: next.impact, reversible: next.reversible, status: "pending", ts: Date.now(),
        prompt: `Approve “${next.title}” — impact L${next.impact} (${G.planner.IMPACT[next.impact].name})${next.reversible ? "" : ", IRREVERSIBLE"}?`,
      });
      current.metrics.approvals++;
      S.audit({ type: "approval.requested", actor: "orchestrator", run: current.id, task: next.id, summary: ap.prompt });
      G.bus.emit("approval", ap);
      G.bus.emit("toast", { kind: "warn", ic: "⏸", text: `Approval required: ${next.title}` });
      return;
    }
    executeTask(next);
  }

  // synchronous: run effect + verify in one call (robust vs. timer throttling).
  // pacing between tasks comes from the tick interval — one task per tick.
  function executeTask(task) {
    setTask(task, "running");
    current.metrics.tools++;
    S.audit({ type: "task.running", actor: agentName(task.agent), run: current.id, task: task.id, summary: `${task.title} — ${task.tool}` });

    let effResult;
    try { effResult = applyEffect(task.effect); }
    catch (e) { setTask(task, "failed", { error: String(e) }); S.audit({ type: "task.failed", actor: agentName(task.agent), run: current.id, task: task.id, summary: `Effect error: ${e}` }); return; }
    task.effectNote = effResult.note; task.beforeData = effResult.before; S.put("tasks", task);

    const vr = verifyTask(task, effResult);
    const rec = S.put("verifications", { id: G.id(), runId: current.id, taskId: task.id, method: vr.method, passed: vr.passed, evidence: vr.evidence, ts: Date.now() });
    current.metrics.verifications++;
    task.verificationId = rec.id;
    if (!vr.passed) {
      setTask(task, "failed", { verification: vr });
      S.audit({ type: "verify.failed", actor: "VISION", run: current.id, task: task.id, summary: `Verification FAILED — ${vr.evidence}` });
    } else {
      setTask(task, (vr.warn || effResult.warn) ? "completed_warn" : "completed", { verification: vr });
      S.audit({ type: "verify.passed", actor: "VISION", run: current.id, task: task.id, summary: `Verified via ${vr.method}: ${vr.evidence}` });
    }
  }

  function setTask(task, status, extra) {
    task.status = status; if (extra) Object.assign(task, extra);
    S.put("tasks", task);
    G.bus.emit("task:update", task);
  }

  function approve(approvalId) {
    const ap = S.get("approvals", approvalId); if (!ap || ap.status !== "pending") return;
    S.patch("approvals", approvalId, { status: "approved", resolvedAt: Date.now() });
    S.audit({ type: "approval.granted", actor: "operator", run: ap.runId, task: ap.taskId, summary: `Approved: ${ap.title}` });
    G.bus.emit("approval:resolved", { ap, decision: "approved" });
    const task = S.get("tasks", ap.taskId);
    if (task) executeTask(task);
    if (!driver) driver = setInterval(tick, 850);
  }
  function reject(approvalId) {
    const ap = S.get("approvals", approvalId); if (!ap || ap.status !== "pending") return;
    S.patch("approvals", approvalId, { status: "rejected", resolvedAt: Date.now() });
    const task = S.get("tasks", ap.taskId);
    if (task) setTask(task, "blocked");
    S.audit({ type: "approval.denied", actor: "operator", run: ap.runId, task: ap.taskId, summary: `Denied: ${ap.title}` });
    G.bus.emit("approval:resolved", { ap, decision: "rejected" });
    finish("blocked");
  }

  function finish(status) {
    if (!current) return;
    stopDriver();
    S.patch("runs", current.id, { status, endedAt: Date.now() });
    if (current.planId) S.patch("plans", current.planId, { status });
    S.audit({ type: "run.ended", actor: "orchestrator", run: current.id, summary: `Run ${status.toUpperCase()} — ${current.goal}` });
    G.bus.emit("run:end", { run: S.get("runs", current.id), status });
    G.bus.emit("toast", { kind: status === "completed" ? "ok" : "danger", ic: status === "completed" ? "✓" : "⚠", text: `Run ${status}: ${current.goal}` });
    current = null;
  }

  function rollback(runId) {
    const run = S.get("runs", runId); if (!run) return;
    const tasks = run.taskIds.map((id) => S.get("tasks", id)).filter(Boolean);
    let n = 0;
    tasks.slice().reverse().forEach((t) => {
      if (["completed", "completed_warn"].includes(t.status) && t.reversible && t.effect && t.effect.op !== "noop") {
        undoEffect(t.effect, t.beforeData); setTask(t, "rolled_back"); n++;
      }
    });
    S.patch("runs", runId, { status: "rolled_back" });
    S.audit({ type: "run.rolledback", actor: "operator", run: runId, summary: `Rolled back ${n} reversible task(s).` });
    G.bus.emit("run:end", { run: S.get("runs", runId), status: "rolled_back" });
    G.bus.emit("toast", { kind: "ok", ic: "↺", text: `Rolled back ${n} reversible action(s).` });
  }

  function cancel() { if (current) { runTasks().forEach((t) => { if (!["completed", "completed_warn"].includes(t.status)) setTask(t, "cancelled"); }); finish("cancelled"); } }
  function stopDriver() { if (driver) { clearInterval(driver); driver = null; } }
  function stop() { stopDriver(); current = null; }

  G.orch = { start, approve, reject, rollback, cancel, stop, runTasks, _tick: tick, get current() { return current; }, STATUS };
})();

</script>
<script>
/* ============================================================
   GHOST // onehand.js — PHANTOM HAND accessibility subsystem
   A first-class operating mode: builds an adaptive one-handed
   control layout from a capability profile and materially
   reduces reach, precision, and key-combination effort.
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;
  const { h } = G;

  let active = null;   // active profile
  let dock = null;
  let input = null;    // RSGInput manager — real device state, never a checkbox

  /* Hardware is wired here, but it is never the only path: every action is
     registered with its on-screen dock button and its number key as fallbacks
     BEFORE anything is bound to a device. RSGInput refuses the bind otherwise. */
  function ensureInput() {
    if (input || !window.RSGInput) return input;
    /* gamepad-class (no prompt) + WebHID (prompt, covers pedals and switches
       that don't emulate a keyboard) */
    input = window.RSGInput.createManager({
      source: window.RSGInput.defaultSource(),
      storageKey: "ghost.input.mappings.v1"
    });
    ACTIONS.forEach((a, i) => {
      input.registerAction(a.act, a.label, ["on-screen", "keyboard:" + (i + 1)]);
    });
    input.on("action", (e) => {
      const item = ACTIONS.filter(a => a.act === e.actionId)[0];
      if (item) dispatch(item);
    });
    input.on("status", () => paintDeviceStatus());
    input.on("devicechange", () => paintDeviceStatus());
    return input;
  }

  /* The requirements are stated BEFORE the chooser opens, not in an error
     afterwards — "pair it in system settings first" is useless as a failure
     message. requestDevice() is called synchronously from this click so the
     browser still sees a user gesture. */
  function connectDevice() {
    if (!input) return;
    const el = dock && dock.querySelector("#oh-dev");
    if (el) { el.textContent = "… " + input.connectRequirements(); el.className = "oh-aid"; }
    input.requestDevice().then((res) => {
      if (!res.ok && el) {
        el.className = "oh-aid oh-alert";
        el.textContent = "⚠ " + (res.message || input.status().message);
      }
      paintDeviceStatus();
    });
  }

  /* Status is specific and honest — connected/none/disconnected/denied — and
     the disconnect notice is on-screen, so dismissing it never needs the
     device that just went away. */
  function paintDeviceStatus() {
    const el = dock && dock.querySelector("#oh-dev");
    if (!el || !input) return;
    const s = input.status();
    const ico = { "connected": "🎮", "disconnected": "⚠", "denied": "⚠", "no-device": "○", "unsupported": "○" }[s.state];
    el.textContent = ico + " " + (s.state === "connected"
      ? "device connected · " + s.capabilities.buttons + " button" + (s.capabilities.buttons === 1 ? "" : "s")
      : s.message);
    el.className = "oh-aid" + (s.state === "disconnected" || s.state === "denied" ? " oh-alert" : "");
  }

  // Shared Onehand OS profile (rsg.ability.v1) → GHOST's count-based shape.
  // Returns null when the shell hasn't written one.
  function sharedProfile() {
    try {
      const p = JSON.parse(localStorage.getItem("rsg.ability.v1") || "null");
      if (!p || p.v !== 1) return null;
      const count = ["thumb", "index", "middle", "ring", "pinky"]
        .filter(f => p.fingers && p.fingers[f]).length;
      return {
        hand: p.hand === "left" ? "left" : "right",
        thumbReach: (typeof p.reachMM === "number" ? p.reachMM : 95) < 80 ? "limited" : "full",
        fingers: count || 1,
        grip: p.grip || "moderate",
        fatigue: p.fatigue || "low",
        // passed through untouched — absent means the resolver marks them
        // unresolved rather than quietly assuming a middle value
        precision: p.precision,
        permanence: p.permanence,
        inputs: Array.isArray(p.inputs) ? p.inputs : [],
        targetScale: typeof p.targetScale === "number" ? p.targetScale : 1.4,
      };
    } catch (e) { return null; }
  }

  function defaultProfile() {
    return sharedProfile() ||
      { hand: "right", thumbReach: "limited", fingers: 2, grip: "weak", fatigue: "low", inputs: ["voice", "foot"], targetScale: 1.5 };
  }

  // the command palette PHANTOM HAND can surface — most-used, low-effort
  // freq drives which actions survive a fatigue cap and how early they appear
  // in switch-scanning order — least frequent is deferred first, never whatever
  // happens to be declared last.
  const ACTIONS = [
    { act: "ask", ico: "❯", label: "Ask GHOST", freq: "high" },
    { act: "map", ico: "🗺️", label: "System Map", freq: "high" },
    { act: "ops", ico: "📡", label: "Live Ops", freq: "medium" },
    { act: "approvals", ico: "✓", label: "Approvals", freq: "high" },
    { act: "audit", ico: "🧾", label: "Audit", freq: "low" },
    { act: "workspace", ico: "🖥️", label: "Start Workspace", freq: "low" },
    { act: "voice", ico: "🎙️", label: "Voice", freq: "medium" },
    { act: "stop", ico: "⛔", label: "Pause All", freq: "low", danger: true },
  ];

  const GAP = 12;   // minimum clear space between neighbouring targets (fallback path)

  // GHOST's control requirements, as the shared resolver consumes them. This is
  // the *application* half of the contract; the person's capability profile is
  // the other half and travels with them across apps.
  function appProfile() {
    const avail = Math.min(340, (window.innerWidth || 360) - 44);
    return {
      id: "ghost",
      surface: { width: avail, height: window.innerHeight || 720 },
      actions: ACTIONS.map(a => ({
        id: a.act, label: a.label,
        frequency: a.freq || "medium",
        destructive: !!a.danger,
        gesture: "tap",
      })),
    };
  }

  // build a reach-optimized, fatigue-aware layout from the profile.
  // Delegates to the shared resolver (window.RSGAbility) so the capability →
  // layout mapping lives in one tested place; the inline path below is the
  // standalone fallback for when the shared library isn't served.
  function generateLayout(profile) {
    profile = profile || active || defaultProfile();

    if (window.RSGAbility) {
      const app = appProfile();
      const spec = window.RSGAbility.resolve(toCapability(profile), app);
      const shown = spec.placements.map(p => p.actionId);
      return {
        items: ACTIONS.filter(a => shown.indexOf(a.act) >= 0),
        targetPx: spec.target.minPx,
        gapPx: spec.target.gapPx,
        reach: spec.zones.anchor.corner === "bottom-left" ? "lower-left" : "lower-right",
        cols: Math.max(1, Math.min(3, spec.columns)),
        voice: spec.voice.enabled,
        foot: (profile.inputs || []).includes("foot"),
        spec,   // full specification, for anything that wants the reasoning
      };
    }

    // ---- fallback: no shared resolver available ----
    let items = ACTIONS.slice();
    const max = profile.fatigue === "high" ? 5 : profile.fingers <= 1 ? 6 : 8;
    items = items.slice(0, max);
    const targetPx = Math.round(56 * (profile.targetScale || 1.4) * (profile.fatigue === "high" ? 1.15 : 1));
    const reach = profile.hand === "left" ? "lower-left" : "lower-right";
    const avail = Math.min(340, (window.innerWidth || 360) - 44) - 24;
    const cols = Math.max(1, Math.min(3, Math.floor((avail + GAP) / (targetPx + GAP))));
    return {
      items, targetPx, reach, cols, gapPx: GAP,
      voice: profile.inputs.includes("voice"),
      foot: profile.inputs.includes("foot"),
    };
  }

  // GHOST's count-based shape → the resolver's capability vocabulary.
  function toCapability(p) {
    const n = p.fingers || 1;
    const order = ["thumb", "index", "middle", "ring", "pinky"];
    const fingers = {};
    order.forEach((f, i) => { fingers[f] = i < n; });
    return {
      hand: p.hand, fingers,
      reachMM: p.thumbReach === "limited" ? 70 : 100,
      grip: p.grip, fatigue: p.fatigue,
      precision: p.precision, permanence: p.permanence,
      inputs: p.inputs || [],
    };
  }

  function dispatch(item) {
    disarmAll(item);
    // 2-step guard on destructive actions. Deliberately NOT on a timer: a
    // confirm window that expires punishes exactly the slower, less predictable
    // movement this mode exists to support. The armed state waits indefinitely
    // and any other action cancels it.
    if (item.danger && !item._armed) { item._armed = true; armUI(item, true); return; }
    if (item.danger) { item._armed = false; armUI(item, false); }
    switch (item.act) {
      case "ask": G.bus.emit("oh:action", { type: "focus-command" }); break;
      case "map": G.bus.emit("oh:action", { type: "nav", view: "world" }); break;
      case "ops": G.bus.emit("oh:action", { type: "nav", view: "ops" }); break;
      case "approvals": G.bus.emit("oh:action", { type: "nav", view: "approvals" }); break;
      case "audit": G.bus.emit("oh:action", { type: "nav", view: "audit" }); break;
      case "workspace": G.bus.emit("oh:action", { type: "command", text: "Start my development workspace across both computers with one-handed controls" }); break;
      case "voice": G.bus.emit("oh:action", { type: "voice" }); break;
      case "stop": G.bus.emit("oh:action", { type: "emergency" }); break;
    }
  }
  function armUI(item, on) {
    const el = dock && dock.querySelector(`[data-act="${item.act}"]`);
    if (!el) return;
    el.classList.toggle("armed", on);
    const lbl = el.querySelector(".oh-lbl");
    if (lbl) lbl.textContent = on ? "Tap again to confirm" : item.label;
    el.setAttribute("aria-label", on ? item.label + " — tap again to confirm" : item.label);
  }
  function disarmAll(except) {
    ACTIONS.forEach(a => { if (a !== except && a._armed) { a._armed = false; armUI(a, false); } });
  }

  function renderDock() {
    if (dock) dock.remove();
    const L = generateLayout(active);
    dock = h("div", { class: "oh-dock " + L.reach, id: "oh-dock", role: "region", "aria-label": "Phantom Hand controls" });
    document.body.appendChild(dock);

    // status header — describes what this layout actually is, nothing more
    dock.appendChild(h("div", { class: "oh-head" }, [
      h("span", { class: "oh-badge" }, "✋ PHANTOM HAND"),
      h("span", { class: "oh-sub" }, `${active.hand} hand · ${L.items.length} actions · ${L.targetPx}px targets`),
      h("button", { class: "oh-x", title: "Exit OneHand", "aria-label": "Exit OneHand mode", onclick: () => G.onehand.deactivate() }, "✕"),
    ]));

    // reach grid — visual order matches DOM order, so tab and switch-scanning
    // walk the actions in the same sequence the eye does
    const grid = h("div", {
      class: "oh-grid",
      style: {
        gridTemplateColumns: `repeat(${L.cols}, minmax(0, 1fr))`,
        gap: (L.gapPx || 12) + "px",   // spacing is an ability output, not a constant
      },
    });
    L.items.forEach((item, i) => {
      const btn = h("button", {
        class: "oh-item" + (item.danger ? " danger" : ""), data: { act: item.act },
        style: { minHeight: L.targetPx + "px" },
        title: item.label + "  (press " + (i + 1) + ")",
        "aria-label": item.label,
        onclick: () => dispatch(item),
      }, [h("span", { class: "oh-ic" }, item.ico), h("span", { class: "oh-lbl" }, item.label), h("span", { class: "oh-key" }, i + 1)]);
      grid.appendChild(btn);
    });
    dock.appendChild(grid);

    // capability quick-adjust + input aids
    /* Aids listed here are the ones that actually exist right now. The pedal
       line reports the real device state rather than the profile checkbox —
       it previously said "🦶 foot-pedal = confirm" whether or not any pedal
       had ever been connected. */
    dock.appendChild(h("div", { class: "oh-foot" }, [
      L.voice ? h("span", { class: "oh-aid" }, "🎙️ voice") : null,
      h("span", { class: "oh-aid" }, "⌨︎ keys 1–" + L.items.length),
      h("span", { class: "oh-aid", id: "oh-dev" }, "○ checking for devices…"),
      /* Only offered when this browser can actually prompt, and the click
         itself is the user gesture WebHID requires. */
      (input && input.canRequestDevice())
        ? h("button", { class: "oh-swap", id: "oh-connect", onclick: connectDevice }, "＋ connect device")
        : null,
      h("button", { class: "oh-swap", onclick: () => { active.hand = active.hand === "right" ? "left" : "right"; renderDock(); } }, "⇄ swap hand"),
    ]));
    paintDeviceStatus();
  }

  function onKey(e) {
    if (!active) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    // Never swallow digits meant for a text field — the dock's own "Ask GHOST"
    // action focuses the command bar, so stealing them broke typing outright.
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    const n = parseInt(e.key, 10);
    const L = generateLayout(active);
    if (n >= 1 && n <= L.items.length) { e.preventDefault(); dispatch(L.items[n - 1]); }
  }

  // The shell is the sole writer of rsg.ability.v1; when it changes hand or
  // target scale, follow it live instead of waiting for a reload.
  window.addEventListener("storage", (e) => {
    if (e.key !== "rsg.ability.v1" || !active) return;
    const p = sharedProfile();
    if (!p) return;
    active = p;
    document.documentElement.style.setProperty("--oh-scale", String(active.targetScale || 1.4));
    renderDock();
  });

  function activate(profile) {
    active = profile || active || defaultProfile();
    document.body.classList.add("onehand");
    document.documentElement.style.setProperty("--oh-scale", String(active.targetScale || 1.4));
    G.store && G.store.setting("onehand", active);
    ensureInput();
    input && input.start();
    renderDock();
    document.addEventListener("keydown", onKey);
    G.bus.emit("onehand", { active: true, profile: active });
  }
  function deactivate() {
    document.body.classList.remove("onehand");
    document.documentElement.style.removeProperty("--oh-scale");
    if (dock) { dock.remove(); dock = null; }
    input && input.stop();
    document.removeEventListener("keydown", onKey);
    G.store && G.store.setting("onehand", null);
    G.bus.emit("onehand", { active: false });
    active = null;
  }
  function isActive() { return !!active; }

  G.onehand = { defaultProfile, generateLayout, activate, deactivate, isActive, renderDock,
    get profile() { return active; },
    get input() { return input; } };   // device status/mapping, for diagnostics
})();

</script>
<script>
/* ============================================================
   GHOST // engine.js — simulation core: clock, missions, metrics
   Single source of truth: G.state (mutated in place).
   Broadcasts via G.bus so the UI + viz update incrementally.
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;
  const { DATA } = G;

  const TICK_MS = 100;         // logic tick
  const STEP_BASE = 10.5;      // seconds per step (before per-step tweaks)

  function freshMachines() {
    return DATA.machines.map((m) => Object.assign({}, m));
  }

  const state = (G.state = {
    booted: false,
    mode: "build",
    mission: null,
    running: false,
    paused: false,
    complete: false,
    locked: false,           // emergency lockdown
    simTime: 0,
    totalDur: 0,
    stepIndex: -1,
    stepStart: 0,
    stepProgress: 0,
    timeline: [],            // [{status}]
    machines: freshMachines(),
    feed: [],
    metrics: { cost: 0, tokens: 0, rate: 0, series: [] },
    anomaly: null,
    gate: null,
    awaitingGate: false,
    threat: "nominal",
    uptimeStart: Date.now(),
    stats: { agentsActive: 1, machinesOnline: 0, missions: 0, anomaliesCaught: 0 },
  });

  /* ---------- helpers ---------- */
  function stepDur(step) {
    let d = STEP_BASE;
    if (step.anomaly) d += 3;
    if (step.clearsAnomaly) d += 3;
    if (step.lines) d += step.lines.length * 0.6;
    return d;
  }
  function machineById(id) { return state.machines.find((m) => m.id === id); }

  function pushFeed(agentId, text, kind) {
    const a = DATA.agents[agentId] || { name: agentId, color: "#8fa3bd", av: "?" };
    const msg = { id: G.id(), agent: a, text, kind: kind || "msg", time: new Date() };
    state.feed.push(msg);
    if (state.feed.length > 120) state.feed.shift();
    G.bus.emit("feed", msg);
    return msg;
  }

  function setMachine(id, patch) {
    const m = machineById(id);
    if (!m) return;
    Object.assign(m, patch);
    G.bus.emit("machine", m);
  }

  function resetMachinesIdle() {
    state.machines.forEach((m) => {
      if (m.id === "SEC") { m.scene = "security"; m.task = "No threats detected"; m.status = "online"; m.agent = "SECOPS"; m.prog = 0; }
      else { m.status = "online"; m.agent = null; m.task = ""; m.prog = 0; if (state.locked) m.status = "offline"; }
      G.bus.emit("machine", m);
    });
  }

  /* ---------- mission lifecycle ---------- */
  function start(missionId) {
    const mode = missionId || state.mode;
    const mission = DATA.missions[mode];
    if (!mission) return;
    state.mode = mode;
    state.mission = mission;
    state.running = true;
    state.paused = false;
    state.complete = false;
    state.simTime = 0;
    state.stepIndex = -1;
    state.stepStart = 0;
    state.stepProgress = 0;
    state.anomaly = null;
    state.gate = null;
    state.awaitingGate = false;
    state.threat = mode === "warroom" ? "elevated" : "nominal";
    state.metrics = { cost: 0, tokens: 0, rate: 0, series: [] };
    state.timeline = mission.steps.map(() => ({ status: "pending" }));
    state.totalDur = mission.steps.reduce((s, st) => s + stepDur(st), 0);
    state.machines = freshMachines();

    state.feed = [];
    G.bus.emit("mission:start", mission);
    pushFeed("ORCH", `Mission received — <b>${mission.title}</b>`, "system");
    enterStep(0);
    G.bus.emit("tick", state);
  }

  function enterStep(i) {
    const step = state.mission.steps[i];
    if (!step) return;
    state.stepIndex = i;
    state.stepStart = state.simTime;
    state.stepProgress = 0;
    step._emitted = new Set();
    state.timeline.forEach((t, k) => { t.status = k < i ? "done" : k === i ? "active" : "pending"; });

    // machines not in this step revert to idle (keep last scene lingering)
    const involved = new Set((step.assign || []).map((a) => a.m));
    state.machines.forEach((m) => {
      if (m.id === "SEC") return;
      if (!involved.has(m.id)) { m.status = "online"; m.task = ""; m.agent = null; }
    });
    (step.assign || []).forEach((a) => {
      setMachine(a.m, { scene: a.scene, task: a.task, agent: a.agent, status: "busy", prog: 0, alert: false });
    });

    // active agents this step
    const agentsThisStep = new Set(["ORCH"]);
    (step.assign || []).forEach((a) => a.agent && agentsThisStep.add(a.agent));
    state.stats.agentsActive = agentsThisStep.size;

    G.bus.emit("step", { index: i, step });
    G.bus.emit("machine:all");
  }

  function advance() {
    const i = state.stepIndex;
    const step = state.mission.steps[i];

    // resolve anomaly if this step clears it
    if (step.clearsAnomaly && state.anomaly) {
      state.anomaly = null;
      G.bus.emit("anomaly", null);
    }
    if (state.timeline[i]) state.timeline[i].status = "done";

    if (i + 1 < state.mission.steps.length) {
      enterStep(i + 1);
    } else {
      finish();
    }
  }

  function finish() {
    state.running = false;
    state.complete = true;
    state.stats.missions += 1;
    state.stepProgress = 1;
    state.timeline.forEach((t) => (t.status = "done"));
    state.machines.forEach((m) => { if (m.id !== "SEC") { m.status = "online"; m.prog = 1; } });
    state.threat = "nominal";
    G.bus.emit("machine:all");
    G.bus.emit("mission:end", state.mission);
  }

  /* ---------- controls ---------- */
  function pause() { if (state.running && !state.complete) { state.paused = !state.paused; G.bus.emit("control", { paused: state.paused }); pushFeed("ORCH", state.paused ? "Mission <b>paused</b> by operator." : "Resuming mission.", "system"); } }
  function approveGate() {
    if (!state.awaitingGate) return;
    const step = state.mission.steps[state.stepIndex];
    pushFeed("ORCH", "Operator <b>approved</b>. Proceeding.", "system");
    state.awaitingGate = false;
    state.gate = null;
    G.bus.emit("gate", null);
    advance();
  }
  function redirect(text) {
    if (!text) return;
    const safe = String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    pushFeed("ORCH", `Redirect received: “${safe}”. Re-planning next phase.`, "system");
    G.bus.emit("redirect", text);
  }
  function terminate() {
    if (!state.running && !state.awaitingGate) return;
    state.running = false;
    state.awaitingGate = false;
    state.gate = null;
    state.anomaly = null;
    G.bus.emit("gate", null);
    G.bus.emit("anomaly", null);
    pushFeed("ORCH", "Mission <b>terminated</b> by operator. Machines returned to standby.", "system");
    resetMachinesIdle();
    G.bus.emit("mission:end", state.mission);
  }

  function emergencyStop() {
    state.locked = true;
    state.running = false;
    state.paused = true;
    state.awaitingGate = false;
    state.gate = null;
    state.threat = "lockdown";
    state.machines.forEach((m) => { m.status = "offline"; m.task = "— powered down —"; m.agent = null; });
    G.bus.emit("machine:all");
    pushFeed("SECOPS", "⛔ <b>EMERGENCY STOP</b> — all agents halted, machines powered down, network isolated.", "alert");
    G.bus.emit("emergency");
  }
  function restore() {
    state.locked = false;
    state.threat = "nominal";
    resetMachinesIdle();
    pushFeed("SECOPS", "Systems restored. Fleet back online. Standing by.", "system");
    G.bus.emit("restore");
    G.bus.emit("machine:all");
  }

  function setMode(mode) {
    if (state.locked) restore();
    state.mode = mode;
    G.bus.emit("mode", mode);
    start(mode);
  }

  /* ---------- tick ---------- */
  function tick() {
    const now = Date.now();
    state.stats.machinesOnline = state.machines.filter((m) => m.status !== "offline").length;

    if (!state.running || state.paused || state.awaitingGate || state.locked) {
      // still emit a light tick for clocks/uptime
      G.bus.emit("tick", state);
      G.bus.emit("metrics", state.metrics);
      return;
    }

    const dt = TICK_MS / 1000;
    state.simTime += dt;
    const step = state.mission.steps[state.stepIndex];
    if (!step) return;
    const d = stepDur(step);
    state.stepProgress = G.clampv((state.simTime - state.stepStart) / d, 0, 1);

    // progress bars on busy machines
    (step.assign || []).forEach((a) => {
      const m = machineById(a.m);
      if (m && m.status === "busy") { m.prog = state.stepProgress; }
    });

    // stream feed lines
    (step.lines || []).forEach((ln, idx) => {
      const keyId = idx;
      if (!step._emitted.has(keyId) && state.stepProgress >= ln.at) {
        step._emitted.add(keyId);
        pushFeed(ln.agent, ln.text, ln.agent === "VISION" && /anomaly|⚠/.test(ln.text) ? "alert" : "msg");
      }
    });

    // fire anomaly midway through its step
    if (step.anomaly && !state.anomaly && state.stepProgress >= 0.62) {
      const an = Object.assign({ id: G.id(), at: new Date() }, step.anomaly);
      state.anomaly = an;
      state.stats.anomaliesCaught += 1;
      const m = machineById(an.machine);
      if (m) { m.scene = "error"; m.alert = true; G.bus.emit("machine", m); }
      G.bus.emit("anomaly", an);
      G.bus.emit("toast", { kind: "danger", ic: "⚠", text: `Visual anomaly on ${m ? m.name : an.machine}: ${an.title}` });
    }

    // metrics accrual
    const busy = state.machines.filter((m) => m.status === "busy").length;
    const rate = 900 + busy * 1400 + Math.sin(state.simTime * 2.3) * 350;
    state.metrics.rate = Math.max(0, rate);
    state.metrics.tokens += (state.metrics.rate * dt);
    state.metrics.cost = (state.metrics.tokens / 1000) * 0.0125;
    // per ~0.5s push to series
    if (!state._lastSeries || state.simTime - state._lastSeries >= 0.4) {
      state._lastSeries = state.simTime;
      state.metrics.series.push(state.metrics.rate);
      if (state.metrics.series.length > 160) state.metrics.series.shift();
    }
    G.bus.emit("metrics", state.metrics);

    // step boundary
    if (state.stepProgress >= 1) {
      if (step.gate && !state.awaitingGate) {
        state.awaitingGate = true;
        state.gate = { text: step.gate, stepKey: step.key };
        pushFeed("ORCH", `⏸ Holding for approval — <b>${step.gate}</b>`, "system");
        G.bus.emit("gate", state.gate);
        G.bus.emit("toast", { kind: "warn", ic: "⏸", text: "Approval required to proceed." });
      } else if (!step.gate) {
        advance();
      }
    }

    G.bus.emit("tick", state);
  }

  let timer = null;
  function run() { if (!timer) timer = setInterval(tick, TICK_MS); }
  function stopLoop() { if (timer) { clearInterval(timer); timer = null; } }

  G.engine = {
    state, start, setMode, pause, approveGate, redirect, terminate,
    emergencyStop, restore, run, stopLoop, resetMachinesIdle, pushFeed,
    machineById, stepDur,
  };
})();

</script>
