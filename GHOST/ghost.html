<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GHOST // Command Center</title>
<meta name="description" content="GHOST — a cinematic AI command center." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%BB%3C/text%3E%3C/svg%3E" />
<style>
/* ============================================================
   GHOST // core.css — theme tokens, resets, ambient FX
   ============================================================ */

:root {
  /* base surfaces */
  --bg-0: #04060b;
  --bg-1: #070b14;
  --bg-2: #0a1120;
  --panel: rgba(12, 20, 34, 0.72);
  --panel-solid: #0b1220;
  --panel-edge: rgba(90, 220, 255, 0.16);
  --panel-edge-hot: rgba(90, 240, 255, 0.55);
  --hair: rgba(120, 160, 200, 0.14);

  /* signature glow — GHOST cyan */
  --cyan: #35f2e6;
  --cyan-bright: #7dfff5;
  --cyan-dim: #1b8f92;
  --ice: #9fe8ff;

  /* accents */
  --violet: #a878ff;
  --magenta: #ff5db1;
  --blue: #4aa8ff;

  /* status */
  --ok: #3df5a8;
  --warn: #ffc24d;
  --danger: #ff415f;
  --danger-bright: #ff6b82;
  --idle: #5a6b85;

  /* text */
  --text: #dbe8f5;
  --text-dim: #8fa3bd;
  --text-faint: #5d708c;

  /* type */
  --mono: "Cascadia Code", "JetBrains Mono", ui-monospace, "SFMono-Regular", "Consolas", monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;

  /* geometry */
  --radius: 10px;
  --radius-sm: 6px;
  --gap: 12px;
  --glow-cyan: 0 0 0.5px rgba(125,255,245,.9), 0 0 14px rgba(53,242,230,.35);
  --shadow-panel: 0 10px 40px -12px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.03);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: rgba(53,242,230,.28); color: #eafffd; }

/* scrollbars */
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: rgba(90,180,220,.18); border-radius: 8px; }
*::-webkit-scrollbar-thumb:hover { background: rgba(90,200,240,.35); }

h1,h2,h3,h4 { margin: 0; font-weight: 600; }
button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

/* utility */
.mono { font-family: var(--mono); }
.dim { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.up { text-transform: uppercase; letter-spacing: .16em; }
.nowrap { white-space: nowrap; }
.hot { color: var(--cyan-bright); text-shadow: var(--glow-cyan); }

/* ============================================================
   AMBIENT BACKGROUND FX
   ============================================================ */
.fx-starfield,
.fx-grid,
.fx-vignette,
.fx-scanlines,
.fx-aurora {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.fx-starfield { z-index: 0; }

.fx-aurora {
  z-index: 0;
  background:
    radial-gradient(60% 50% at 12% 8%, rgba(53,242,230,.10), transparent 60%),
    radial-gradient(55% 45% at 92% 12%, rgba(168,120,255,.10), transparent 60%),
    radial-gradient(70% 60% at 78% 100%, rgba(74,168,255,.08), transparent 60%),
    radial-gradient(40% 40% at 30% 100%, rgba(255,93,177,.05), transparent 60%);
  animation: auroraDrift 26s ease-in-out infinite alternate;
  mix-blend-mode: screen;
}
@keyframes auroraDrift {
  0%   { transform: translate3d(0,0,0) scale(1);   opacity: .9; }
  50%  { transform: translate3d(-2%, 1%, 0) scale(1.06); opacity: 1; }
  100% { transform: translate3d(2%, -1%, 0) scale(1.02); opacity: .8; }
}

.fx-grid {
  background-image:
    linear-gradient(rgba(80,150,190,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(80,150,190,.05) 1px, transparent 1px);
  background-size: 46px 46px;
  -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
          mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
  animation: gridPan 60s linear infinite;
}
@keyframes gridPan {
  from { background-position: 0 0, 0 0; }
  to   { background-position: 46px 92px, 46px 92px; }
}

.fx-vignette {
  z-index: 3;
  background: radial-gradient(120% 100% at 50% 0%, transparent 55%, rgba(0,0,0,.55) 100%);
}
.fx-scanlines {
  z-index: 3;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,10,14,.28) 3px,
    rgba(0,0,0,0) 4px
  );
  opacity: .5;
  animation: scan 8s linear infinite;
}
@keyframes scan { from { background-position: 0 0; } to { background-position: 0 100px; } }

/* ============================================================
   REUSABLE PANEL CHROME + ANIMATIONS
   ============================================================ */
.panel {
  position: relative;
  background:
    linear-gradient(180deg, rgba(18,28,46,.55), rgba(8,13,24,.75));
  border: 1px solid var(--panel-edge);
  border-radius: var(--radius);
  box-shadow: var(--shadow-panel);
  backdrop-filter: blur(8px) saturate(120%);
  overflow: hidden;
}
/* corner brackets */
.panel::before,
.panel::after {
  content: "";
  position: absolute;
  width: 14px; height: 14px;
  border: 1px solid var(--panel-edge-hot);
  pointer-events: none;
  opacity: .8;
}
.panel::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
.panel::after  { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }

.panel-h {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--hair);
  font-size: 11px;
  color: var(--cyan-bright);
  text-transform: uppercase; letter-spacing: .18em;
  background: linear-gradient(180deg, rgba(53,242,230,.06), transparent);
}
.panel-h .tick { color: var(--text-faint); margin-left: auto; letter-spacing: .1em; }
.panel-h .led {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
}

/* status dot */
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok    { background: var(--ok);    box-shadow: 0 0 8px var(--ok); }
.dot.warn  { background: var(--warn);  box-shadow: 0 0 8px var(--warn); }
.dot.danger{ background: var(--danger);box-shadow: 0 0 10px var(--danger); animation: blink 1s steps(2) infinite; }
.dot.idle  { background: var(--idle); }
.dot.busy  { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: pulse 1.4s ease-in-out infinite; }

@keyframes blink { 50% { opacity: .25; } }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .5; transform: scale(.7);} }
@keyframes flicker { 0%,100%{opacity:1;} 45%{opacity:.85;} 50%{opacity:.55;} 55%{opacity:.9;} }
@keyframes floatUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(53,242,230,.0); }
  50%     { box-shadow: 0 0 22px -2px rgba(53,242,230,.45); }
}
@keyframes sweep { from { transform: translateX(-120%);} to { transform: translateX(320%);} }
@keyframes spinSlow { to { transform: rotate(360deg); } }

/* a moving light sweep used on active elements */
.sweep { position: relative; overflow: hidden; }
.sweep::after {
  content:""; position:absolute; inset:0 auto 0 0; width:40%;
  background: linear-gradient(90deg, transparent, rgba(125,255,245,.10), transparent);
  transform: translateX(-120%);
  animation: sweep 3.2s ease-in-out infinite;
}

/* emergency lockdown */
body.lockdown::after {
  content: ""; position: fixed; inset: 0; z-index: 20; pointer-events: none;
  box-shadow: inset 0 0 160px 20px rgba(255,65,95,.45);
  background: repeating-linear-gradient(45deg, rgba(255,65,95,.05) 0 24px, transparent 24px 48px);
  animation: lockPulse 1.1s ease-in-out infinite;
}
@keyframes lockPulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }
body.lockdown .brand .word { color: #ff8a9c; text-shadow: 0 0 14px rgba(255,65,95,.7); }

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  .fx-scanlines, .fx-grid, .fx-aurora { animation: none; }
}

</style>
<style>
/* ============================================================
   GHOST // app.css — layout + components
   ============================================================ */

/* ---------- shell grid ---------- */
.shell {
  position: relative; z-index: 5;
  height: 100vh;
  display: grid;
  grid-template-columns: 66px minmax(0, 1fr) 386px;
  grid-template-rows: 56px minmax(0, 1fr) 138px;
  grid-template-areas:
    "top  top   top"
    "rail stage right"
    "deck deck  deck";
  gap: var(--gap);
  padding: var(--gap);
  animation: floatUp .6s ease both;
}
.topbar   { grid-area: top; }
.moderail { grid-area: rail; }
.stage    { grid-area: stage; min-width: 0; }
.rightrail{ grid-area: right; }
.deck     { grid-area: deck; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 14px; min-width: 0;
  background: linear-gradient(180deg, rgba(14,24,40,.85), rgba(8,13,24,.7));
  border: 1px solid var(--panel-edge);
  border-radius: var(--radius);
  box-shadow: var(--shadow-panel);
}
.topbar > * { flex: none; }
.topbar .midcol { flex: 1 1 auto; min-width: 0; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .mark {
  width: 34px; height: 34px; display: grid; place-items: center;
  border: 1px solid var(--panel-edge-hot); border-radius: 9px;
  font-size: 18px;
  background: radial-gradient(circle at 50% 30%, rgba(53,242,230,.22), transparent 70%);
  box-shadow: inset 0 0 12px rgba(53,242,230,.25), var(--glow-cyan);
  animation: flicker 6s infinite;
}
.brand .word { font-size: 18px; font-weight: 700; letter-spacing: .26em; color: #eafffd; text-shadow: var(--glow-cyan); }
.brand .sub  { font-size: 9px; letter-spacing: .3em; color: var(--text-faint); margin-top: -2px; }

.topbar .sep { width: 1px; height: 30px; background: var(--hair); }

.sysline { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.sysline .k { color: var(--text-faint); letter-spacing: .12em; }
.sysline .v { color: var(--text); font-family: var(--mono); }

.meters { display: flex; gap: 10px; margin-left: auto; }
.meter { min-width: 88px; }
.meter .lbl { font-size: 9px; letter-spacing: .18em; color: var(--text-faint); display:flex; justify-content:space-between; }
.meter .val { font-family: var(--mono); font-size: 16px; color: var(--cyan-bright); text-shadow: var(--glow-cyan); }
.meter .val.amber { color: var(--warn); text-shadow: 0 0 12px rgba(255,194,77,.4); }
.meter .bar { height: 3px; margin-top: 3px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; }
.meter .bar > i { display:block; height:100%; background: linear-gradient(90deg, var(--cyan-dim), var(--cyan)); box-shadow: 0 0 8px var(--cyan); transition: width .5s ease; }
.meter .bar > i.amber { background: linear-gradient(90deg, #7a5410, var(--warn)); box-shadow: 0 0 8px var(--warn); }

.threat {
  display:flex; align-items:center; gap:8px; padding: 5px 12px;
  border:1px solid var(--panel-edge); border-radius: 8px; font-size: 11px;
  background: rgba(61,245,168,.06);
}
.threat.warn { background: rgba(255,194,77,.08); border-color: rgba(255,194,77,.4); }
.threat.danger { background: rgba(255,65,95,.1); border-color: rgba(255,65,95,.5); }

.killswitch {
  display:flex; align-items:center; gap:9px;
  padding: 9px 16px; border-radius: 9px;
  border: 1px solid rgba(255,65,95,.55);
  background: linear-gradient(180deg, rgba(255,65,95,.16), rgba(120,10,25,.25));
  color: var(--danger-bright); font-weight: 700; font-size: 12px;
  letter-spacing: .16em; text-transform: uppercase;
  box-shadow: 0 0 18px -4px rgba(255,65,95,.5), inset 0 0 12px rgba(255,65,95,.15);
  transition: all .18s ease;
}
.killswitch:hover { background: linear-gradient(180deg, rgba(255,65,95,.32), rgba(150,12,30,.4)); box-shadow: 0 0 28px -2px rgba(255,65,95,.8); transform: translateY(-1px); }
.killswitch .glyph { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: blink 1.2s steps(2) infinite; }

/* ---------- mode rail ---------- */
.moderail {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 12px 8px;
}
.moderail .logo-lab {
  writing-mode: vertical-rl; font-size: 9px; letter-spacing: .3em; color: var(--text-faint);
  margin-bottom: 2px;
}
.mode {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 4px; border-radius: 9px; border: 1px solid transparent;
  color: var(--text-dim); transition: all .18s ease; position: relative;
}
.mode .ic { font-size: 18px; filter: grayscale(.4) brightness(.9); transition: all .18s; }
.mode .nm { font-size: 8px; letter-spacing: .1em; text-transform: uppercase; text-align:center; line-height: 1.1; }
.mode:hover { border-color: var(--panel-edge); color: var(--text); background: rgba(53,242,230,.05); }
.mode.active {
  border-color: var(--panel-edge-hot); color: var(--cyan-bright);
  background: linear-gradient(180deg, rgba(53,242,230,.14), rgba(53,242,230,.03));
  box-shadow: inset 0 0 14px rgba(53,242,230,.15);
}
.mode.active .ic { filter: none; }
.mode.active::before { content:""; position:absolute; left:-8px; top:20%; bottom:20%; width:3px; border-radius:3px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }

.rail-stats { margin-top: auto; width: 100%; display:flex; flex-direction:column; gap:10px; align-items:center; }
.rail-stat { text-align:center; }
.rail-stat .n { font-family: var(--mono); font-size: 16px; color: var(--cyan-bright); text-shadow: var(--glow-cyan); }
.rail-stat .l { font-size: 7px; letter-spacing:.12em; color: var(--text-faint); text-transform: uppercase; }
.rail-btn {
  width:44px; height:44px; display:grid; place-items:center; border-radius: 10px;
  border:1px solid var(--panel-edge); font-size: 18px; color: var(--ice);
  background: rgba(53,242,230,.05); transition: all .18s;
}
.rail-btn:hover { background: rgba(53,242,230,.14); box-shadow: var(--glow-cyan); }

/* ---------- stage ---------- */
.stage { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
.machinegrid { flex: 1 1 60%; display: flex; flex-direction: column; min-height: 0; }
.midrow { flex: 1 1 40%; display: grid; grid-template-columns: 1.35fr 1fr; gap: var(--gap); min-height: 0; }

/* machine grid inner */
.mg-body {
  flex: 1; min-height: 0; overflow: auto;
  display: grid; gap: 10px; padding: 10px;
  grid-template-columns: repeat(auto-fill, minmax(216px, 1fr));
  align-content: start;
}
.tile {
  position: relative; border: 1px solid var(--hair); border-radius: 9px; overflow: hidden;
  background: #050a12; transition: border-color .2s, transform .2s, box-shadow .2s;
  display: flex; flex-direction: column;
}
.tile:hover { border-color: var(--panel-edge-hot); transform: translateY(-2px); box-shadow: 0 12px 30px -14px rgba(53,242,230,.5); }
.tile.sel { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 12px 30px -12px rgba(53,242,230,.6); }
.tile.alert { border-color: rgba(255,65,95,.6); animation: glowAlert 1.4s ease-in-out infinite; }
@keyframes glowAlert { 0%,100%{ box-shadow: 0 0 0 1px rgba(255,65,95,.3);} 50%{ box-shadow: 0 0 20px -2px rgba(255,65,95,.6);} }

.tile-h { display:flex; align-items:center; gap:7px; padding: 7px 9px; font-size: 10px; letter-spacing: .1em; background: linear-gradient(180deg, rgba(20,32,52,.9), rgba(10,16,28,.6)); }
.tile-h .nm { font-weight: 600; color: var(--text); letter-spacing: .12em; }
.tile-h .kind { color: var(--text-faint); font-size: 8px; text-transform: uppercase; letter-spacing: .14em; }
.tile-h .st { margin-left:auto; font-size: 8px; letter-spacing:.12em; text-transform: uppercase; }
.tile-screen { position: relative; aspect-ratio: 16/10; background:#04070d; }
.tile-screen canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.tile-screen .scrim { position:absolute; inset:0; background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,.6)); pointer-events:none; }
.tile-screen .rec { position:absolute; top:6px; right:7px; display:flex; align-items:center; gap:4px; font-size:7px; letter-spacing:.14em; color:#ff9db0; }
.tile-screen .rec i { width:6px; height:6px; border-radius:50%; background: var(--danger); box-shadow: 0 0 6px var(--danger); animation: blink 1.1s steps(2) infinite; }
.tile-screen .res { position:absolute; bottom:6px; left:8px; font-size:7px; letter-spacing:.1em; color: var(--text-faint); font-family: var(--mono); }
.tile-f { padding: 7px 9px; border-top: 1px solid var(--hair); }
.tile-task { font-size: 10px; color: var(--text-dim); display:flex; align-items:center; gap:6px; min-height: 14px; }
.tile-task .who { color: var(--cyan); font-family: var(--mono); font-size: 9px; }
.tile-prog { height: 3px; margin-top: 6px; background: rgba(255,255,255,.06); border-radius: 3px; overflow:hidden; }
.tile-prog > i { display:block; height:100%; width:0; background: linear-gradient(90deg, var(--cyan-dim), var(--cyan)); box-shadow: 0 0 8px var(--cyan); transition: width .4s; }
.tile-prog > i.warn { background: linear-gradient(90deg,#7a5410,var(--warn)); box-shadow:0 0 8px var(--warn); }

/* ---------- timeline ---------- */
.timeline { display:flex; flex-direction: column; min-height: 0; }
.tl-body { flex:1; overflow:auto; padding: 10px 12px; }
.tl-step { display:flex; gap: 10px; padding: 5px 0; position: relative; }
.tl-step .rail { display:flex; flex-direction:column; align-items:center; }
.tl-step .node { width: 16px; height:16px; border-radius:50%; border:2px solid var(--idle); display:grid; place-items:center; font-size:8px; color:var(--idle); flex:none; background:#060b14; }
.tl-step .line { flex:1; width:2px; background: var(--hair); margin: 2px 0; }
.tl-step:last-child .line { display:none; }
.tl-step.done .node { border-color: var(--ok); color: var(--ok); box-shadow: 0 0 8px rgba(61,245,168,.4); }
.tl-step.active .node { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: glowPulse 1.6s infinite; }
.tl-step.active .line { background: linear-gradient(var(--cyan), var(--hair)); }
.tl-step .txt { padding-bottom: 6px; }
.tl-step .t { font-size: 11.5px; color: var(--text); }
.tl-step.active .t { color: var(--cyan-bright); }
.tl-step .m { font-size: 9px; color: var(--text-faint); letter-spacing:.08em; font-family: var(--mono); }
.tl-step.done .t { color: var(--text-dim); }

/* ---------- system map ---------- */
.systemmap { display:flex; flex-direction:column; min-height:0; }
.sm-canvas-wrap { flex:1; position:relative; }
.sm-canvas-wrap canvas { position:absolute; inset:0; width:100%; height:100%; }
.sm-legend { display:flex; gap:12px; padding: 6px 12px; border-top:1px solid var(--hair); font-size:8px; letter-spacing:.1em; color: var(--text-faint); }
.sm-legend span { display:flex; align-items:center; gap:5px; }

/* ---------- right rail ---------- */
.rightrail { display:flex; flex-direction:column; gap: var(--gap); min-height:0; }
.agentfeed { flex: 1 1 55%; display:flex; flex-direction:column; min-height:0; }
.af-body { flex:1; overflow:auto; padding: 8px 10px; display:flex; flex-direction:column; gap:7px; }
.msg { display:flex; gap:8px; animation: floatUp .3s ease both; }
.msg .av { width:24px; height:24px; border-radius:7px; flex:none; display:grid; place-items:center; font-size:10px; font-weight:700; color:#04070d; }
.msg .body { min-width:0; }
.msg .meta { display:flex; align-items:center; gap:6px; font-size:9px; }
.msg .name { font-weight:700; letter-spacing:.08em; }
.msg .time { color: var(--text-faint); font-family: var(--mono); }
.msg .role { color: var(--text-faint); font-size:8px; text-transform:uppercase; letter-spacing:.1em; }
.msg .text { font-size: 11.5px; color: var(--text-dim); margin-top:1px; }
.msg .text code { font-family: var(--mono); color: var(--ice); background: rgba(53,242,230,.08); padding: 0 4px; border-radius: 4px; font-size: 10.5px; }
.msg.system { opacity:.9; }
.msg.system .text { color: var(--text-faint); font-style: italic; }
.msg.alert .text { color: var(--danger-bright); }

/* ---------- anomaly ---------- */
.anomaly { flex: 0 0 auto; display:none; }
.anomaly.show { display:flex; flex-direction:column; animation: floatUp .3s ease; }
.anomaly.show .panel-h { color: var(--danger-bright); background: linear-gradient(180deg, rgba(255,65,95,.12), transparent); }
.anomaly.show .panel-h .led { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: blink 1s steps(2) infinite;}
.an-body { padding: 10px 12px; }
.an-title { font-size: 12px; color: var(--danger-bright); font-weight: 600; }

.btn { padding: 10px 14px; border-radius: 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--panel-edge); color: var(--text); }
.btn.primary { flex: 1; color: var(--cyan-bright); border-color: var(--panel-edge-hot); background: rgba(53,242,230,.12); }
.btn.primary:hover { background: rgba(53,242,230,.24); }
.btn.ghost:hover { border-color: var(--panel-edge-hot); }
.btn.danger { color: var(--danger-bright); border-color: rgba(255,65,95,.4); }
.approval-banner { padding: 10px 12px; border: 1px solid rgba(255,194,77,.5); border-radius: 8px; background: rgba(255,194,77,.08); font-size: 11.5px; color: var(--warn); }

/* execution graph */
.run-empty { flex: 1; display: grid; place-items: center; color: var(--text-faint); font-size: 13px; text-align: center; padding: 30px; }
.run-status-strip { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--hair); font-size: 11px; }
.run-status-strip .s { display: flex; gap: 6px; align-items: center; color: var(--text-dim); }
.run-status-strip .s b { color: var(--text); font-family: var(--mono); }
.dag { padding: 14px; display: flex; flex-direction: column; gap: 0; overflow: auto; }
.task { display: flex; gap: 12px; }
.task .spine { display: flex; flex-direction: column; align-items: center; }
.task .knob { width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--idle); display: grid; place-items: center; font-size: 11px; background: #08101c; flex: none; color: var(--idle); }
.task .conn { width: 2px; flex: 1; background: var(--hair); min-height: 14px; }
.task:last-child .conn { display: none; }
.task .body { padding-bottom: 14px; flex: 1; min-width: 0; }
.task .title { font-size: 12.5px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.task .detail { font-size: 10.5px; color: var(--text-faint); margin-top: 1px; }
.task .agent-tool { font-size: 9px; color: var(--text-faint); font-family: var(--mono); margin-top: 2px; }
.task .verify { margin-top: 6px; font-size: 10.5px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--hair); display: flex; gap: 6px; align-items: flex-start; }
.task .verify.pass { border-color: rgba(61,245,168,.35); color: var(--ok); background: rgba(61,245,168,.05); }
.task .verify.fail { border-color: rgba(255,65,95,.4); color: var(--danger-bright); background: rgba(255,65,95,.06); }
.task .verify.warn { border-color: rgba(255,194,77,.4); color: var(--warn); background: rgba(255,194,77,.05); }
.task .verify .m { font-family: var(--mono); font-size: 9px; opacity: .8; }
.st-pill { font-size: 8px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
/* task status coloring */
.task.running .knob, .task.verifying .knob { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 8px rgba(53,242,230,.4); animation: glowPulse 1.4s infinite; }
.task.completed .knob { border-color: var(--ok); color: var(--ok); } .task.completed .conn { background: linear-gradient(var(--ok), var(--hair)); }
.task.completed_warn .knob { border-color: var(--warn); color: var(--warn); }
.task.failed .knob { border-color: var(--danger); color: var(--danger); }
.task.awaiting_approval .knob { border-color: var(--warn); color: var(--warn); animation: glowPulse 1.2s infinite; }
.task.blocked .knob, .task.cancelled .knob, .task.rolled_back .knob { border-color: var(--idle); color: var(--idle); }

/* ---------- DEVICES ---------- */
.dev-table { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--hair); border-radius: 10px; }
table.dt { width: 100%; border-collapse: collapse; font-size: 12px; }
table.dt th { position: sticky; top: 0; background: #0c1626; text-align: left; padding: 9px 12px; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); border-bottom: 1px solid var(--hair); z-index: 1; }
table.dt td { padding: 9px 12px; border-bottom: 1px solid var(--hair); color: var(--text-dim); vertical-align: middle; }
table.dt tr:hover td { background: rgba(53,242,230,.03); }
.dt .name { color: var(--text); display: flex; align-items: center; gap: 8px; }
.method-badge { font-size: 9px; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--panel-edge); color: var(--cyan-bright); font-family: var(--mono); }
.cap { font-size: 8px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--hair); color: var(--text-faint); margin-right: 3px; }
.dt .act { display: flex; gap: 5px; }
.dt .act button { font-size: 9px; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--panel-edge); color: var(--text-dim); }
.dt .act button:hover { border-color: var(--panel-edge-hot); color: var(--cyan-bright); }

/* ---------- APPROVALS ---------- */
.appr-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.appr-card { border: 1px solid rgba(255,194,77,.4); border-radius: 10px; background: rgba(255,194,77,.05); padding: 14px; }
.appr-card.resolved { border-color: var(--hair); background: var(--panel); opacity: .8; }
.appr-card .ah { display: flex; align-items: center; gap: 10px; }
.appr-card .ah .t { font-size: 13px; color: var(--text); font-weight: 600; }
.appr-card .prompt { font-size: 12px; color: var(--text-dim); margin: 8px 0; }
.appr-actions { display: flex; gap: 8px; }
.appr-actions .btn { padding: 8px 16px; }
.appr-actions .approve { color: var(--ok); border-color: rgba(61,245,168,.4); background: rgba(61,245,168,.08); }
.appr-actions .reject { color: var(--danger-bright); border-color: rgba(255,65,95,.4); }
.appr-empty { flex: 1; display: grid; place-items: center; color: var(--text-faint); font-size: 13px; }

/* ---------- AUDIT ---------- */
.audit-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
.audit-row { display: flex; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--hair); font-size: 11.5px; align-items: baseline; }
.audit-row .ts { font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); flex: none; width: 62px; }
.audit-row .atype { flex: none; font-size: 8px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; width: 96px; text-align: center; }
.audit-row .actor { flex: none; width: 96px; color: var(--cyan-bright); font-family: var(--mono); font-size: 9.5px; }
.audit-row .sum { color: var(--text-dim); }
.at-plan { background: rgba(74,168,255,.14); color: #9fd0ff; }
.at-run { background: rgba(53,242,230,.14); color: var(--cyan-bright); }
.at-approval { background: rgba(255,194,77,.16); color: var(--warn); }
.at-verify { background: rgba(61,245,168,.14); color: var(--ok); }
.at-verifyfail { background: rgba(255,65,95,.16); color: var(--danger-bright); }
.at-sys { background: rgba(150,170,200,.12); color: var(--text-dim); }

/* ---------- ONEHAND DOCK ---------- */
body.onehand .vtab, body.onehand .btn, body.onehand .gcmd .go, body.onehand .oh-toggle { transform: none; }
.oh-dock { position: fixed; z-index: 38; width: min(340px, calc(100vw - 44px)); max-height: calc(100vh - 44px); overflow-y: auto; padding: 12px; border: 1px solid #ff9d5c; border-radius: 14px; background: linear-gradient(180deg, rgba(28,18,10,.96), rgba(12,8,6,.97)); box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), 0 0 40px -10px rgba(255,157,92,.4); }
.oh-dock.lower-right { right: 22px; bottom: 22px; }
.oh-dock.lower-left { left: 22px; bottom: 22px; }
.oh-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.oh-badge { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #ffbe8c; }
.oh-sub { font-size: 9px; color: var(--text-faint); }
.oh-x { margin-left: auto; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--hair); color: var(--text-dim); }
/* Reach grid, not a radial arc. Eight targets never fit one comfortable thumb
   sweep without overlapping, and the overlap grew as the profile asked for
   bigger targets — the accommodation made aiming harder. A grid guarantees the
   gap, scans in a predictable order, and survives any target size. */
.oh-grid { display: grid; gap: 12px; margin: 8px 0; }
.oh-item { position: relative; border-radius: 16px; border: 1.5px solid rgba(255,157,92,.5); background: rgba(40,26,14,.92); color: #ffd9bc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; transition: all .12s; }
.oh-item:hover, .oh-item:focus-visible { border-color: #ffbe8c; background: rgba(255,157,92,.22); box-shadow: 0 0 16px -4px #ff9d5c; outline: none; }
/* the destructive control gets its own row and extra separation from the rest */
.oh-item.danger { border-color: rgba(255,65,95,.5); color: #ff9db0; grid-column: 1/-1; margin-top: 10px; }
.oh-item.danger.armed { background: rgba(255,65,95,.28); border-color: #ff415f; color: #ffd9e0; }
.oh-ic { font-size: 20px; } .oh-lbl { font-size: 10px; letter-spacing: .02em; text-align: center; line-height: 1.15; }
.oh-key { position: absolute; top: 4px; right: 6px; font-size: 9px; color: var(--text-faint); font-family: var(--mono); }
.oh-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; padding-top: 8px; border-top: 1px solid rgba(255,157,92,.2); }
.oh-aid { font-size: 9px; color: var(--text-faint); }
/* a lost device is never announced quietly — silence is the worst behaviour here */
.oh-alert { color: #ffb454; font-weight: 700; }
.oh-swap { margin-left: auto; font-size: 11px; min-height: 44px; padding: 4px 14px; border-radius: 10px; border: 1px solid rgba(255,157,92,.4); color: #ffbe8c; }
/* enlarge primary targets while OneHand active */
body.onehand .gcmd input { padding: 13px 14px; font-size: 14px; }
body.onehand .vtab { padding: 10px 13px; font-size: 12.5px; }

@media (max-width: 1100px) {
  .world-grid { grid-template-columns: 1fr; } .ent-detail { display: none; }
  .cmd-grid { grid-template-columns: 1fr; }
  .vtab .lbl { display: none; }
}

<script>
/* ============================================================
   RSG // ability-resolver.js — capability profile → layout specification.

   PURE. (capability, application) → layout. No I/O, no clock, no randomness,
   no network, no model. Same input, same output, every run.

   That is not fastidiousness: a person builds motor memory around control
   positions, so a layout that drifts between sessions damages the very
   accommodation it exists to provide. Determinism is the feature.

   Input describes FUNCTION (what the person can comfortably do), never a
   diagnosis — a diagnosis predicts need worse and raises the data's
   sensitivity tier for nothing.

   Consumed by: Onehand OS shell (writes rsg.ability.v1), GHOST (PHANTOM HAND
   dock). Exposed as window.RSGAbility; consumers guard for its absence so
   standalone serving degrades instead of breaking.
   ============================================================ */
(function (root) {
  "use strict";

  /* ---------- stated constants (not per-device tuning) ---------- */
  var PX_PER_MM   = 3.0;   // CSS px per mm of comfortable thumb sweep
  var BASE_TARGET = 44;    // floor for any target, before ability scaling
  var BASE_GAP    = 8;     // floor for clear space between neighbours
  var STRETCH_K   = 1.35;  // stretch zone extends to 1.35× the comfortable radius
  var MARGIN      = 14;    // surface edge inset

  var FINGERS = ["thumb", "index", "middle", "ring", "pinky"];

  /* Gesture taxonomy. The resolver never emits a gesture outside SINGLE_OK. */
  var SINGLE_OK   = ["tap", "stepper", "menu", "button", "switch", "voice", "foot"];
  var MULTI       = ["pinch", "two-finger-scroll", "modifier-click"];
  var TIMED       = ["double-tap", "timed-hold"];
  var DRAGGING    = ["drag", "slider"];

  /* Every excluded gesture has a single-contact, untimed replacement. */
  var SUBSTITUTION = {
    "drag":              "stepper",
    "slider":            "stepper",
    "pinch":             "button",
    "two-finger-scroll": "button",
    "modifier-click":    "menu",
    "long-press":        "menu",
    "double-tap":        "tap",
    "timed-hold":        "tap"
  };

  /* Conservative fallbacks. Used ONLY alongside an `unresolved` entry — the
     engine never silently substitutes a default and calls the job done. */
  var CONSERVATIVE = {
    hand: "right", reachMM: 70, grip: "weak", fatigue: "high",
    precision: "low", permanence: "changing", inputs: []
  };

  function has(o, k) { return o && Object.prototype.hasOwnProperty.call(o, k) && o[k] != null; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function oneOf(v, list, fallback) { return list.indexOf(v) >= 0 ? v : fallback; }

  /* ============================================================
     1. Normalize the capability profile.
     Anything absent is recorded in `unresolved` and filled conservatively,
     so the caller can ask rather than be quietly misserved.
     ============================================================ */
  function normalize(cap) {
    cap = cap || {};
    var unresolved = [], why = [];

    function take(key, list) {
      if (!has(cap, key)) {
        unresolved.push(key);
        why.push({ decision: key + "=" + CONSERVATIVE[key], because: "not supplied — most conservative value used", input: null });
        return CONSERVATIVE[key];
      }
      return list ? oneOf(cap[key], list, CONSERVATIVE[key]) : cap[key];
    }

    var fingers = {};
    var fingersGiven = has(cap, "fingers") && typeof cap.fingers === "object";
    if (!fingersGiven) {
      unresolved.push("fingers");
      why.push({ decision: "fingers=thumb only", because: "not supplied — most conservative value used", input: null });
    }
    FINGERS.forEach(function (f) {
      fingers[f] = fingersGiven ? !!cap.fingers[f] : (f === "thumb");
    });
    var fingerCount = FINGERS.filter(function (f) { return fingers[f]; }).length || 1;

    var reach = has(cap, "reachMM") && typeof cap.reachMM === "number"
      ? clamp(cap.reachMM, 40, 160) : take("reachMM");

    return {
      hand:       take("hand", ["left", "right"]),
      fingers:    fingers,
      fingerCount: fingerCount,
      reachMM:    reach,
      grip:       take("grip", ["weak", "moderate", "strong"]),
      fatigue:    take("fatigue", ["low", "med", "high"]),
      precision:  take("precision", ["low", "moderate", "high"]),
      permanence: take("permanence", ["temporary", "permanent", "changing"]),
      inputs:     has(cap, "inputs") && Array.isArray(cap.inputs) ? cap.inputs.slice() : take("inputs"),
      _unresolved: unresolved,
      _why: why
    };
  }

  /* ============================================================
     2. Target sizing. Precision is the dominant driver (it is what makes a
     target hard to hit); grip and fatigue add on top. Kept separate so a
     differential test can move one and see only its own contribution.
     ============================================================ */
  function sizing(p, why) {
    var precAdd  = { low: 20, moderate: 8,  high: 0 }[p.precision];
    var gripAdd  = { weak: 8,  moderate: 4, strong: 0 }[p.grip];
    var fatAdd   = { high: 12, med: 6,      low: 0 }[p.fatigue];
    var permAdd  = p.permanence === "changing" ? 4 : 0;  // headroom for a worse day

    var minPx = BASE_TARGET + precAdd + gripAdd + fatAdd + permAdd;

    /* Spacing matters more than size: a mis-hit costs an undo, a miss costs a
       retry. Low precision widens the gap faster than it widens the target. */
    var gapPx = BASE_GAP + { low: 12, moderate: 4, high: 0 }[p.precision]
                         + { high: 6, med: 3, low: 0 }[p.fatigue];

    why.push({ decision: "target " + minPx + "px", because: "precision=" + p.precision + " (+" + precAdd + "), grip=" + p.grip + " (+" + gripAdd + "), fatigue=" + p.fatigue + " (+" + fatAdd + ")" + (permAdd ? ", permanence=changing (+" + permAdd + ")" : ""), input: "precision,grip,fatigue,permanence" });
    why.push({ decision: "gap " + gapPx + "px", because: "spacing scales with precision=" + p.precision + " and fatigue=" + p.fatigue, input: "precision,fatigue" });

    return { minPx: minPx, gapPx: gapPx };
  }

  /* ============================================================
     3. Reach zones, mirrored by handedness. Radii come straight from the
     person's own reported sweep, so a smaller reach genuinely shrinks the
     comfortable region rather than restyling it.
     ============================================================ */
  function zones(p, surface, why) {
    var comfortableR = p.reachMM * PX_PER_MM;
    var corner = p.hand === "left" ? "bottom-left" : "bottom-right";
    why.push({ decision: "anchor " + corner, because: "hand=" + p.hand, input: "hand" });
    why.push({ decision: "comfortable radius " + Math.round(comfortableR) + "px", because: "reachMM=" + p.reachMM + " × " + PX_PER_MM + "px/mm", input: "reachMM" });
    return {
      anchor: { corner: corner, x: p.hand === "left" ? MARGIN : surface.width - MARGIN, y: surface.height - MARGIN },
      comfortable: { rMax: comfortableR },
      stretch:     { rMin: comfortableR, rMax: comfortableR * STRETCH_K },
      avoid:       { rMin: comfortableR * STRETCH_K }
    };
  }

  function zoneAt(z, dist) {
    if (dist <= z.comfortable.rMax) return "comfortable";
    if (dist <= z.stretch.rMax) return "stretch";
    return "avoid";
  }

  /* ============================================================
     4. Placement. Slots are laid out from the anchor corner outward; distance
     from the anchor decides the zone. Frequent actions claim the nearest
     slots; destructive actions are pushed past the comfortable radius AND
     away from any frequent neighbour.
     ============================================================ */
  function slotGeometry(i, cols, pitch, z, surface) {
    var col = i % cols, row = Math.floor(i / cols);
    var dx = (col + 0.5) * pitch, dy = (row + 0.5) * pitch;
    return {
      col: col, row: row,
      x: z.anchor.corner === "bottom-left" ? z.anchor.x + dx : z.anchor.x - dx,
      y: z.anchor.y - dy,
      dist: Math.sqrt(dx * dx + dy * dy)
    };
  }
  function adjacent(a, b) { return Math.abs(a.col - b.col) <= 1 && Math.abs(a.row - b.row) <= 1; }

  function place(p, app, size, z, surface, why) {
    var pitch = size.minPx + size.gapPx;
    var usable = surface.width - MARGIN * 2;
    var cols = Math.max(1, Math.floor((usable + size.gapPx) / pitch));

    /* Fewer usable fingers and higher fatigue mean fewer things on screen at
       once — the count is an ability output, not a design preference. */
    var cap = p.fatigue === "high" ? 5 : p.fingerCount <= 1 ? 6 : 8;
    var actions = (app.actions || []).slice();
    var rank = { high: 0, medium: 1, low: 2 };

    /* The cap drops the LEAST FREQUENT, never whatever happens to be declared
       last. Destructive actions are always placed: they live in the avoid zone
       and cost no comfortable real estate, and silently hiding a stop control
       behind a submenu because a person is tired is not a safe trade. */
    var frequent = actions.filter(function (a) { return !a.destructive; })
      .sort(function (a, b) { return (rank[a.frequency] || 1) - (rank[b.frequency] || 1); });
    var destructive = actions.filter(function (a) { return a.destructive; });
    var deferred = frequent.slice(cap).map(function (a) { return a.id; });
    frequent = frequent.slice(0, cap);
    if (deferred.length) why.push({ decision: "defer " + deferred.length + " action(s) to a submenu", because: "fatigue=" + p.fatigue + ", usable fingers=" + p.fingerCount + " → cap " + cap + "; least-frequent deferred first", input: "fatigue,fingers" });

    var placements = [], used = [];
    frequent.forEach(function (a, i) {
      var g = slotGeometry(i, cols, pitch, z, surface);
      placements.push({ actionId: a.id, zone: zoneAt(z, g.dist), order: i, col: g.col, row: g.row, x: Math.round(g.x), y: Math.round(g.y), dist: Math.round(g.dist) });
      used.push(g);
    });

    /* A destructive action must clear the comfortable zone and must not touch
       a frequent one. Walk outward until both hold — never place and hope. */
    destructive.forEach(function (a) {
      var i = frequent.length, g, ok = false, guard = 0;
      while (!ok && guard++ < 400) {
        g = slotGeometry(i, cols, pitch, z, surface);
        var clearsComfort = zoneAt(z, g.dist) !== "comfortable";
        var noFrequentNeighbour = used.every(function (u) { return !adjacent(g, u); });
        if (clearsComfort && noFrequentNeighbour) ok = true; else i++;
      }
      placements.push({ actionId: a.id, zone: zoneAt(z, g.dist), order: i, col: g.col, row: g.row, x: Math.round(g.x), y: Math.round(g.y), dist: Math.round(g.dist), destructive: true });
      used.push(g);
      why.push({ decision: a.id + " placed in the " + zoneAt(z, g.dist) + " zone", because: "destructive actions are kept out of the comfortable zone and away from frequent ones", input: "destructive" });
    });

    return { placements: placements, cols: cols, pitch: pitch, deferred: deferred, cap: cap };
  }

  /* ============================================================
     5. Interaction substitutions, voice, sequential order, safeguards.
     ============================================================ */

<script>
/* ============================================================
   GHOST // lib.js — core helpers, reactive store, event bus
   Everything hangs off the global window.G namespace.
   ============================================================ */
(function () {
  "use strict";
  const G = (window.G = window.G || {});

  /* ---------- DOM ---------- */
  function h(tag, attrs, children) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "html") el.innerHTML = v;
        else if (k === "text") el.textContent = v;
        else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
        else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
        else if (k === "data" && typeof v === "object") for (const d in v) el.dataset[d] = v[d];
        else el.setAttribute(k, v);
      }
    }
    if (children != null) append(el, children);
    return el;
  }
  function append(el, children) {
    if (Array.isArray(children)) children.forEach((c) => append(el, c));
    else if (children instanceof Node) el.appendChild(children);
    else if (children != null) el.appendChild(document.createTextNode(String(children)));
  }
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  function clear(el) { while (el && el.firstChild) el.removeChild(el.firstChild); return el; }
  function mount(el, node) { clear(el); append(el, node); return el; }

  /* ---------- format ---------- */
  const pad = (n, l = 2) => String(n).padStart(l, "0");
  function clock(d) { d = d || new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
  function money(n) { return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function compact(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(Math.round(n));
  }
  function dur(sec) {
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${pad(m)}:${pad(s)}`;
  }

  /* ---------- random ---------- */
  const rnd = (a, b) => a + Math.random() * (b - a);
  const rint = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const chance = (p) => Math.random() < p;
  function id() { return "x" + Math.random().toString(36).slice(2, 9); }

  /* ---------- event bus ---------- */
  const bus = (function () {
    const map = {};

      on(ev, fn) { (map[ev] = map[ev] || []).push(fn); return () => this.off(ev, fn); },
      off(ev, fn) { if (map[ev]) map[ev] = map[ev].filter((f) => f !== fn); },
      emit(ev, payload) { (map[ev] || []).forEach((f) => { try { f(payload); } catch (e) { console.error(e); } }); },
    };
  })();

  /* ---------- reactive store ---------- */
  function createStore(initial) {
    let state = initial;
    const subs = new Set();
    return {
      get: () => state,
      set(patch) {
        state = typeof patch === "function" ? patch(state) : Object.assign({}, state, patch);
        subs.forEach((fn) => { try { fn(state); } catch (e) { console.error(e); } });
      },
      subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    };
  }

  /* ---------- misc ---------- */
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clampv(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  Object.assign(G, {
    h, append, $, $$, clear, mount,
    pad, clock, money, compact, dur,
    rnd, rint, pick, chance, id,
    bus, createStore, lerp, clampv, easeInOut,
  });
})();

<script>
/* ============================================================
   GHOST // store.js — durable state + immutable audit log
   localStorage-backed. Every mutation can write an audit event.
   This is the substrate that makes actions REAL (persisted +
   inspectable) instead of ephemeral demo state.
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;
  const KEY = "ghost:v2";

  const COLLECTIONS = [
    "entities",       // world-model nodes (systems, devices, clients, deployments, …)
    "edges",          // typed relationships between entities
    "commands",       // natural-language directives the operator issued
    "plans",          // structured execution plans produced by the planner
    "runs",           // orchestration runs (a plan being executed)
    "tasks",          // individual agent tasks within a run
    "approvals",      // pending / resolved human approvals
    "audit",          // append-only event log
    "verifications",  // verification records (proof a task really happened)
    "notifications",  // operator-facing notifications
  ];
  /* There is deliberately no "memories" collection. GHOST already has the
     better substrate: an append-only audit log with verification records. What
     GHOST would want to "remember" is a query over audit + entities, which
     cannot drift from the truth the way a second, separately-written store
     can. A named-but-unwritten memory slot is where an unscoped dumping ground
     goes later, so it is not left declared. */

  let db = null;
  let saveTimer = null;

  function blank() {
    const o = { _v: 2 };
    COLLECTIONS.forEach((c) => (o[c] = {}));
    o.audit = [];        // audit is an array (ordered, append-only)
    o.settings = { onehand: null, activeView: "ops", mode: "build", seeded: false };
    return o;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { db = JSON.parse(raw); COLLECTIONS.forEach((c) => { if (!db[c]) db[c] = c === "audit" ? [] : {}; }); if (!db.settings) db.settings = blank().settings; }
    } catch (e) { console.warn("store load failed", e); }
    if (!db) db = blank();
    return db;
  }

  function persist() {
    if (saveTimer) return;
    saveTimer = setTimeout(() => {
      saveTimer = null;
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { console.warn("store persist failed", e); }
    }, 120);
  }

  /* ---------- generic collection ops ---------- */
  function all(coll) { return Object.values(db[coll] || {}); }
  function get(coll, id) { return (db[coll] || {})[id]; }
  function put(coll, obj) {
    if (!obj.id) obj.id = G.id();
    db[coll][obj.id] = obj;
    persist();
    G.bus.emit("store:change", { coll, id: obj.id, obj });
    return obj;
  }
  function patch(coll, id, changes) {
    const cur = db[coll][id];
    if (!cur) return null;
    const before = Object.assign({}, cur);
    Object.assign(cur, typeof changes === "function" ? changes(cur) : changes);
    persist();
    G.bus.emit("store:change", { coll, id, obj: cur, before });
    return cur;
  }
  function remove(coll, id) {
    const obj = db[coll][id];
    delete db[coll][id];
    persist();
    G.bus.emit("store:change", { coll, id, removed: true, obj });
  }
  function query(coll, pred) { return all(coll).filter(pred); }

  /* ---------- audit (append-only) ---------- */
  function audit(evt) {
    const rec = Object.assign({ id: G.id(), ts: Date.now() }, evt);
    db.audit.push(rec);
    if (db.audit.length > 2000) db.audit.shift();
    persist();
    G.bus.emit("audit", rec);
    return rec;
  }
  function auditLog() { return db.audit.slice().reverse(); }

  /* ---------- settings ---------- */
  function setting(k, v) {
    if (v === undefined) return db.settings[k];
    db.settings[k] = v; persist(); return v;
  }

  function reset() { db = blank(); persist(); G.bus.emit("store:reset"); }
  function raw() { return db; }

  load();

  G.store = { COLLECTIONS, all, get, put, patch, remove, query, audit, auditLog, setting, reset, raw, persist };
})();

<script>
/* ============================================================
   GHOST // world.js — the operational World Model
   A persistent, typed relationship graph of everything GHOST can
   observe or control. Relationships are STORED and QUERYABLE and
   drive the planner's blast-radius / impact reasoning.
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;
  const S = G.store;

  // relationship types that mean "A cannot function without B"
  const DEP_RELS = ["depends_on", "hosted_by", "deployed_from", "stores_data_in", "controlled_through", "integrates"];
  const ACCESS_RELS = ["authorized_for", "has_access", "can_contact"];

  /* ---------- entity / edge helpers ---------- */
  function entity(id) { return S.get("entities", id); }
  function entities(type) { return type ? S.query("entities", (e) => e.type === type) : S.all("entities"); }
  function edges() { return S.all("edges"); }

  function addEntity(e) { return S.put("entities", e); }
  function link(from, rel, to, meta) {
    const id = `${from}|${rel}|${to}`;
    return S.put("edges", Object.assign({ id, from, rel, to }, meta || {}));
  }

  /* ---------- traversal ---------- */
  function outgoing(id, rels) { return edges().filter((e) => e.from === id && (!rels || rels.includes(e.rel))); }
  function incoming(id, rels) { return edges().filter((e) => e.to === id && (!rels || rels.includes(e.rel))); }

  // forward: what this entity relies on
  function dependencies(id, seen) {
    seen = seen || new Set();
    outgoing(id, DEP_RELS).forEach((e) => { if (!seen.has(e.to)) { seen.add(e.to); dependencies(e.to, seen); } });
    return [...seen];

    return [...seen];

<script>
/* ============================================================
   GHOST // planner.js — natural language → structured plan
   Every command becomes a visible plan with impact levels,
   involved systems, verification, and approval requirements
   BEFORE anything executes.
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;
  const W = G.world;

  // impact taxonomy (spec §9)
  const IMPACT = {
    0: { name: "Observe", color: "var(--ok)", desc: "Read-only" },
    1: { name: "Reversible", color: "var(--blue)", desc: "Auto-rollback" },
    2: { name: "Controlled", color: "var(--cyan)", desc: "Bounded change" },
    3: { name: "High Impact", color: "var(--warn)", desc: "Needs approval" },
    4: { name: "Prohibited", color: "var(--danger)", desc: "Blocked" },
  };

  let stepSeq = 0;
  function step(o) {
    return Object.assign({
      id: "s" + (++stepSeq), agent: "ORCH", impact: 0, reversible: true,
      tool: "internal", effect: { op: "noop" }, verify: { method: "observe" }, deps: [],
    }, o);
  }
  function systemsFrom(ids) { return [...new Set(ids.filter(Boolean))]; }

  /* ---------- intent templates (first match wins) ---------- */
  const TEMPLATES = [
    { // DEMO 2 — production incident / performance
      id: "incident",
      test: (t) => /(slow|down|unavailable|outage|502|500|error rate|failing|incident|not working|broken)/.test(t),
      build(t) {
        const target = W.matchEntity(t) || W.entity("sys.site");
        const blast = W.blastRadius(target.id);
        return {
          goal: `Diagnose why ${target.name} is degraded and propose the safest fix`,
          mode: "warroom",
          systems: systemsFrom([target.id, "dev.vps01", "db.prod", "int.vercel", ...blast]),
          risks: ["Root cause may be in production data or infrastructure", "No production change is made without explicit approval"],
          steps: [
            step({ title: "Open incident", detail: `Create incident record for ${target.name}`, agent: "SECOPS", impact: 1, tool: "incident.create", effect: { op: "createIncident", target: target.id }, verify: { method: "collectionCount", coll: "entities", inc: 1 } }),
            step({ title: "Check deployment status", detail: "Vercel latest deploy + build health", agent: "DEVOPS", impact: 0, tool: "vercel.read" }),
            step({ title: "Check server & DB health", detail: "VPS-01 load, Supabase status, error logs", agent: "INFRA", impact: 0, tool: "metrics.read" }),
            step({ title: "Reproduce on staging", detail: "Replay failing request against staging", agent: "VISION", impact: 0, tool: "browser.assert" }),
            step({ title: "Propose corrective action", detail: "Draft rollback / hotfix with blast-radius", agent: "ORCH", impact: 0, tool: "plan.propose", verify: { method: "observe" }, holds: true }),
          ],
        };
      },
    },
    { // DEMO 1 — multi-computer workspace
      id: "workspace",
      test: (t) => /(workspace|work setup|dev(elopment)? environment|open .*(computers|machines)|start my (work|dev)|across (both|two|all))/.test(t),
      build(t) {
        const oneHanded = /(one.?hand|accessible|comfortable|right hand|left hand)/.test(t);
        return {
          goal: "Start the development workspace across Desktop 01 + Desktop 02" + (oneHanded ? " with OneHand controls" : ""),
          mode: oneHanded ? "onehand" : "build",
          systems: systemsFrom(["dev.desk01", "dev.desk02", "dev.pikvm"]),
          risks: ["Machines will be powered on and applications launched"],
          steps: [
            step({ title: "Wake machines", detail: "Wake-on-LAN Desktop 01 & 02", agent: "INFRA", impact: 2, reversible: true, tool: "device.wake", effect: { op: "wake", ids: ["dev.desk01", "dev.desk02"] }, verify: { method: "entityField", id: "dev.desk01", field: "status", equals: "online" } }),
            step({ title: "Open applications", detail: "VS Code + browser + terminal on both", agent: "COMPUTER", impact: 2, tool: "app.launch", deps: ["s?"] }),
            step({ title: "Arrange windows", detail: "Restore saved multi-monitor layout", agent: "COMPUTER", impact: 1, tool: "window.layout" }),
            step({ title: "Verify availability", detail: "Confirm both desktops reachable & responsive", agent: "VISION", impact: 0, tool: "device.probe", verify: { method: "entityField", id: "dev.desk02", field: "status", equals: "online" } }),
            oneHanded
              ? step({ title: "Activate OneHand profile", detail: "Apply PHANTOM HAND control layout", agent: "ACCESS", impact: 1, tool: "onehand.activate", effect: { op: "activateOnehand" }, verify: { method: "setting", key: "onehand" } })
              : step({ title: "Confirm workspace ready", detail: "Report workspace state", agent: "ORCH", impact: 0 }),
          ],
        };
      },
    },
    { // deploy
      id: "deploy",
      test: (t) => /(deploy|release|ship|push to prod|go live|publish)/.test(t),
      build(t) {
        const target = W.matchEntity(t) || W.entity("sys.site");
        const blast = W.blastRadius(target.id);
        return {
          goal: `Deploy the latest approved build of ${target.name} to production`,
          mode: "build",
          systems: systemsFrom([target.id, "repo.web", "int.vercel", "db.prod", ...blast]),
          risks: [`Production deploy affects ${blast.length} downstream system(s)`, "Irreversible unless rollback build is retained"],
          steps: [
            step({ title: "Verify build & tests green", detail: "CI status on latest commit", agent: "DEVOPS", impact: 0, tool: "ci.read" }),
            step({ title: "Snapshot current release", detail: "Retain rollback target", agent: "DEVOPS", impact: 1, tool: "deploy.snapshot" }),
            step({ title: "Deploy to production", detail: `vercel --prod → ${target.name}`, agent: "DEVOPS", impact: 3, reversible: true, tool: "vercel.deploy", effect: { op: "setField", id: target.id, field: "status", to: "deploying" } }),
            step({ title: "Verify deployment health", detail: "HTTP 200 + key routes + checkout", agent: "VISION", impact: 0, tool: "browser.assert", effect: { op: "setField", id: target.id, field: "status", to: "healthy" }, verify: { method: "entityField", id: target.id, field: "status", equals: "healthy" } }),
          ],
        };
      },
    },
    { // DEMO 3 — lead recovery
      id: "leads",
      test: (t) => /(lead|missed call|follow.?up|crm|pipeline|qualified)/.test(t),
      build(t) {
        return {
          goal: "Recover and route qualified leads, contacting them where approved",
          mode: "company",
          systems: systemsFrom(["sys.crm", "db.prod", "wf.missed", "int.twilio", "int.gmail"]),
          risks: ["External messages will be sent to clients (requires approval)", "Twilio integration is not connected — SMS will be blocked"],
          steps: [
            step({ title: "Read new leads", detail: "Pull leads in stage=new from CRM", agent: "OPS", impact: 0, tool: "crm.read" }),
            step({ title: "Score & qualify", detail: "Rank by fit + urgency", agent: "DATA", impact: 0, tool: "data.score" }),
            step({ title: "Move qualified → contacted", detail: "Advance qualified leads a stage", agent: "OPS", impact: 2, reversible: true, tool: "crm.update", effect: { op: "moveLeads", from: "new", to: "contacted", minScore: 75 }, verify: { method: "leadsInStage", stage: "contacted" } }),
            step({ title: "Draft outreach", detail: "Personalized reply per lead", agent: "OPS", impact: 1, tool: "message.draft" }),
            step({ title: "Send outreach", detail: "Email/SMS to qualified leads", agent: "OPS", impact: 3, reversible: false, tool: "message.send", effect: { op: "sendMessage", channel: "email" }, holds: true }),
            step({ title: "Verify CRM state", detail: "Confirm stages + logged activity", agent: "VISION", impact: 0, tool: "crm.read", verify: { method: "leadsInStage", stage: "contacted" } }),
          ],
        };
      },
    },
    { // backups
      id: "backup",
      test: (t) => /(backup|snapshot|restore point)/.test(t),
      build() {
        return {
          goal: "Confirm last night's backups completed across all systems",
          mode: "company",
          systems: systemsFrom(["wf.backup", "dev.nas", "db.prod"]),
          risks: [],
          steps: [
            step({ title: "Read backup workflow run", detail: "Nightly Backup Check last result", agent: "OPS", impact: 0, tool: "workflow.read" }),
            step({ title: "Verify NAS snapshots", detail: "Confirm NAS retained snapshot", agent: "INFRA", impact: 0, tool: "nas.read" }),
            step({ title: "Verify DB point-in-time", detail: "Supabase PITR window", agent: "INFRA", impact: 0, tool: "db.read", verify: { method: "observe" } }),
          ],
        };
      },
    },
    { // DEMO 4 — workflow builder
      id: "workflow",
      test: (t) => /(build|create|make).*(workflow|automation)|when .* (then|send|notify|open)|automate/.test(t),
      build(t) {
        const twilio = /(text|sms|call)/.test(t);
        return {
          goal: "Build a new automation workflow from your description",
          mode: "build",
          systems: systemsFrom(["sys.crm", twilio ? "int.twilio" : "int.gmail"]),
          risks: [twilio ? "Twilio (SMS) is not connected — credential required before activation" : "Workflow will be able to contact customers once activated"],
          steps: [
            step({ title: "Parse trigger & steps", detail: "Extract trigger, conditions, actions", agent: "WFBUILD", impact: 0, tool: "workflow.parse" }),
            step({ title: "Identify integrations", detail: "Map actions to connectors", agent: "WFBUILD", impact: 0, tool: "workflow.map" }),
            step({ title: "Check credentials", detail: "Flag missing/inactive integrations", agent: "SECOPS", impact: 0, tool: "cred.check" }),
            step({ title: "Test with sample data", detail: "Dry-run against fixtures", agent: "VISION", impact: 1, tool: "workflow.test" }),
            step({ title: "Prepare for activation", detail: "Save as draft, hold for activation", agent: "ORCH", impact: 2, reversible: true, tool: "workflow.save", holds: true }),
          ],
        };
      },
    },
    { // monitor / watch
      id: "monitor",
      test: (t) => /(watch|monitor|alert me|notify me if|disconnect|keep an eye)/.test(t),
      build(t) {
        const ds = W.reachableDevices();
        return {
          goal: "Monitor the named systems and alert on state change",
          mode: "company",
          systems: systemsFrom(ds.slice(0, 4).map((d) => d.id)),
          risks: [],
          steps: [
            step({ title: "Register monitors", detail: "Attach watchers to devices", agent: "INFRA", impact: 1, tool: "monitor.register" }),
            step({ title: "Set alert conditions", detail: "Notify on disconnect / error", agent: "INFRA", impact: 1, tool: "alert.configure" }),
            step({ title: "Activate monitoring", detail: "Begin polling & alerting", agent: "ORCH", impact: 2, reversible: true, tool: "monitor.start" }),
          ],
        };
      },
    },
    { // research
      id: "research",
      test: (t) => /(research|investigate .*(company|topic|subject)|organize .*findings|literature|compare sources)/.test(t),
      build() {
        return {
          goal: "Investigate the subject and assemble an evidence-backed report",
          mode: "research",
          systems: systemsFrom(["dev.desk01", "dev.desk02"]),
          risks: ["Sources may conflict — findings include a dissenting view"],
          steps: [
            step({ title: "Build research plan", detail: "Decompose into sub-questions", agent: "RECON", impact: 0, tool: "research.plan" }),
            step({ title: "Collect sources", detail: "Fan out across machines", agent: "RECON", impact: 0, tool: "web.search" }),
            step({ title: "Extract claims & evidence", detail: "Structure findings", agent: "DATA", impact: 0, tool: "data.extract" }),
            step({ title: "Red-team conclusions", detail: "Challenge and find contradictions", agent: "VISION", impact: 0, tool: "review.redteam" }),
            step({ title: "Assemble cited report", detail: "Export with citations", agent: "RECON", impact: 1, tool: "doc.write" }),
          ],
        };
      },
    },
    { // onehand / accessibility
      id: "onehand",
      test: (t) => /(one.?hand|accessible|easier to control|comfortable reach|reduce .*(key|combination)|adaptive|profile for)/.test(t),
      build(t) {
        return {
          goal: "Generate an accessible one-handed control layout for the current app",
          mode: "onehand",
          systems: systemsFrom(["dev.desk01"]),
          risks: [],
          steps: [
            step({ title: "Assess capability", detail: "Confirm comfortable movements & inputs", agent: "ACCESS", impact: 0, tool: "onehand.assess" }),
            step({ title: "Generate layout", detail: "Radial menu + sticky modifiers + reach zones", agent: "ACCESS", impact: 0, tool: "onehand.generate" }),
            step({ title: "Apply profile", detail: "Activate PHANTOM HAND controls", agent: "ACCESS", impact: 1, tool: "onehand.activate", effect: { op: "activateOnehand" }, verify: { method: "setting", key: "onehand" } }),
          ],
        };
      },
    },
  ];

  function fallback(t) {
    const ent = W.matchEntity(t);
    return {
      goal: `Inspect and report on: “${t.trim()}”`,
      mode: "build",
      systems: ent ? [ent.id] : [],
      risks: [],
      steps: [
        step({ title: "Interpret request", detail: "Classify intent & scope", agent: "ORCH", impact: 0 }),
        step({ title: "Gather current state", detail: ent ? `Read state of ${ent.name}` : "Read relevant systems", agent: "INFRA", impact: 0 }),
        step({ title: "Report findings", detail: "Summarize with evidence", agent: "ORCH", impact: 0 }),
      ],
    };
  }

  function plan(commandText) {
    stepSeq = 0;
    const t = (commandText || "").toLowerCase();
    const tpl = TEMPLATES.find((x) => x.test(t)) || { id: "generic", build: () => fallback(commandText) };
    const base = tpl.build(t);

    // wire sequential deps where unset (each step after the first depends on the previous)
    base.steps.forEach((s, i) => { if ((!s.deps || !s.deps.length || s.deps[0] === "s?") && i > 0) s.deps = [base.steps[i - 1].id]; else if (!s.deps) s.deps = []; });

    const maxImpact = base.steps.reduce((m, s) => Math.max(m, s.impact), 0);
    const approvalRequired = base.steps.some((s) => s.impact >= 3 || (!s.reversible && s.impact >= 2) || s.holds);
    const irreversible = base.steps.filter((s) => !s.reversible).length;

    const p = {
      id: G.id(), ts: Date.now(), command: commandText, intent: tpl.id,
      goal: base.goal, mode: base.mode, systems: base.systems, steps: base.steps,
      risks: base.risks || [],
      maxImpact, approvalRequired, irreversibleCount: irreversible,
      resource: {
        estSeconds: base.steps.length * 6 + (approvalRequired ? 20 : 0),
        estTokens: base.steps.length * 4200,
        estCost: (base.steps.length * 4200 / 1000) * 0.0125,
      },
      verificationSummary: `${base.steps.filter((s) => s.verify && s.verify.method !== "observe").length} step(s) independently verified against real state.`,
      status: "draft",
    };
    G.store.put("plans", p);
    G.store.audit({ type: "plan.created", actor: "planner", plan: p.id, summary: `Plan for “${commandText}” — ${p.steps.length} steps, max impact L${maxImpact}${approvalRequired ? ", approval required" : ""}.` });
    return p;
  }

  G.planner = { plan, IMPACT };
})();
