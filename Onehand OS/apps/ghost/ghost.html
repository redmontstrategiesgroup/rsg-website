<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GHOST // Command Center</title>
<meta name="description" content="GHOST — a cinematic AI command center." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%BB%3C/text%3E%3C/svg%3E" />
<style>
/* ============================================================
   GHOST // core.css — theme tokens, resets, ambient FX
   ============================================================ */

:root {
  /* base surfaces */
  --bg-0: #04060b;
  --bg-1: #070b14;
  --bg-2: #0a1120;
  --panel: rgba(12, 20, 34, 0.72);
  --panel-solid: #0b1220;
  --panel-edge: rgba(90, 220, 255, 0.16);
  --panel-edge-hot: rgba(90, 240, 255, 0.55);
  --hair: rgba(120, 160, 200, 0.14);

  /* signature glow — GHOST cyan */
  --cyan: #35f2e6;
  --cyan-bright: #7dfff5;
  --cyan-dim: #1b8f92;
  --ice: #9fe8ff;

  /* accents */
  --violet: #a878ff;
  --magenta: #ff5db1;
  --blue: #4aa8ff;

  /* status */
  --ok: #3df5a8;
  --warn: #ffc24d;
  --danger: #ff415f;
  --danger-bright: #ff6b82;
  --idle: #5a6b85;

  /* text */
  --text: #dbe8f5;
  --text-dim: #8fa3bd;
  --text-faint: #5d708c;

  /* type */
  --mono: "Cascadia Code", "JetBrains Mono", ui-monospace, "SFMono-Regular", "Consolas", monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;

  /* geometry */
  --radius: 10px;
  --radius-sm: 6px;
  --gap: 12px;
  --glow-cyan: 0 0 0.5px rgba(125,255,245,.9), 0 0 14px rgba(53,242,230,.35);
  --shadow-panel: 0 10px 40px -12px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.03);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: rgba(53,242,230,.28); color: #eafffd; }

/* scrollbars */
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: rgba(90,180,220,.18); border-radius: 8px; }
*::-webkit-scrollbar-thumb:hover { background: rgba(90,200,240,.35); }

h1,h2,h3,h4 { margin: 0; font-weight: 600; }
button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

/* utility */
.mono { font-family: var(--mono); }
.dim { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.up { text-transform: uppercase; letter-spacing: .16em; }
.nowrap { white-space: nowrap; }
.hot { color: var(--cyan-bright); text-shadow: var(--glow-cyan); }

/* ============================================================
   AMBIENT BACKGROUND FX
   ============================================================ */
.fx-starfield,
.fx-grid,
.fx-vignette,
.fx-scanlines,
.fx-aurora {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.fx-starfield { z-index: 0; }

.fx-aurora {
  z-index: 0;
  background:
    radial-gradient(60% 50% at 12% 8%, rgba(53,242,230,.10), transparent 60%),
    radial-gradient(55% 45% at 92% 12%, rgba(168,120,255,.10), transparent 60%),
    radial-gradient(70% 60% at 78% 100%, rgba(74,168,255,.08), transparent 60%),
    radial-gradient(40% 40% at 30% 100%, rgba(255,93,177,.05), transparent 60%);
  animation: auroraDrift 26s ease-in-out infinite alternate;
  mix-blend-mode: screen;
}
@keyframes auroraDrift {
  0%   { transform: translate3d(0,0,0) scale(1);   opacity: .9; }
  50%  { transform: translate3d(-2%, 1%, 0) scale(1.06); opacity: 1; }
  100% { transform: translate3d(2%, -1%, 0) scale(1.02); opacity: .8; }
}

.fx-grid {
  background-image:
    linear-gradient(rgba(80,150,190,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(80,150,190,.05) 1px, transparent 1px);
  background-size: 46px 46px;
  -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
          mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
  animation: gridPan 60s linear infinite;
}
@keyframes gridPan {
  from { background-position: 0 0, 0 0; }
  to   { background-position: 46px 92px, 46px 92px; }
}

.fx-vignette {
  z-index: 3;
  background: radial-gradient(120% 100% at 50% 0%, transparent 55%, rgba(0,0,0,.55) 100%);
}
.fx-scanlines {
  z-index: 3;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,10,14,.28) 3px,
    rgba(0,0,0,0) 4px
  );
  opacity: .5;
  animation: scan 8s linear infinite;
}
@keyframes scan { from { background-position: 0 0; } to { background-position: 0 100px; } }

/* ============================================================
   REUSABLE PANEL CHROME + ANIMATIONS
   ============================================================ */
.panel {
  position: relative;
  background:
    linear-gradient(180deg, rgba(18,28,46,.55), rgba(8,13,24,.75));
  border: 1px solid var(--panel-edge);
  border-radius: var(--radius);
  box-shadow: var(--shadow-panel);
  backdrop-filter: blur(8px) saturate(120%);
  overflow: hidden;
}
/* corner brackets */
.panel::before,
.panel::after {
  content: "";
  position: absolute;
  width: 14px; height: 14px;
  border: 1px solid var(--panel-edge-hot);
  pointer-events: none;
  opacity: .8;
}
.panel::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
.panel::after  { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }

.panel-h {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--hair);
  font-size: 11px;
  color: var(--cyan-bright);
  text-transform: uppercase; letter-spacing: .18em;
  background: linear-gradient(180deg, rgba(53,242,230,.06), transparent);
}
.panel-h .tick { color: var(--text-faint); margin-left: auto; letter-spacing: .1em; }
.panel-h .led {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
}

/* status dot */
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok    { background: var(--ok);    box-shadow: 0 0 8px var(--ok); }
.dot.warn  { background: var(--warn);  box-shadow: 0 0 8px var(--warn); }
.dot.danger{ background: var(--danger);box-shadow: 0 0 10px var(--danger); animation: blink 1s steps(2) infinite; }
.dot.idle  { background: var(--idle); }
.dot.busy  { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: pulse 1.4s ease-in-out infinite; }

@keyframes blink { 50% { opacity: .25; } }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .5; transform: scale(.7);} }
@keyframes flicker { 0%,100%{opacity:1;} 45%{opacity:.85;} 50%{opacity:.55;} 55%{opacity:.9;} }
@keyframes floatUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(53,242,230,.0); }
  50%     { box-shadow: 0 0 22px -2px rgba(53,242,230,.45); }
}
@keyframes sweep { from { transform: translateX(-120%);} to { transform: translateX(320%);} }
@keyframes spinSlow { to { transform: rotate(360deg); } }

/* a moving light sweep used on active elements */
.sweep { position: relative; overflow: hidden; }
.sweep::after {
  content:""; position:absolute; inset:0 auto 0 0; width:40%;
  background: linear-gradient(90deg, transparent, rgba(125,255,245,.10), transparent);
  transform: translateX(-120%);
  animation: sweep 3.2s ease-in-out infinite;
}

/* emergency lockdown */
body.lockdown::after {
  content: ""; position: fixed; inset: 0; z-index: 20; pointer-events: none;
  box-shadow: inset 0 0 160px 20px rgba(255,65,95,.45);
  background: repeating-linear-gradient(45deg, rgba(255,65,95,.05) 0 24px, transparent 24px 48px);
  animation: lockPulse 1.1s ease-in-out infinite;
}
@keyframes lockPulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }
body.lockdown .brand .word { color: #ff8a9c; text-shadow: 0 0 14px rgba(255,65,95,.7); }

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  .fx-scanlines, .fx-grid, .fx-aurora { animation: none; }
}

</style>
<style>
/* ============================================================
   GHOST // app.css — layout + components
   ============================================================ */

/* ---------- shell grid ---------- */
.shell {
  position: relative; z-index: 5;
  height: 100vh;
  display: grid;
  grid-template-columns: 66px minmax(0, 1fr) 386px;
  grid-template-rows: 56px minmax(0, 1fr) 138px;
  grid-template-areas:
    "top  top   top"
    "rail stage right"
    "deck deck  deck";
  gap: var(--gap);
  padding: var(--gap);
  animation: floatUp .6s ease both;
}
.topbar   { grid-area: top; }
.moderail { grid-area: rail; }
.stage    { grid-area: stage; min-width: 0; }
.rightrail{ grid-area: right; }
.deck     { grid-area: deck; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 14px; min-width: 0;
  background: linear-gradient(180deg, rgba(14,24,40,.85), rgba(8,13,24,.7));
  border: 1px solid var(--panel-edge);
  border-radius: var(--radius);
  box-shadow: var(--shadow-panel);
}
.topbar > * { flex: none; }
.topbar .midcol { flex: 1 1 auto; min-width: 0; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .mark {
  width: 34px; height: 34px; display: grid; place-items: center;
  border: 1px solid var(--panel-edge-hot); border-radius: 9px;
  font-size: 18px;
  background: radial-gradient(circle at 50% 30%, rgba(53,242,230,.22), transparent 70%);
  box-shadow: inset 0 0 12px rgba(53,242,230,.25), var(--glow-cyan);
  animation: flicker 6s infinite;
}
.brand .word { font-size: 18px; font-weight: 700; letter-spacing: .26em; color: #eafffd; text-shadow: var(--glow-cyan); }
.brand .sub  { font-size: 9px; letter-spacing: .3em; color: var(--text-faint); margin-top: -2px; }

.topbar .sep { width: 1px; height: 30px; background: var(--hair); }

.sysline { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.sysline .k { color: var(--text-faint); letter-spacing: .12em; }
.sysline .v { color: var(--text); font-family: var(--mono); }

.meters { display: flex; gap: 10px; margin-left: auto; }
.meter { min-width: 88px; }
.meter .lbl { font-size: 9px; letter-spacing: .18em; color: var(--text-faint); display:flex; justify-content:space-between; }
.meter .val { font-family: var(--mono); font-size: 16px; color: var(--cyan-bright); text-shadow: var(--glow-cyan); }
.meter .val.amber { color: var(--warn); text-shadow: 0 0 12px rgba(255,194,77,.4); }
.meter .bar { height: 3px; margin-top: 3px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; }
.meter .bar > i { display:block; height:100%; background: linear-gradient(90deg, var(--cyan-dim), var(--cyan)); box-shadow: 0 0 8px var(--cyan); transition: width .5s ease; }
.meter .bar > i.amber { background: linear-gradient(90deg, #7a5410, var(--warn)); box-shadow: 0 0 8px var(--warn); }

.threat {
  display:flex; align-items:center; gap:8px; padding: 5px 12px;
  border:1px solid var(--panel-edge); border-radius: 8px; font-size: 11px;
  background: rgba(61,245,168,.06);
}
.threat.warn { background: rgba(255,194,77,.08); border-color: rgba(255,194,77,.4); }
.threat.danger { background: rgba(255,65,95,.1); border-color: rgba(255,65,95,.5); }

.killswitch {
  display:flex; align-items:center; gap:9px;
  padding: 9px 16px; border-radius: 9px;
  border: 1px solid rgba(255,65,95,.55);
  background: linear-gradient(180deg, rgba(255,65,95,.16), rgba(120,10,25,.25));
  color: var(--danger-bright); font-weight: 700; font-size: 12px;
  letter-spacing: .16em; text-transform: uppercase;
  box-shadow: 0 0 18px -4px rgba(255,65,95,.5), inset 0 0 12px rgba(255,65,95,.15);
  transition: all .18s ease;
}
.killswitch:hover { background: linear-gradient(180deg, rgba(255,65,95,.32), rgba(150,12,30,.4)); box-shadow: 0 0 28px -2px rgba(255,65,95,.8); transform: translateY(-1px); }
.killswitch .glyph { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: blink 1.2s steps(2) infinite; }

/* ---------- mode rail ---------- */
.moderail {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 12px 8px;
}
.moderail .logo-lab {
  writing-mode: vertical-rl; font-size: 9px; letter-spacing: .3em; color: var(--text-faint);
  margin-bottom: 2px;
}
.mode {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 4px; border-radius: 9px; border: 1px solid transparent;
  color: var(--text-dim); transition: all .18s ease; position: relative;
}
.mode .ic { font-size: 18px; filter: grayscale(.4) brightness(.9); transition: all .18s; }
.mode .nm { font-size: 8px; letter-spacing: .1em; text-transform: uppercase; text-align:center; line-height: 1.1; }
.mode:hover { border-color: var(--panel-edge); color: var(--text); background: rgba(53,242,230,.05); }
.mode.active {
  border-color: var(--panel-edge-hot); color: var(--cyan-bright);
  background: linear-gradient(180deg, rgba(53,242,230,.14), rgba(53,242,230,.03));
  box-shadow: inset 0 0 14px rgba(53,242,230,.15);
}
.mode.active .ic { filter: none; }
.mode.active::before { content:""; position:absolute; left:-8px; top:20%; bottom:20%; width:3px; border-radius:3px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }

.rail-stats { margin-top: auto; width: 100%; display:flex; flex-direction:column; gap:10px; align-items:center; }
.rail-stat { text-align:center; }
.rail-stat .n { font-family: var(--mono); font-size: 16px; color: var(--cyan-bright); text-shadow: var(--glow-cyan); }
.rail-stat .l { font-size: 7px; letter-spacing:.12em; color: var(--text-faint); text-transform: uppercase; }
.rail-btn {
  width:44px; height:44px; display:grid; place-items:center; border-radius: 10px;
  border:1px solid var(--panel-edge); font-size: 18px; color: var(--ice);
  background: rgba(53,242,230,.05); transition: all .18s;
}
.rail-btn:hover { background: rgba(53,242,230,.14); box-shadow: var(--glow-cyan); }

/* ---------- stage ---------- */
.stage { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
.machinegrid { flex: 1 1 60%; display: flex; flex-direction: column; min-height: 0; }
.midrow { flex: 1 1 40%; display: grid; grid-template-columns: 1.35fr 1fr; gap: var(--gap); min-height: 0; }

/* machine grid inner */
.mg-body {
  flex: 1; min-height: 0; overflow: auto;
  display: grid; gap: 10px; padding: 10px;
  grid-template-columns: repeat(auto-fill, minmax(216px, 1fr));
  align-content: start;
}
.tile {
  position: relative; border: 1px solid var(--hair); border-radius: 9px; overflow: hidden;
  background: #050a12; transition: border-color .2s, transform .2s, box-shadow .2s;
  display: flex; flex-direction: column;
}
.tile:hover { border-color: var(--panel-edge-hot); transform: translateY(-2px); box-shadow: 0 12px 30px -14px rgba(53,242,230,.5); }
.tile.sel { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 12px 30px -12px rgba(53,242,230,.6); }
.tile.alert { border-color: rgba(255,65,95,.6); animation: glowAlert 1.4s ease-in-out infinite; }
@keyframes glowAlert { 0%,100%{ box-shadow: 0 0 0 1px rgba(255,65,95,.3);} 50%{ box-shadow: 0 0 20px -2px rgba(255,65,95,.6);} }

.tile-h { display:flex; align-items:center; gap:7px; padding: 7px 9px; font-size: 10px; letter-spacing: .1em; background: linear-gradient(180deg, rgba(20,32,52,.9), rgba(10,16,28,.6)); }
.tile-h .nm { font-weight: 600; color: var(--text); letter-spacing: .12em; }
.tile-h .kind { color: var(--text-faint); font-size: 8px; text-transform: uppercase; letter-spacing: .14em; }
.tile-h .st { margin-left:auto; font-size: 8px; letter-spacing:.12em; text-transform: uppercase; }
.tile-screen { position: relative; aspect-ratio: 16/10; background:#04070d; }
.tile-screen canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.tile-screen .scrim { position:absolute; inset:0; background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,.6)); pointer-events:none; }
.tile-screen .rec { position:absolute; top:6px; right:7px; display:flex; align-items:center; gap:4px; font-size:7px; letter-spacing:.14em; color:#ff9db0; }
.tile-screen .rec i { width:6px; height:6px; border-radius:50%; background: var(--danger); box-shadow: 0 0 6px var(--danger); animation: blink 1.1s steps(2) infinite; }
.tile-screen .res { position:absolute; bottom:6px; left:8px; font-size:7px; letter-spacing:.1em; color: var(--text-faint); font-family: var(--mono); }
.tile-f { padding: 7px 9px; border-top: 1px solid var(--hair); }
.tile-task { font-size: 10px; color: var(--text-dim); display:flex; align-items:center; gap:6px; min-height: 14px; }
.tile-task .who { color: var(--cyan); font-family: var(--mono); font-size: 9px; }
.tile-prog { height: 3px; margin-top: 6px; background: rgba(255,255,255,.06); border-radius: 3px; overflow:hidden; }
.tile-prog > i { display:block; height:100%; width:0; background: linear-gradient(90deg, var(--cyan-dim), var(--cyan)); box-shadow: 0 0 8px var(--cyan); transition: width .4s; }
.tile-prog > i.warn { background: linear-gradient(90deg,#7a5410,var(--warn)); box-shadow:0 0 8px var(--warn); }

/* ---------- timeline ---------- */
.timeline { display:flex; flex-direction: column; min-height: 0; }
.tl-body { flex:1; overflow:auto; padding: 10px 12px; }
.tl-step { display:flex; gap: 10px; padding: 5px 0; position: relative; }
.tl-step .rail { display:flex; flex-direction:column; align-items:center; }
.tl-step .node { width: 16px; height:16px; border-radius:50%; border:2px solid var(--idle); display:grid; place-items:center; font-size:8px; color:var(--idle); flex:none; background:#060b14; }
.tl-step .line { flex:1; width:2px; background: var(--hair); margin: 2px 0; }
.tl-step:last-child .line { display:none; }
.tl-step.done .node { border-color: var(--ok); color: var(--ok); box-shadow: 0 0 8px rgba(61,245,168,.4); }
.tl-step.active .node { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: glowPulse 1.6s infinite; }
.tl-step.active .line { background: linear-gradient(var(--cyan), var(--hair)); }
.tl-step .txt { padding-bottom: 6px; }
.tl-step .t { font-size: 11.5px; color: var(--text); }
.tl-step.active .t { color: var(--cyan-bright); }
.tl-step .m { font-size: 9px; color: var(--text-faint); letter-spacing:.08em; font-family: var(--mono); }
.tl-step.done .t { color: var(--text-dim); }

/* ---------- system map ---------- */
.systemmap { display:flex; flex-direction:column; min-height:0; }
.sm-canvas-wrap { flex:1; position:relative; }
.sm-canvas-wrap canvas { position:absolute; inset:0; width:100%; height:100%; }
.sm-legend { display:flex; gap:12px; padding: 6px 12px; border-top:1px solid var(--hair); font-size:8px; letter-spacing:.1em; color: var(--text-faint); }
.sm-legend span { display:flex; align-items:center; gap:5px; }

/* ---------- right rail ---------- */
.rightrail { display:flex; flex-direction:column; gap: var(--gap); min-height:0; }
.agentfeed { flex: 1 1 55%; display:flex; flex-direction:column; min-height:0; }
.af-body { flex:1; overflow:auto; padding: 8px 10px; display:flex; flex-direction:column; gap:7px; }
.msg { display:flex; gap:8px; animation: floatUp .3s ease both; }
.msg .av { width:24px; height:24px; border-radius:7px; flex:none; display:grid; place-items:center; font-size:10px; font-weight:700; color:#04070d; }
.msg .body { min-width:0; }
.msg .meta { display:flex; align-items:center; gap:6px; font-size:9px; }
.msg .name { font-weight:700; letter-spacing:.08em; }
.msg .time { color: var(--text-faint); font-family: var(--mono); }
.msg .role { color: var(--text-faint); font-size:8px; text-transform:uppercase; letter-spacing:.1em; }
.msg .text { font-size: 11.5px; color: var(--text-dim); margin-top:1px; }
.msg .text code { font-family: var(--mono); color: var(--ice); background: rgba(53,242,230,.08); padding: 0 4px; border-radius: 4px; font-size: 10.5px; }
.msg.system { opacity:.9; }
.msg.system .text { color: var(--text-faint); font-style: italic; }
.msg.alert .text { color: var(--danger-bright); }

/* ---------- anomaly ---------- */
.anomaly { flex: 0 0 auto; display:none; }
.anomaly.show { display:flex; flex-direction:column; animation: floatUp .3s ease; }
.anomaly.show .panel-h { color: var(--danger-bright); background: linear-gradient(180deg, rgba(255,65,95,.12), transparent); }
.anomaly.show .panel-h .led { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: blink 1s steps(2) infinite;}
.an-body { padding: 10px 12px; }
.an-title { font-size: 12px; color: var(--danger-bright); font-weight: 600; }
.an-row { display:flex; justify-content:space-between; font-size:10px; margin-top:6px; }

<script>
/* ============================================================
   GHOST // engine.js — simulation core: clock, missions, metrics
   Single source of truth: G.state (mutated in place).
   Broadcasts via G.bus so the UI + viz update incrementally.
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;
  const { DATA } = G;

  const TICK_MS = 100;         // logic tick
  const STEP_BASE = 10.5;      // seconds per step (before per-step tweaks)

  function freshMachines() {
    return DATA.machines.map((m) => Object.assign({}, m));
  }

  const state = (G.state = {
    booted: false,
    mode: "build",
    mission: null,
    running: false,
    paused: false,
    complete: false,
    locked: false,           // emergency lockdown
    simTime: 0,
    totalDur: 0,
    stepIndex: -1,
    stepStart: 0,
    stepProgress: 0,
    timeline: [],            // [{status}]
    machines: freshMachines(),
    feed: [],
    metrics: { cost: 0, tokens: 0, rate: 0, series: [] },
    anomaly: null,
    gate: null,
    awaitingGate: false,
    threat: "nominal",
    uptimeStart: Date.now(),
    stats: { agentsActive: 1, machinesOnline: 0, missions: 0, anomaliesCaught: 0 },
  });

  /* ---------- helpers ---------- */
  function stepDur(step) {
    let d = STEP_BASE;
    if (step.anomaly) d += 3;
    if (step.clearsAnomaly) d += 3;
    if (step.lines) d += step.lines.length * 0.6;
    return d;
  }
  function machineById(id) { return state.machines.find((m) => m.id === id); }

  function pushFeed(agentId, text, kind) {
    const a = DATA.agents[agentId] || { name: agentId, color: "#8fa3bd", av: "?" };
    const msg = { id: G.id(), agent: a, text, kind: kind || "msg", time: new Date() };
    state.feed.push(msg);
    if (state.feed.length > 120) state.feed.shift();
    G.bus.emit("feed", msg);
    return msg;
  }

  function setMachine(id, patch) {
    const m = machineById(id);
    if (!m) return;
    Object.assign(m, patch);
    G.bus.emit("machine", m);
  }

  function resetMachinesIdle() {
    state.machines.forEach((m) => {
      if (m.id === "SEC") { m.scene = "security"; m.task = "No threats detected"; m.status = "online"; m.agent = "SECOPS"; m.prog = 0; }
      else { m.status = "online"; m.agent = null; m.task = ""; m.prog = 0; if (state.locked) m.status = "offline"; }
      G.bus.emit("machine", m);
    });
  }

  /* ---------- mission lifecycle ---------- */
  function start(missionId) {
    const mode = missionId || state.mode;
    const mission = DATA.missions[mode];
    if (!mission) return;
    state.mode = mode;
    state.mission = mission;
    state.running = true;
    state.paused = false;
    state.complete = false;
    state.simTime = 0;
    state.stepIndex = -1;
    state.stepStart = 0;
    state.stepProgress = 0;
    state.anomaly = null;
    state.gate = null;
    state.awaitingGate = false;
    state.threat = mode === "warroom" ? "elevated" : "nominal";
    state.metrics = { cost: 0, tokens: 0, rate: 0, series: [] };
    state.timeline = mission.steps.map(() => ({ status: "pending" }));
    state.totalDur = mission.steps.reduce((s, st) => s + stepDur(st), 0);
    state.machines = freshMachines();

    state.feed = [];
    G.bus.emit("mission:start", mission);
    pushFeed("ORCH", `Mission received — <b>${mission.title}</b>`, "system");
    enterStep(0);
    G.bus.emit("tick", state);
  }

  function enterStep(i) {
    const step = state.mission.steps[i];
    if (!step) return;
    state.stepIndex = i;
    state.stepStart = state.simTime;
    state.stepProgress = 0;
    step._emitted = new Set();
    state.timeline.forEach((t, k) => { t.status = k < i ? "done" : k === i ? "active" : "pending"; });

    // machines not in this step revert to idle (keep last scene lingering)
    const involved = new Set((step.assign || []).map((a) => a.m));
    state.machines.forEach((m) => {
      if (m.id === "SEC") return;
      if (!involved.has(m.id)) { m.status = "online"; m.task = ""; m.agent = null; }
    });
    (step.assign || []).forEach((a) => {
      setMachine(a.m, { scene: a.scene, task: a.task, agent: a.agent, status: "busy", prog: 0, alert: false });
    });

    // active agents this step
    const agentsThisStep = new Set(["ORCH"]);
    (step.assign || []).forEach((a) => a.agent && agentsThisStep.add(a.agent));
    state.stats.agentsActive = agentsThisStep.size;

    G.bus.emit("step", { index: i, step });
    G.bus.emit("machine:all");
  }

  function advance() {
    const i = state.stepIndex;
    const step = state.mission.steps[i];

    // resolve anomaly if this step clears it
    if (step.clearsAnomaly && state.anomaly) {
      state.anomaly = null;
      G.bus.emit("anomaly", null);
    }
    if (state.timeline[i]) state.timeline[i].status = "done";

    if (i + 1 < state.mission.steps.length) {
      enterStep(i + 1);
    } else {
      finish();
    }
  }

  function finish() {
    state.running = false;
    state.complete = true;
    state.stats.missions += 1;
    state.stepProgress = 1;
    state.timeline.forEach((t) => (t.status = "done"));
    state.machines.forEach((m) => { if (m.id !== "SEC") { m.status = "online"; m.prog = 1; } });
    state.threat = "nominal";
    G.bus.emit("machine:all");
    G.bus.emit("mission:end", state.mission);
  }

  /* ---------- controls ---------- */
  function pause() { if (state.running && !state.complete) { state.paused = !state.paused; G.bus.emit("control", { paused: state.paused }); pushFeed("ORCH", state.paused ? "Mission <b>paused</b> by operator." : "Resuming mission.", "system"); } }
  function approveGate() {
    if (!state.awaitingGate) return;
    const step = state.mission.steps[state.stepIndex];
    pushFeed("ORCH", "Operator <b>approved</b>. Proceeding.", "system");
    state.awaitingGate = false;
    state.gate = null;
    G.bus.emit("gate", null);
    advance();
  }
  function redirect(text) {
    if (!text) return;
    pushFeed("ORCH", `Redirect received: “${text}”. Re-planning next phase.`, "system");
    G.bus.emit("redirect", text);
  }
  function terminate() {
    if (!state.running && !state.awaitingGate) return;
    state.running = false;
    state.awaitingGate = false;
    state.gate = null;
    state.anomaly = null;
    G.bus.emit("gate", null);
    G.bus.emit("anomaly", null);
    pushFeed("ORCH", "Mission <b>terminated</b> by operator. Machines returned to standby.", "system");
    resetMachinesIdle();
    G.bus.emit("mission:end", state.mission);
  }

  function emergencyStop() {
    state.locked = true;
    state.running = false;
    state.paused = true;
    state.awaitingGate = false;
    state.gate = null;
    state.threat = "lockdown";
    state.machines.forEach((m) => { m.status = "offline"; m.task = "— powered down —"; m.agent = null; });
    G.bus.emit("machine:all");
    pushFeed("SECOPS", "⛔ <b>EMERGENCY STOP</b> — all agents halted, machines powered down, network isolated.", "alert");
    G.bus.emit("emergency");
  }
  function restore() {
    state.locked = false;
    state.threat = "nominal";
    resetMachinesIdle();
    pushFeed("SECOPS", "Systems restored. Fleet back online. Standing by.", "system");
    G.bus.emit("restore");
    G.bus.emit("machine:all");
  }

  function setMode(mode) {
    if (state.locked) restore();
    state.mode = mode;
    G.bus.emit("mode", mode);
    start(mode);
  }

  /* ---------- tick ---------- */
  function tick() {
    const now = Date.now();
    state.stats.machinesOnline = state.machines.filter((m) => m.status !== "offline").length;

    if (!state.running || state.paused || state.awaitingGate || state.locked) {
      // still emit a light tick for clocks/uptime
      G.bus.emit("tick", state);
      G.bus.emit("metrics", state.metrics);
      return;
    }

    const dt = TICK_MS / 1000;
    state.simTime += dt;
    const step = state.mission.steps[state.stepIndex];
    if (!step) return;
    const d = stepDur(step);
    state.stepProgress = G.clampv((state.simTime - state.stepStart) / d, 0, 1);

    // progress bars on busy machines
    (step.assign || []).forEach((a) => {
      const m = machineById(a.m);
      if (m && m.status === "busy") { m.prog = state.stepProgress; }
    });

    // stream feed lines
    (step.lines || []).forEach((ln, idx) => {
      const keyId = idx;
      if (!step._emitted.has(keyId) && state.stepProgress >= ln.at) {
        step._emitted.add(keyId);
        pushFeed(ln.agent, ln.text, ln.agent === "VISION" && /anomaly|⚠/.test(ln.text) ? "alert" : "msg");
      }
    });

    // fire anomaly midway through its step
    if (step.anomaly && !state.anomaly && state.stepProgress >= 0.62) {
      const an = Object.assign({ id: G.id(), at: new Date() }, step.anomaly);
      state.anomaly = an;
      state.stats.anomaliesCaught += 1;
      const m = machineById(an.machine);
      if (m) { m.scene = "error"; m.alert = true; G.bus.emit("machine", m); }
      G.bus.emit("anomaly", an);
      G.bus.emit("toast", { kind: "danger", ic: "⚠", text: `Visual anomaly on ${m ? m.name : an.machine}: ${an.title}` });
    }

    // metrics accrual
    const busy = state.machines.filter((m) => m.status === "busy").length;
    const rate = 900 + busy * 1400 + Math.sin(state.simTime * 2.3) * 350;
    state.metrics.rate = Math.max(0, rate);
    state.metrics.tokens += (state.metrics.rate * dt);
    state.metrics.cost = (state.metrics.tokens / 1000) * 0.0125;
    // per ~0.5s push to series
    if (!state._lastSeries || state.simTime - state._lastSeries >= 0.4) {
      state._lastSeries = state.simTime;
      state.metrics.series.push(state.metrics.rate);
      if (state.metrics.series.length > 160) state.metrics.series.shift();
    }
    G.bus.emit("metrics", state.metrics);

    // step boundary
    if (state.stepProgress >= 1) {
      if (step.gate && !state.awaitingGate) {
        state.awaitingGate = true;
        state.gate = { text: step.gate, stepKey: step.key };
        pushFeed("ORCH", `⏸ Holding for approval — <b>${step.gate}</b>`, "system");
        G.bus.emit("gate", state.gate);
        G.bus.emit("toast", { kind: "warn", ic: "⏸", text: "Approval required to proceed." });
      } else if (!step.gate) {
        advance();
      }
    }

    G.bus.emit("tick", state);
  }

  let timer = null;
  function run() { if (!timer) timer = setInterval(tick, TICK_MS); }
  function stopLoop() { if (timer) { clearInterval(timer); timer = null; } }

  G.engine = {
    state, start, setMode, pause, approveGate, redirect, terminate,
    emergencyStop, restore, run, stopLoop, resetMachinesIdle, pushFeed,
    machineById, stepDur,
  };
})();

      ctx.fillStyle = "#081019"; ctx.beginPath(); ctx.arc(nd.x, nd.y, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = busy || alert ? 1.6 : 1; ctx.stroke();
      if (busy || alert) { ctx.globalAlpha = 0.3 + 0.3 * Math.sin(t * 4); ctx.beginPath(); ctx.arc(nd.x, nd.y, 11, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
      txt(ctx, nd.m.name.replace(/ /g, ""), nd.x, nd.y + 18, off ? C.danger : busy ? C.ice : C.dim, "6px 'Cascadia Code',monospace", "center");
    });

    // core
    const pulse = 1 + Math.sin(t * 2) * 0.06;
    const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22 * pulse);
    grad.addColorStop(0, "rgba(53,242,230,.9)"); grad.addColorStop(.4, "rgba(53,242,230,.25)"); grad.addColorStop(1, "rgba(53,242,230,0)");
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, 22 * pulse, 0, 7); ctx.fill();
    ctx.fillStyle = "#04141a"; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 7); ctx.fill();
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.4; ctx.stroke();
    // spinning ticks
    for (let i = 0; i < 8; i++) {
      const a = t * 0.8 + (i / 8) * Math.PI * 2;
      ctx.strokeStyle = "rgba(125,255,245,.5)"; ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14); ctx.lineTo(cx + Math.cos(a) * 17, cy + Math.sin(a) * 17); ctx.stroke();
    }
    txt(ctx, "GHOST", cx, cy + 2.5, "#eafffd", "6px 'Cascadia Code',monospace", "center");
  }

  /* ============================================================
     SPARKLINE (metrics / replay)
     ============================================================ */
  function drawSpark(ctx, w, h, t) {
    ctx.clearRect(0, 0, w, h);
    const s = G.state.metrics.series;
    if (!s.length) { txt(ctx, "awaiting telemetry…", w / 2, h / 2, C.dim, "8px 'Cascadia Code',monospace", "center"); return; }
    const max = Math.max.apply(null, s) * 1.15 || 1;
    // area
    ctx.beginPath(); ctx.moveTo(0, h);
    s.forEach((v, i) => { const x = (i / (s.length - 1 || 1)) * w, y = h - (v / max) * (h - 4) - 2; i ? ctx.lineTo(x, y) : ctx.lineTo(x, y); });
    ctx.lineTo(w, h); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "rgba(53,242,230,.35)"); g.addColorStop(1, "rgba(53,242,230,0)");
    ctx.fillStyle = g; ctx.fill();
    // line
    ctx.beginPath();
    s.forEach((v, i) => { const x = (i / (s.length - 1 || 1)) * w, y = h - (v / max) * (h - 4) - 2; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.4; ctx.stroke();
    // head dot
    const lx = w, ly = h - (s[s.length - 1] / max) * (h - 4) - 2;
    ctx.fillStyle = C.ice; ctx.beginPath(); ctx.arc(lx - 1, ly, 2, 0, 7); ctx.fill();
  }

  /* ---------- anomaly mini-shot ---------- */
  function drawAnomalyShot(cv, anomaly) {
    const s = size(cv); if (!s) return;
    const { ctx, w, h } = s;
    drawPhone(ctx, w, h, performance.now() / 1000, null, true);
  }

  /* ============================================================
     MASTER LOOP + registration
     ============================================================ */
  function attachTile(cv, machineId) { painters.push({ cv, kind: "tile", machineId }); }
  function attachMap(cv) { painters.push({ cv, kind: "map" }); }
  function attachSpark(cv) { painters.push({ cv, kind: "spark" }); }
  function attachAnomaly(cv) { painters.push({ cv, kind: "anom" }); }

  function starfield() {
    const cv = document.getElementById("starfield");
    if (!cv) return;
    const stars = [];
    function seed() {
      stars.length = 0;
      const n = Math.min(160, Math.floor((window.innerWidth * window.innerHeight) / 12000));
      for (let i = 0; i < n; i++) stars.push({ x: Math.random(), y: Math.random(), z: Math.random(), s: Math.random() * 1.4 + 0.2 });
    }
    seed(); window.addEventListener("resize", seed);
    painters.push({ cv, kind: "stars", stars });
  }

  function renderPass(t) {
    for (let pi = painters.length - 1; pi >= 0; pi--) {
      const p = painters[pi];
      if (p.kind === "anom" && !p.cv.isConnected) { painters.splice(pi, 1); continue; }
      const s = size(p.cv); if (!s) continue;
      const { ctx, w, h } = s;
      if (p.kind === "anom") { drawPhone(ctx, w, h, t, null, true); continue; }
      if (p.kind === "stars") {
        ctx.clearRect(0, 0, w, h);
        for (const st of p.stars) {
          const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * (0.5 + st.z) + st.x * 10));
          ctx.fillStyle = `rgba(${st.z > .7 ? "125,255,245" : "150,200,230"},${tw * (0.15 + st.z * 0.5)})`;
          const x = (st.x * w + (t * (4 + st.z * 10)) % w) % w;
          ctx.fillRect(x, st.y * h, st.s, st.s);
        }
      } else if (p.kind === "map") {
        drawMap(ctx, w, h, t);
      } else if (p.kind === "spark") {
        drawSpark(ctx, w, h, t);
      } else if (p.kind === "tile") {
        const m = G.engine.machineById(p.machineId);
        const scene = m ? (m.status === "offline" ? "idle" : m.scene) : "idle";
        (scenes[scene] || scenes.idle)(ctx, w, h, t, m);
        if (m && m.status === "offline") {
          ctx.fillStyle = "rgba(3,6,11,.72)"; ctx.fillRect(0, 0, w, h);
          txt(ctx, "⏻ OFFLINE", w / 2, h / 2, C.danger, "9px 'Cascadia Code',monospace", "center");
        }
      }
    }
  }
  let raf;
  function frame() { renderPass(performance.now() / 1000); raf = requestAnimationFrame(frame); }
  function startLoop() { if (!raf) frame(); }

  G.viz = { attachTile, attachMap, attachSpark, attachAnomaly, starfield, startLoop, renderPass, drawAnomalyShot };
})();

</script>
<script>
/* ============================================================
   GHOST // ui.js — DOM panels + wiring to the engine bus
   ============================================================ */
(function () {

  const G = window.G;

  /* ============================================================

  function boot(done) {

        h("div", { class: "tag" }, "Autonomous Command Center · Fable 5 core"),

      h("div", { class: "boot-bar" }, bar),
    ]));

    const seq = [
      ["Initializing GHOST kernel", "ok"],
      ["Mounting Fable 5 vision + reasoning core", "hi"],
      ["Linking 8 machines · 2 desktops · VPS · phone · CRM", "ok"],
      ["Bridging PiKVM-01 · Pi cluster · Vault NAS", "ok"],
      ["Waking agents: ORCHESTRATOR · RECON · FORGE · KEEP", "hi"],
      ["Arming ARGUS visual-verification pipeline", "ok"],
      ["WARDEN security sentinel online — no threats", "ok"],
      ["Calibrating cameras · smart plugs · foot pedals", "ok"],
      ["All systems nominal. Standing by for mission.", "hi"],
    ];
    let i = 0;
    const iv = setInterval(() => {
      if (i < seq.length) {
        const [s, c] = seq[i];

        while (log.childNodes.length > 8) log.removeChild(log.firstChild);

        i++;
      } else {
        clearInterval(iv);
        setTimeout(() => { el.classList.add("done"); setTimeout(() => { el.remove(); done(); }, 700); }, 500);
      }
    }, 340);
  }

  /* ============================================================

        h("div", null, [h("div", { class: "word" }, "GHOST"), h("div", { class: "sub" }, "COMMAND CENTER")]),
      ]),
      h("div", { class: "sep" }),
      h("div", { class: "midcol", style: { display: "flex", flexDirection: "column", gap: "2px" } }, [
        h("div", { class: "sysline" }, [h("span", { class: "k up" }, "Mode"), refs.mode]),
        h("div", { class: "sysline", style: { minWidth: "0" } }, [h("span", { class: "k up" }, "Mission"), refs.missionTitle]),
      ]),
      h("div", { class: "meters" }, [
        meter("Cost", refs.cost, refs.costBar),
        meter("Tokens", refs.tok, refs.tokBar),
        h("div", { class: "meter" }, [
          h("div", { class: "lbl up" }, [h("span", null, "Throughput"), h("span", { class: "clockk" })]),

      h("div", { class: "sep" }),

        h("div", { class: "sysline" }, [h("span", { class: "k up" }, "Uptime"), refs.clock]),
        refs.threat,
      ]),

    ]);
  }
  function meter(label, valEl, barEl) {
    return h("div", { class: "meter" }, [

  /* ============================================================

  function buildRail() {

      const b = h("button", { class: "mode" + (m.id === G.state.mode ? " active" : ""), title: m.blurb, onclick: () => G.engine.setMode(m.id) }, [

    refs.statMachines = h("div", { class: "n" }, "8");

    mount(el, [
      h("div", { class: "logo-lab" }, "GHOST · OS"),
      ...modeEls,
      h("button", { class: "rail-btn", title: "3D Home Lab", onclick: openHomelab }, "🧊"),
      h("div", { class: "rail-stats" }, [
        railStat(refs.statAgents, "Agents"),
        railStat(refs.statMachines, "Online"),
        railStat(refs.statAnom, "Caught"),

  function railStat(nEl, label) { return h("div", { class: "rail-stat" }, [nEl, h("div", { class: "l" }, label)]); }

  /* ============================================================
     MACHINE GRID
     ============================================================ */
  function buildGrid() {
    const el = $("#machinegrid");
    const body = h("div", { class: "mg-body" });
    refs.tiles = {};

      const cv = h("canvas");
      const dot = h("span", { class: "dot idle" });
      const st = h("span", { class: "st dim" }, "ONLINE");
      const task = h("div", { class: "tile-task" }, [h("span", { class: "who" }, ""), h("span", { class: "tt" }, "Standby")]);
      const prog = h("i");
      const rec = h("div", { class: "rec", style: { display: "none" } }, [h("i"), "REC"]);
      const tile = h("div", { class: "tile", data: { id: m.id }, onclick: () => selectTile(m.id) }, [
        h("div", { class: "tile-h" }, [dot, h("span", { class: "nm" }, m.name), h("span", { class: "kind" }, m.kind), st]),
        h("div", { class: "tile-screen" }, [cv, h("div", { class: "scrim" }), rec, h("div", { class: "res" }, m.res)]),
        h("div", { class: "tile-f" }, [task, h("div", { class: "tile-prog" }, prog)]),
      ]);
      refs.tiles[m.id] = { tile, dot, st, task, prog, rec, cv };
      body.appendChild(tile);
      G.viz.attachTile(cv, m.id);
    });
    mount(el, [
      panelH("Fleet · Live Screens", h("span", { class: "tick" }, "8 NODES")),
      body,
    ]);
    updateAllMachines();
  }
  function selectTile(id) {
    Object.values(refs.tiles).forEach((t) => t.tile.classList.remove("sel"));
    refs.tiles[id].tile.classList.add("sel");
    const m = G.engine.machineById(id);
    toast("ok", "🖥️", `${m.name} — ${m.kind} · ${m.res}${m.task ? " · " + m.task : ""}`);
  }
  function updateMachine(m) {
    const r = refs.tiles[m.id]; if (!r) return;
    const cls = m.status === "offline" ? "danger" : m.status === "busy" ? "busy" : m.id === "SEC" ? "ok" : "idle";
    r.dot.className = "dot " + cls;
    r.st.textContent = m.status.toUpperCase();
    r.st.className = "st " + (m.status === "busy" ? "hot" : m.status === "offline" ? "" : "dim");
    r.st.style.color = m.status === "offline" ? "var(--danger)" : "";
    r.task.querySelector(".who").textContent = m.agent ? DATA.agents[m.agent].name : "";
    r.task.querySelector(".tt").textContent = m.task || (m.status === "busy" ? "Working…" : "Standby");
    r.prog.style.width = (m.prog * 100) + "%";
    r.prog.className = m.alert ? "warn" : "";
    r.rec.style.display = m.status === "busy" ? "flex" : "none";
    r.tile.classList.toggle("alert", !!m.alert);
  }
  function updateAllMachines() { G.state.machines.forEach(updateMachine); }

  /* ============================================================
     TIMELINE
     ============================================================ */
  function buildTimeline() {
    refs.tlBody = h("div", { class: "tl-body" });

    renderTimeline();
  }
  function renderTimeline() {
    const body = refs.tlBody; clear(body);
    const mission = G.state.mission; if (!mission) return;
    mission.steps.forEach((step, i) => {

      body.appendChild(h("div", { class: "tl-step " + status }, [

          h("div", { class: "node" }, status === "done" ? "✓" : status === "active" ? "▸" : (i + 1)),
          h("div", { class: "line" }),
        ]),
        h("div", { class: "txt" }, [
          h("div", { class: "t" }, step.title),
          h("div", { class: "m" }, step.detail),
        ]),
      ]));
    });
    // autoscroll to active
    const active = body.querySelector(".tl-step.active");
    if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  /* ============================================================
     SYSTEM MAP
     ============================================================ */
  function buildMap() {
    const cv = h("canvas");

    const a = msg.agent;
    const el = h("div", { class: "msg " + (msg.kind === "system" ? "system" : msg.kind === "alert" ? "alert" : "") }, [
      h("div", { class: "av", style: { background: a.color, boxShadow: "0 0 10px " + a.color + "66" } }, a.av),
      h("div", { class: "body" }, [
        h("div", { class: "meta" }, [

     ANOMALY PANEL

  function buildAnomaly() {

  /* ============================================================
     CONTROLS

  function buildControls() {
    refs.btnApprove = cbtn("approve", "✓", "Approve", () => G.engine.approveGate());

    mount($("#controls"), [
      panelH("Mission Controls"),

  function cbtn(cls, ic, label, onclick) {
    return h("button", { class: "cbtn " + cls, onclick }, [h("span", { class: "ic" }, ic), h("span", null, label)]);
  }
  function refreshControls() {
    const s = G.state;

    refs.btnApprove.classList.toggle("pending", s.awaitingGate);

  /* ============================================================
     DECK — command bar + replay scrubber
     ============================================================ */
  function buildDeck() {
    // command bar
    refs.cmdInput = h("input", { class: "cmd-input", placeholder: "Give GHOST a mission…  e.g. “Launch a website & sales system for a roofing company”", onkeydown: onCmdKey });
    refs.voiceBtn = h("button", { class: "cmd-voice", onclick: onVoice }, [h("span", null, "🎙️"), h("span", null, "VOICE")]);
    const chips = h("div", { class: "cmd-suggest" }, [
      chip("🛠️ Roofing build mission", () => launchFromPrompt(DATA.missions.build.prompt, "build")),
      chip("🏢 Run RSG operations", () => G.engine.setMode("company")),
      chip("🔬 Research mission", () => G.engine.setMode("research")),

    ]);
    const cmd = h("div", { class: "panel cmdbar" }, [

        refs.cmdInput,

        refs.voiceBtn,

    // replay
    const spark = h("canvas");
    refs.scrubFill = h("i");
    refs.scrubKnob = h("b");
    refs.scrubTime = h("div", { class: "tc" }, "00:00 / 00:00");
    refs.playBtn = h("button", { class: "pb", onclick: () => G.engine.pause() }, "⏸");
    refs.replayTag = h("span", { class: "tag" }, "REC ●");
    const track = h("div", { class: "track", onclick: () => { } }, [refs.scrubFill, refs.scrubKnob]);
    const replay = h("div", { class: "panel replay" }, [
      h("div", { class: "replay-h" }, [h("span", null, "◉ Mission Replay & Telemetry"), refs.replayTag]),
      h("div", { class: "spark" }, spark),

  function chip(label, onclick) { return h("button", { class: "chip", onclick }, label); }
  function onCmdKey(e) { if (e.key === "Enter") submitCmd(); }
  function submitCmd() {
    const v = refs.cmdInput.value.trim();
    if (!v) return;
    if (refs.cmdInput.dataset.mode === "redirect") {
      G.engine.redirect(v);
      refs.cmdInput.value = ""; refs.cmdInput.dataset.mode = "";
      refs.cmdInput.placeholder = "Give GHOST a mission…";
      return;
    }
    const mode = classify(v);
    refs.cmdInput.value = "";
    launchFromPrompt(v, mode);
  }
  function classify(v) {
    const s = v.toLowerCase();
    if (/incident|down|failing|500|outage|broken|war ?room/.test(s)) return "warroom";
    if (/research|investigate|compare|report|study/.test(s)) return "research";
    if (/lead|proposal|client|crm|monthly|ops|operation|company/.test(s)) return "company";
    if (/voice|onehand|hands|accessib/.test(s)) return "onehand";
    return "build";
  }

  /* ============================================================
     LAUNCHER OVERLAY
     ============================================================ */
  function launchFromPrompt(prompt, mode) {
    const mission = DATA.missions[mode] || DATA.missions.build;
    const el = $("#launcher");
    el.hidden = false;
    const plan = h("div", { class: "launch-plan" });
    mission.steps.forEach((s, i) => plan.appendChild(h("div", { class: "pl", style: { animationDelay: (i * 60) + "ms" } }, [
      h("span", { class: "i" }, i + 1), h("span", null, s.title),
    ])));
    mount(el, h("div", { class: "sheet" }, [
      h("div", { class: "sheet-h" }, [h("h3", null, "Mission Briefing"), h("button", { class: "x", onclick: () => (el.hidden = true) }, "✕")]),
      h("div", { class: "launcher-body" }, [
        h("div", { class: "launch-title" }, DATA.modes.find((m) => m.id === mode).name + " Mode"),
        h("div", { class: "launch-mission" }, [
          h("div", { class: "faint up", style: { fontSize: "9px", marginBottom: "6px" } }, "Directive"),
          h("div", { class: "q" }, "“" + prompt + "”"),
        ]),
        h("div", { class: "faint up", style: { fontSize: "9px", margin: "16px 0 4px" } }, "GHOST plan · " + mission.steps.length + " phases"),
        plan,
        h("div", { class: "launch-actions" }, [
          h("button", { class: "launch-go", onclick: () => { el.hidden = true; G.engine.setMode(mode); } }, "▸ DEPLOY MISSION"),
          h("button", { class: "launch-cancel", onclick: () => (el.hidden = true) }, "Cancel"),
        ]),
      ]),
    ]));
  }

  /* ============================================================
     HOME LAB 3D
     ============================================================ */
  function openHomelab() {
    const el = $("#homelab");
    el.hidden = false;
    const scene = h("div", { class: "lab-scene" });
    scene.appendChild(h("div", { class: "lab-floor" }));
    const n = DATA.labDevices.length, R = 210;
    DATA.labDevices.forEach((d, i) => {
      const a = (i / n) * Math.PI * 2;
      const x = Math.cos(a) * R, z = Math.sin(a) * R;
      const node = h("div", { class: "lab-node", style: { transform: `translate(-50%,-50%) translate3d(${x}px, ${(i % 2 ? -1 : 1) * 22}px, ${z}px) rotateY(${-a}rad)` } }, [
        h("div", { class: "n" }, [h("span", { class: "dot ok" }), d.name]),
        h("div", { class: "ico" }, d.ico),
        h("div", { class: "k" }, d.kind),
      ]);
      scene.appendChild(node);
    });
    mount(el, h("div", { class: "sheet", style: { width: "min(880px,92vw)" } }, [
      h("div", { class: "sheet-h" }, [h("h3", null, "🧊 Home Lab · Physical Fleet"), h("button", { class: "x", onclick: () => (el.hidden = true) }, "✕")]),
      h("div", { class: "sheet-body" }, [
        h("div", { class: "lab-stage" }, scene),
        h("div", { class: "lab-cap" }, "Live 3D map of connected hardware. GHOST can power-cycle any node via smart plugs, take over a frozen machine through PiKVM-01, and migrate a running mission to another workstation — resuming from the last checkpoint."),
      ]),
    ]));
  }

  /* ============================================================
     EMERGENCY + TOASTS
     ============================================================ */
  function onKill() {
    if (G.state.locked) { G.engine.restore(); document.body.classList.remove("lockdown"); return; }
    G.engine.emergencyStop();
    document.body.classList.add("lockdown");
    toast("danger", "⛔", "EMERGENCY STOP engaged. All agents halted, fleet powered down.", 0, [
      { label: "RESTORE FLEET", onclick: (tEl) => { G.engine.restore(); document.body.classList.remove("lockdown"); tEl.remove(); } },
    ]);
  }
  function toast(kind, ic, text, ttl, actions) {
    const stack = $("#toast");
    const el = h("div", { class: "toast " + (kind || "") }, [
      h("span", { class: "ic" }, ic || "•"),
      h("div", null, [
        h("div", null, text),
        actions ? h("div", { style: { marginTop: "7px", display: "flex", gap: "6px" } },
          actions.map((a) => h("button", { class: "chip", style: { borderColor: "var(--danger)", color: "var(--danger-bright)" }, onclick: () => a.onclick(el) }, a.label))) : null,
      ]),
    ]);
    stack.appendChild(el);
    if (ttl !== 0) setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, ttl || 4200);
  }

  /* ============================================================
     SMALL HELPERS + WIRING
     ============================================================ */
  function panelH(title, right) {
    return h("div", { class: "panel-h" }, [h("span", { class: "led" }), h("span", null, title), right || null]);
  }

  function onVoice() {
    if (refs.voiceBtn.classList.contains("live")) return;
    refs.voiceBtn.classList.add("live");
    toast("ok", "🎙️", "Listening… (voice input simulated for this demo)");
    setTimeout(() => {
      addMessageRaw("You", "“GHOST — wake the lab, pull last night's leads, put the roofing quote on the big screen.”");
      setTimeout(() => { refs.voiceBtn.classList.remove("live"); G.engine.setMode("onehand"); }, 900);
    }, 1600);
  }
  function addMessageRaw(name, text) {
    addMessage({ agent: { name, role: "Operator", color: "#eafffd", av: "◈" }, text, kind: "msg", time: new Date() });
  }

  function updateMeters(m) {
    refs.cost.textContent = G.money(m.cost);
    refs.tok.textContent = G.compact(m.tokens);
    refs.rate.textContent = G.compact(m.rate) + "/s";
    refs.costBar.style.width = Math.min(100, m.cost / 6 * 100) + "%";
    refs.tokBar.style.width = Math.min(100, m.tokens / 480000 * 100) + "%";
    refs.tokBar.className = "amber";
  }
  function updateTick(s) {
    const up = Math.floor((Date.now() - s.uptimeStart) / 1000);
    refs.clock.textContent = G.dur(up).length > 5 ? G.dur(up) : "00:" + G.dur(up);
    refs.clock.textContent = new Date(up * 1000).toISOString().substr(11, 8);
    refs.statAgents.textContent = s.stats.agentsActive;
    refs.statMachines.textContent = s.stats.machinesOnline;
    refs.statAnom.textContent = s.stats.anomaliesCaught;
    // scrubber
    const frac = s.totalDur ? G.clampv(s.simTime / s.totalDur, 0, 1) : 0;
    refs.scrubFill.style.width = (frac * 100) + "%";
    refs.scrubKnob.style.left = (frac * 100) + "%";
    refs.scrubTime.textContent = G.dur(s.simTime) + " / " + G.dur(s.totalDur);
    refs.playBtn.textContent = s.paused || !s.running ? "▶" : "⏸";
    refs.replayTag.textContent = s.complete ? "◉ SAVED" : s.running && !s.paused ? "REC ●" : "❚❚ PAUSED";
  }
  function updateThreat(level) {
    const map = { nominal: ["ok", "THREAT · NOMINAL", ""], elevated: ["warn", "THREAT · ELEVATED", "warn"], lockdown: ["danger", "⛔ LOCKDOWN", "danger"] };
    const [dot, label, cls] = map[level] || map.nominal;
    refs.threat.className = "threat " + cls;
    refs.threat.innerHTML = "";
    G.append(refs.threat, [h("span", { class: "dot " + dot }), h("span", null, label)]);
  }
  function updateModeUI(mode) {
    Object.entries(refs.modeBtns).forEach(([id, b]) => b.classList.toggle("active", id === mode));
    refs.mode.textContent = mode.toUpperCase();
  }

  function wire() {
    G.bus.on("feed", addMessage);
    G.bus.on("machine", updateMachine);
    G.bus.on("machine:all", updateAllMachines);
    G.bus.on("metrics", updateMeters);
    G.bus.on("tick", updateTick);
    G.bus.on("step", renderTimeline);
    G.bus.on("mission:start", (mission) => { refs.missionTitle.textContent = mission.title; refs.missionTitle.title = mission.title; renderTimeline(); refreshControls(); updateThreat(G.state.threat); });
    G.bus.on("mission:end", () => { renderTimeline(); refreshControls(); });
    G.bus.on("gate", () => refreshControls());
    G.bus.on("control", () => refreshControls());
    G.bus.on("anomaly", showAnomaly);
    G.bus.on("mode", updateModeUI);
    G.bus.on("emergency", () => { updateThreat("lockdown"); refreshControls(); });
    G.bus.on("restore", () => { updateThreat("nominal"); refreshControls(); });
    G.bus.on("toast", (t) => toast(t.kind, t.ic, t.text));
  }

  G.ui = { boot, buildAll: function () { buildTopbar(); buildRail(); buildGrid(); buildTimeline(); buildMap(); buildFeed(); buildAnomaly(); buildControls(); buildDeck(); wire(); }, toast };
})();

</script>
<script>
/* ============================================================
   GHOST // app.js — bootstrap
   ============================================================ */
(function () {
  "use strict";
  const G = window.G;

  function init() {
    // ambient visuals run immediately (during boot)
    G.viz.starfield();
    G.viz.startLoop();

    G.ui.boot(function () {
      document.getElementById("shell").hidden = false;
      G.ui.buildAll();
      G.engine.run();
      // auto-launch the flagship Build mission so the room comes alive
      setTimeout(function () { G.engine.start("build"); }, 700);
    });

    // keyboard: space = pause/resume, Esc closes overlays
    document.addEventListener("keydown", function (e) {
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      if (e.code === "Space") { e.preventDefault(); G.engine.pause(); }
      if (e.key === "Escape") { ["homelab", "launcher"].forEach((id) => { const el = document.getElementById(id); if (el) el.hidden = true; }); }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
