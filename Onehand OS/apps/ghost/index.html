<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GHOST // Command Center</title>
  <meta name="description" content="GHOST — a cinematic AI command center that watches and operates your machines, sites, and business systems from one control room." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%BB%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles/core.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <!-- Ambient cinematic background layers -->
  <canvas id="starfield" class="fx-starfield" aria-hidden="true"></canvas>
  <div class="fx-grid" aria-hidden="true"></div>
  <div class="fx-vignette" aria-hidden="true"></div>
  <div class="fx-scanlines" aria-hidden="true"></div>
  <div class="fx-aurora" aria-hidden="true"></div>

  <!-- Boot sequence overlay -->
  <div id="boot" class="boot"></div>

  <!-- Main command-center shell -->
  <div id="shell" class="shell" hidden>
    <header id="topbar" class="topbar"></header>

    <aside id="moderail" class="moderail"></aside>

    <main class="stage">
      <section id="machinegrid" class="panel machinegrid"></section>
      <section class="midrow">
        <div id="timeline" class="panel timeline"></div>
        <div id="systemmap" class="panel systemmap"></div>
      </section>
    </main>

    <aside id="rightrail" class="rightrail">
      <div id="agentfeed" class="panel agentfeed"></div>
      <div id="anomaly" class="panel anomaly"></div>
      <div id="controls" class="panel controls"></div>
    </aside>

    <footer id="deck" class="deck"></footer>
  </div>

  <!-- Overlays -->
  <div id="homelab" class="overlay homelab-overlay" hidden></div>
  <div id="launcher" class="overlay launcher-overlay" hidden></div>
  <div id="toast" class="toast-stack" aria-live="polite"></div>

  <!-- Classic scripts (no build step, load order matters) -->
  <script src="js/lib.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/viz.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
