<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ONEHAND OS</title>
<style>
  :root{
    --bg:#06080d; --bg2:#0a0e16; --panel:#0e1420; --panel2:#131b2b;
    --line:#1d2740; --line2:#2a3a5f;
    --txt:#dbe6ff; --dim:#7d8db0; --faint:#4a5878;
    --acc:#4da3ff; --acc2:#8b5cf6; --good:#3ddc97; --warn:#ffb454;
    --glow:0 0 24px rgba(77,163,255,.25);
    --r:18px;
    --dock-side:right;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt); overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  /* ambient backdrop */
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0}
  .sky::before{content:"";position:absolute;inset:0;
    background:
      radial-gradient(1100px 600px at 78% -10%, rgba(77,163,255,.10), transparent 60%),
      radial-gradient(900px 700px at 12% 110%, rgba(139,92,246,.10), transparent 60%);
  }
  .sky::after{content:"";position:absolute;inset:0;opacity:.5;
    background-image:
      linear-gradient(rgba(77,163,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,163,255,.045) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
  }

  /* ---------- boot ---------- */
  #boot{position:fixed;inset:0;z-index:60;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .55s ease, visibility .55s;}
  #boot.gone{opacity:0;visibility:hidden}
  .boot-mark{font-size:52px;letter-spacing:.28em;font-weight:200;text-indent:.28em}
  .boot-mark b{font-weight:700;color:var(--acc)}
  .boot-sub{color:var(--dim);letter-spacing:.42em;font-size:11px;text-transform:uppercase;text-indent:.42em}
  .boot-bar{width:210px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
  .boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));
    animation:load 1.1s ease forwards}
  @keyframes load{to{width:100%}}

  /* ---------- home ---------- */
  #home{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
    padding:clamp(18px,4vh,44px) clamp(18px,4vw,56px);}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .brand{font-size:clamp(20px,2.6vw,30px);letter-spacing:.24em;font-weight:200}
  .brand b{font-weight:700;color:var(--acc)}
  .brand small{display:block;margin-top:6px;font-size:10px;letter-spacing:.4em;color:var(--faint);text-transform:uppercase}
  .clockbox{text-align:right}
  #clock{font-size:clamp(26px,3.4vw,40px);font-weight:200;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  #date{color:var(--dim);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-top:2px}

  .apps{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,300px));gap:clamp(14px,2vw,26px);
    width:100%;max-width:1060px;justify-content:center}
  .tile{position:relative;text-align:left;cursor:pointer;border-radius:var(--r);
    background:linear-gradient(160deg,var(--panel2),var(--panel));
    border:1px solid var(--line);padding:22px 22px 18px;color:var(--txt);
    min-height:168px;display:flex;flex-direction:column;gap:10px;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    font-family:inherit}
  .tile:hover,.tile:focus-visible{transform:translateY(-4px);border-color:var(--line2);box-shadow:var(--glow);outline:none}
  .tile:active{transform:translateY(-1px) scale(.99)}
  .tile .ico{font-size:30px;line-height:1;filter:drop-shadow(0 0 12px rgba(77,163,255,.35))}
  .tile h2{font-size:17px;letter-spacing:.14em;font-weight:600}
  .tile p{color:var(--dim);font-size:12.5px;line-height:1.55;flex:1}
  .tile .go{align-self:flex-end;font-size:11px;letter-spacing:.22em;color:var(--acc);text-transform:uppercase;opacity:0;transition:opacity .18s}
  .tile:hover .go,.tile:focus-visible .go{opacity:1}
  .tile .tag{position:absolute;top:16px;right:16px;font-size:9px;letter-spacing:.2em;color:var(--faint);
    border:1px solid var(--line);border-radius:99px;padding:3px 9px;text-transform:uppercase}

  footer{display:flex;align-items:center;justify-content:space-between;gap:14px;color:var(--faint);font-size:11px;letter-spacing:.14em}
  .hand{display:flex;gap:6px;align-items:center}
  .hand button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:8px 14px;border-radius:99px;cursor:pointer;font-size:11px;letter-spacing:.14em;font-family:inherit;
    transition:all .15s}
  .hand button.on{color:var(--txt);border-color:var(--acc);box-shadow:var(--glow)}
  #srv{color:var(--warn);display:none}

  /* ---------- app stage ---------- */
  #stage{position:fixed;inset:0;z-index:40;background:var(--bg);display:none}
  #stage.open{display:block}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}

  /* one-thumb dock — floats in the thumb zone, side switchable */
  #dock{position:fixed;z-index:50;bottom:max(20px, env(safe-area-inset-bottom));
    display:none;flex-direction:column;gap:10px}
  #stage.open ~ #dock{display:flex}
  body[data-hand="right"] #dock{right:18px}
  body[data-hand="left"]  #dock{left:18px}
  #dock button{
    width:58px;height:58px;border-radius:50%;cursor:pointer;font-family:inherit;
    background:rgba(14,20,32,.85);backdrop-filter:blur(10px);
    border:1px solid var(--line2);color:var(--txt);font-size:20px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 24px rgba(0,0,0,.5), var(--glow);
    transition:transform .15s, border-color .15s}
  #dock button:hover{transform:scale(1.07);border-color:var(--acc)}
  #dock button:active{transform:scale(.96)}
  #dock .lbl{position:absolute;pointer-events:none;opacity:0}

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body data-hand="right">
  <div class="sky"></div>

  <div id="boot" aria-hidden="true">
    <div class="boot-mark">ONEHAND&nbsp;<b>OS</b></div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-sub">one hand · full control</div>
  </div>

  <main id="home">
    <header>
      <div class="brand">ONEHAND <b>OS</b><small>RSG · one hand, full control</small></div>
      <div class="clockbox">
        <div id="clock">--:--</div>
        <div id="date"></div>
      </div>
    </header>

    <section class="apps" aria-label="Applications">
      <div class="grid">
        <button class="tile" data-app="apps/ghost/index.html" data-name="GHOST">
          <span class="tag">command</span>
          <span class="ico">👻</span>
          <h2>GHOST</h2>
          <p>AI command center. Watch a fleet of machines run whole missions — build, research, ops, war-room — with visual self-correction. Includes the voice-first OneHand mode.</p>
          <span class="go">Launch →</span>
        </button>

        <button class="tile" data-app="apps/forge/index.html" data-name="THE FORGE">
          <span class="tag">fabricate</span>
          <span class="ico">⚒</span>
          <h2>THE FORGE</h2>
          <p>Describe the problem, manufacture the solution: 3D model, PCB, firmware, BOM and build docs from one sentence — laid out around your hand.</p>
          <span class="go">Launch →</span>
        </button>

        <button class="tile" data-app="apps/ghost/nexus/index.html" data-name="NEXUS">
          <span class="tag">simulate</span>
          <span class="ico">🌆</span>
          <h2>NEXUS</h2>
          <p>The city that remembers. Thirty persistent residents with jobs, rumors, an economy and an election — Rusthook keeps living while you're away.</p>
          <span class="go">Launch →</span>
        </button>
      </div>
    </section>

    <footer>
      <span id="srv">⚠ open via serve.py — file:// blocks some app features</span>
      <span id="hint">tap a tile · esc closes an app</span>
      <div class="hand" role="group" aria-label="Hand preference">
        <button id="hl" aria-label="Left-hand mode">L</button>
        <button id="hr" aria-label="Right-hand mode">R</button>
      </div>
    </footer>
  </main>

  <div id="stage" role="region" aria-label="Running app"></div>
  <nav id="dock" aria-label="System dock">
    <button id="homeBtn" title="Home (Esc)" aria-label="Home">⌂</button>
  </nav>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var boot=$("#boot"), stage=$("#stage"), homeBtn=$("#homeBtn");

  /* boot splash */
  setTimeout(function(){ boot.classList.add("gone"); }, 1250);

  /* clock */
  function tick(){
    var d=new Date();
    $("#clock").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    $("#date").textContent=d.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"});
  }
  tick(); setInterval(tick,10000);

  /* hand preference (persisted) */
  var hand=localStorage.getItem("ohos.hand")||"right";
  function setHand(h){
    hand=h; document.body.setAttribute("data-hand",h);
    localStorage.setItem("ohos.hand",h);
    $("#hl").classList.toggle("on",h==="left");
    $("#hr").classList.toggle("on",h==="right");
  }
  $("#hl").onclick=function(){setHand("left")};
  $("#hr").onclick=function(){setHand("right")};
  setHand(hand);

  /* file:// notice — THE FORGE and NEXUS voice need http */
  if(location.protocol==="file:") $("#srv").style.display="inline";

  /* app launching */
  var frame=null;
  function launch(src,name){
    frame=document.createElement("iframe");
    frame.src=src; frame.title=name;
    stage.innerHTML=""; stage.appendChild(frame);
    stage.classList.add("open");
    document.title=name+" — ONEHAND OS";
    localStorage.setItem("ohos.last",src);
  }
  function goHome(){
    stage.classList.remove("open"); stage.innerHTML=""; frame=null;
    document.title="ONEHAND OS";
  }
  function bindTile(t){
    t.addEventListener("click",function(){ launch(t.dataset.app, t.dataset.name); });
  }
  document.querySelectorAll(".tile").forEach(bindTile);

  /* app manifest (apps.json) — points at the original app folders.
     On any failure (file://, missing, malformed) the static tiles above
     remain as the fallback. */
  fetch("apps.json").then(function(r){ return r.json(); }).then(function(m){
    if(!m || m.v!==1 || !Array.isArray(m.apps) || !m.apps.length) return;
    var grid=document.querySelector(".grid");
    grid.innerHTML="";
    m.apps.forEach(function(a){
      var b=document.createElement("button");
      b.className="tile";
      b.dataset.app=a.path+a.entry;
      b.dataset.name=a.name;
      b.innerHTML='<span class="tag"></span><span class="ico"></span><h2></h2><p></p><span class="go">Launch →</span>';
      b.querySelector(".tag").textContent=a.tag||"";
      b.querySelector(".ico").textContent=a.icon||"▣";
      b.querySelector("h2").textContent=a.name;
      b.querySelector("p").textContent=a.desc||"";
      bindTile(b);
      grid.appendChild(b);
    });
  }).catch(function(){});

  homeBtn.onclick=goHome;
  window.addEventListener("keydown",function(e){ if(e.key==="Escape") goHome(); });
})();
</script>
</body>
</html>
